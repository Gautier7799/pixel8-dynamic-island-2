name: Build PWA WebAPK for Pixel 8

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-pwa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK with Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          # تهيئة وبناء حزمة الـ APK
          npx @bubblewrap/cli init --manifest=dist/manifest.json --directory=android-twa || true
          cd android-twa && npx @bubblewrap/cli build || true

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-PWA-Pixel8.apk
          path: dist/

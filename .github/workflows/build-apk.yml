name: Build MT Capsule Material You V4.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for MT Capsule
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Dynamic Island Compose Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/dynamicisland/aipro app/src/main/res/mipmap-anydpi-v26

          cat << 'INNER_EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          INNER_EOF

          cat << 'INNER_EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DynamicIslandAIPro"
          include(":app")
          INNER_EOF

          cat << 'INNER_EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          INNER_EOF

          cat << 'INNER_EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.dynamicisland.aipro"
              compileSdk = 34
              defaultConfig { applicationId = "com.dynamicisland.aipro"; minSdk = 28; targetSdk = 34; versionCode = 19; versionName = "4.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MT Capsule Pro</string>
              <string name="accessibility_desc">MT Capsule nécessite le service d\'accessibilité pour afficher la capsule par-dessus la barre d\'état et pour garantir des performances optimales sans interruption.</string>
          </resources>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_desc"
              android:isAccessibilityTool="true" />
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#EAF5EB"/></shape>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0C3D1F" android:pathData="M34,44h40v20h-40zM44,44a10,10 0 0,1 20,0a10,10 0 0,1 -20,0z"/>
          </vector>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/IslandNotificationListener.kt
          package com.dynamicisland.aipro
          import android.app.Notification
          import android.content.Intent
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          class IslandNotificationListener : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val extras = sbn.notification.extras
                  val title = extras.getString("android.title") ?: return
                  val text = extras.getCharSequence("android.text")?.toString() ?: return
                  val intent = Intent("com.dynamicisland.aipro.NEW_EVENT")
                  intent.putExtra("type", "MSG"); intent.putExtra("title", title); intent.putExtra("text", text); intent.putExtra("icon", "💬"); intent.putExtra("color", "#0C3D1F")
                  sendBroadcast(intent)
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/DynamicIslandService.kt
          package com.dynamicisland.aipro
          import android.accessibilityservice.AccessibilityService
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.ComposeView
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleOwner
          import androidx.lifecycle.LifecycleRegistry
          import androidx.lifecycle.ViewModelStore
          import androidx.lifecycle.ViewModelStoreOwner
          import androidx.savedstate.SavedStateRegistry
          import androidx.savedstate.SavedStateRegistryController
          import androidx.savedstate.SavedStateRegistryOwner

          class MyLifecycleOwner : LifecycleOwner, ViewModelStoreOwner, SavedStateRegistryOwner {
              private val lifecycleRegistry = LifecycleRegistry(this)
              private val savedStateRegistryController = SavedStateRegistryController.create(this)
              private val store = ViewModelStore()
              override val lifecycle: Lifecycle get() = lifecycleRegistry
              override val savedStateRegistry: SavedStateRegistry get() = savedStateRegistryController.savedStateRegistry
              override val viewModelStore: ViewModelStore get() = store
              fun onCreate() { savedStateRegistryController.performRestore(null); lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_CREATE) }
              fun onStart() { lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START) }
              fun onResume() { lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_RESUME) }
              fun onDestroy() { lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_DESTROY) }
          }

          enum class IslandMode { IDLE, EVENT_COMPACT, EVENT_EXPANDED }
          data class IslandEvent(val type: String = "MSG", val title: String = "", val text: String = "", val icon: String = "💬", val colorStr: String = "#FFFFFF") {
              val color: Color get() = try { Color(android.graphics.Color.parseColor(colorStr)) } catch(e:Exception){ Color.White }
          }

          class DynamicIslandService : AccessibilityService() {
              private lateinit var windowManager: WindowManager
              private lateinit var composeView: ComposeView
              private lateinit var params: WindowManager.LayoutParams
              private lateinit var prefs: SharedPreferences
              private val lifecycleOwner = MyLifecycleOwner()

              private val islandModeState = mutableStateOf(IslandMode.IDLE)
              private val currentEventState = mutableStateOf(IslandEvent())
              private val islandWidthState = mutableStateOf(77.dp)
              private val islandHeightState = mutableStateOf(28.dp)

              private val handler = Handler(Looper.getMainLooper())
              private val collapseRunnable = Runnable { if (islandModeState.value == IslandMode.EVENT_COMPACT) islandModeState.value = IslandMode.IDLE }

              private val eventReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == "com.dynamicisland.aipro.NEW_EVENT") {
                          val type = intent.getStringExtra("type") ?: "MSG"
                          val title = intent.getStringExtra("title") ?: ""
                          val text = intent.getStringExtra("text") ?: ""
                          val icon = intent.getStringExtra("icon") ?: "💬"
                          val color = intent.getStringExtra("color") ?: "#FFFFFF"
                          currentEventState.value = IslandEvent(type, title, text, icon, color)
                          islandModeState.value = IslandMode.EVENT_COMPACT 
                          handler.removeCallbacks(collapseRunnable)
                          handler.postDelayed(collapseRunnable, 4500L)
                      }
                  }
              }

              private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { sharedPreferences, key ->
                  when (key) {
                      "width" -> islandWidthState.value = sharedPreferences.getInt("width", 77).dp
                      "height" -> islandHeightState.value = sharedPreferences.getInt("height", 28).dp
                      "pos_x" -> { params.x = sharedPreferences.getInt("pos_x", 0); windowManager.updateViewLayout(composeView, params) }
                      "pos_y" -> { params.y = sharedPreferences.getInt("pos_y", 28); windowManager.updateViewLayout(composeView, params) }
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  prefs = getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                  prefs.registerOnSharedPreferenceChangeListener(prefListener)
                  
                  lifecycleOwner.onCreate()
                  lifecycleOwner.onStart()
                  lifecycleOwner.onResume()

                  islandWidthState.value = prefs.getInt("width", 77).dp
                  islandHeightState.value = prefs.getInt("height", 28).dp

                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  composeView = ComposeView(this).apply {
                      setViewTreeLifecycleOwner(lifecycleOwner)
                      setViewTreeViewModelStoreOwner(lifecycleOwner)
                      setViewTreeSavedStateRegistryOwner(lifecycleOwner)
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(eventReceiver, IntentFilter("com.dynamicisland.aipro.NEW_EVENT"), Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(eventReceiver, IntentFilter("com.dynamicisland.aipro.NEW_EVENT"))
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_INSET_DECOR,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      x = prefs.getInt("pos_x", 0)
                      y = prefs.getInt("pos_y", 28)
                  }

                  composeView.setContent {
                      DynamicIslandContent(mode = islandModeState.value, event = currentEventState.value, baseWidth = islandWidthState.value, baseHeight = islandHeightState.value)
                  }
                  windowManager.addView(composeView, params)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  unregisterReceiver(eventReceiver)
                  prefs.unregisterOnSharedPreferenceChangeListener(prefListener)
                  lifecycleOwner.onDestroy()
                  if (::composeView.isInitialized) windowManager.removeView(composeView)
              }
          }

          @Composable
          fun DynamicIslandContent(mode: IslandMode, event: IslandEvent, baseWidth: Dp, baseHeight: Dp) {
              val targetWidth = when (mode) { IslandMode.IDLE -> baseWidth; IslandMode.EVENT_COMPACT -> 280.dp; IslandMode.EVENT_EXPANDED -> 330.dp }
              val targetHeight = when (mode) { IslandMode.IDLE -> baseHeight; IslandMode.EVENT_COMPACT -> baseHeight; IslandMode.EVENT_EXPANDED -> 125.dp }
              val animatedWidth by animateDpAsState(targetValue = targetWidth, animationSpec = spring(dampingRatio = 0.6f, stiffness = 400f), label = "")
              val animatedHeight by animateDpAsState(targetValue = targetHeight, animationSpec = spring(dampingRatio = 0.6f, stiffness = 400f), label = "")
              val cornerRadius by animateDpAsState(targetValue = if (mode == IslandMode.EVENT_EXPANDED) 28.dp else (baseHeight / 2f), label = "")

              Box(modifier = Modifier.width(animatedWidth).height(animatedHeight).background(Color.Black, RoundedCornerShape(cornerRadius))) {
                  androidx.compose.animation.AnimatedVisibility(visible = mode == IslandMode.EVENT_COMPACT, modifier = Modifier.align(Alignment.Center)) {
                      Row(modifier = Modifier.fillMaxSize().padding(horizontal = 14.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text(event.icon, fontSize = 12.sp)
                              Spacer(modifier = Modifier.width(8.dp))
                              Text(text = event.title, color = event.color, fontSize = 13.sp, fontWeight = FontWeight.Bold, maxLines = 1)
                          }
                          Text(text = event.text, color = Color.LightGray, fontSize = 12.sp, maxLines = 1)
                      }
                  }
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/MainActivity.kt
          package com.dynamicisland.aipro

          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.os.Bundle
          import android.provider.Settings
          import android.text.TextUtils
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.rounded.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          val MTCapsuleBg = Color(0xFFEAF5EB)
          val MTCapsuleText = Color(0xFF0C3D1F)
          val MTCapsuleAccent = Color(0xFFC4E8CE)
          val MTCapsuleCard = Color(0xFFFFFFFF)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                  setContent { MaterialTheme { MainScreen(prefs) } }
              }
          }

          fun isAccessibilityServiceEnabled(context: Context, service: Class<*>): Boolean {
              val enabledServices = Settings.Secure.getString(context.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
              val colonSplitter = TextUtils.SimpleStringSplitter(':')
              colonSplitter.setString(enabledServices)
              while (colonSplitter.hasNext()) {
                  val componentName = colonSplitter.next()
                  if (componentName.equals(ComponentName(context, service).flattenToString(), ignoreCase = true)) return true
              }
              return false
          }

          @Composable
          fun MainScreen(prefs: SharedPreferences) {
              var selectedTab by remember { mutableStateOf(0) }
              val context = LocalContext.current
              val isEnabled = remember { mutableStateOf(isAccessibilityServiceEnabled(context, DynamicIslandService::class.java)) }

              LaunchedEffect(Unit) { isEnabled.value = isAccessibilityServiceEnabled(context, DynamicIslandService::class.java) }

              Scaffold(
                  bottomBar = {
                      NavigationBar(containerColor = MTCapsuleBg) {
                          NavigationBarItem(
                              selected = selectedTab == 0,
                              onClick = { selectedTab = 0 },
                              icon = { Icon(Icons.Rounded.SquareFoot, contentDescription = null) },
                              label = { Text("Taille", fontWeight = FontWeight.Bold) },
                              colors = NavigationBarItemDefaults.colors(selectedIconColor = MTCapsuleText, unselectedIconColor = MTCapsuleText.copy(alpha = 0.5f), selectedTextColor = MTCapsuleText, unselectedTextColor = MTCapsuleText.copy(alpha = 0.5f), indicatorColor = MTCapsuleAccent)
                          )
                          NavigationBarItem(
                              selected = selectedTab == 1,
                              onClick = { selectedTab = 1 },
                              icon = { Icon(Icons.Rounded.FlashOn, contentDescription = null) },
                              label = { Text("Cartes", fontWeight = FontWeight.Bold) },
                              colors = NavigationBarItemDefaults.colors(selectedIconColor = MTCapsuleText, unselectedIconColor = MTCapsuleText.copy(alpha = 0.5f), selectedTextColor = MTCapsuleText, unselectedTextColor = MTCapsuleText.copy(alpha = 0.5f), indicatorColor = MTCapsuleAccent)
                          )
                          NavigationBarItem(
                              selected = selectedTab == 2,
                              onClick = { selectedTab = 2 },
                              icon = { Icon(Icons.Rounded.Settings, contentDescription = null) },
                              label = { Text("Paramètres", fontWeight = FontWeight.Bold) },
                              colors = NavigationBarItemDefaults.colors(selectedIconColor = MTCapsuleText, unselectedIconColor = MTCapsuleText.copy(alpha = 0.5f), selectedTextColor = MTCapsuleText, unselectedTextColor = MTCapsuleText.copy(alpha = 0.5f), indicatorColor = MTCapsuleAccent)
                          )
                      }
                  }
              ) { padding ->
                  Box(modifier = Modifier.padding(padding).fillMaxSize().background(MTCapsuleBg)) {
                      when (selectedTab) {
                          0 -> TailleEtPositionScreen(prefs, isEnabled.value)
                          1 -> CartesScreen()
                          2 -> ParametresScreen()
                      }
                  }
              }
          }

          @Composable
          fun TailleEtPositionScreen(prefs: SharedPreferences, isEnabled: Boolean) {
              var width by remember { mutableStateOf(prefs.getInt("width", 77).toFloat()) }
              var height by remember { mutableStateOf(prefs.getInt("height", 28).toFloat()) }
              var posX by remember { mutableStateOf(prefs.getInt("pos_x", 0).toFloat()) }
              var posY by remember { mutableStateOf(prefs.getInt("pos_y", 28).toFloat()) }
              val context = LocalContext.current

              Column(modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp)) {
                  Text("Taille et position", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = MTCapsuleText)
                  Spacer(modifier = Modifier.height(16.dp))

                  Card(modifier = Modifier.fillMaxWidth().height(180.dp), colors = CardDefaults.cardColors(containerColor = MTCapsuleCard), shape = RoundedCornerShape(24.dp)) {
                      Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.TopCenter) {
                          Box(modifier = Modifier.padding(top = 16.dp).size(20.dp).background(Color.Black, CircleShape))
                          Box(modifier = Modifier.offset(x = posX.dp, y = posY.dp).width(width.dp).height(height.dp).background(Color.Black.copy(alpha = 0.9f), RoundedCornerShape(height.dp / 2)))
                          Text("Exemple", modifier = Modifier.align(Alignment.TopStart).padding(16.dp), color = MTCapsuleText, fontWeight = FontWeight.Bold)
                      }
                  }

                  Spacer(modifier = Modifier.height(24.dp))
                  SliderControl("Position X", posX, -200f, 200f) { posX = it; prefs.edit().putInt("pos_x", it.toInt()).apply() }
                  SliderControl("Position Y", posY, 0f, 200f) { posY = it; prefs.edit().putInt("pos_y", it.toInt()).apply() }
                  SliderControl("Largeur", width, 30f, 300f) { width = it; prefs.edit().putInt("width", it.toInt()).apply() }
                  SliderControl("Hauteur", height, 10f, 100f) { height = it; prefs.edit().putInt("height", it.toInt()).apply() }
                  Spacer(modifier = Modifier.height(24.dp))
                  
                  if (!isEnabled) {
                      Button(
                          onClick = { context.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) },
                          modifier = Modifier.fillMaxWidth().height(56.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD32F2F))
                      ) {
                          Text("Activer l'Accessibilité pour MT Capsule", fontSize = 16.sp, color = Color.White)
                      }
                  }
              }
          }

          @Composable
          fun SliderControl(label: String, value: Float, min: Float, max: Float, onValueChange: (Float) -> Unit) {
              Column(modifier = Modifier.padding(vertical = 4.dp)) {
                  Row(horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth().padding(horizontal = 4.dp)) {
                      Text(label, color = MTCapsuleText, fontWeight = FontWeight.Bold)
                      Text(value.toInt().toString(), color = Color.Gray, fontWeight = FontWeight.Bold)
                  }
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = { onValueChange((value - 1f).coerceAtLeast(min)) }, modifier = Modifier.size(36.dp).clip(CircleShape).background(Color.White)) { Icon(Icons.Rounded.Remove, contentDescription = "-", tint = MTCapsuleText) }
                      Slider(value = value, onValueChange = onValueChange, valueRange = min..max, modifier = Modifier.weight(1f).padding(horizontal = 8.dp), colors = SliderDefaults.colors(thumbColor = MTCapsuleText, activeTrackColor = MTCapsuleText, inactiveTrackColor = MTCapsuleAccent))
                      IconButton(onClick = { onValueChange((value + 1f).coerceAtMost(max)) }, modifier = Modifier.size(36.dp).clip(CircleShape).background(Color.White)) { Icon(Icons.Rounded.Add, contentDescription = "+", tint = MTCapsuleText) }
                  }
              }
          }

          @Composable
          fun CartesScreen() {
              val context = LocalContext.current
              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Text("Material Capsule", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = MTCapsuleText)
                  Spacer(modifier = Modifier.height(16.dp))
                  Text("Événements de la mini-capsule", color = MTCapsuleText, fontWeight = FontWeight.Bold, modifier = Modifier.padding(bottom = 8.dp))
                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = MTCapsuleCard), shape = RoundedCornerShape(24.dp)) {
                      Row(modifier = Modifier.padding(20.dp).fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                          Box(modifier = Modifier.size(48.dp).background(MTCapsuleAccent, CircleShape), contentAlignment = Alignment.Center) { Icon(Icons.Rounded.Bolt, contentDescription = null, tint = MTCapsuleText) }
                          Box(modifier = Modifier.size(48.dp).background(MTCapsuleAccent, CircleShape), contentAlignment = Alignment.Center) { Icon(Icons.Rounded.MusicNote, contentDescription = null, tint = MTCapsuleText) }
                          Box(modifier = Modifier.size(48.dp).background(MTCapsuleAccent, CircleShape), contentAlignment = Alignment.Center) { Icon(Icons.Rounded.ChatBubbleOutline, contentDescription = null, tint = MTCapsuleText) }
                      }
                  }
                  Spacer(modifier = Modifier.height(24.dp))
                  Button(
                      onClick = {
                          val i = Intent("com.dynamicisland.aipro.NEW_EVENT")
                          i.putExtra("type", "MSG"); i.putExtra("title", "MT Capsule"); i.putExtra("text", "L'animation Material fonctionne!"); i.putExtra("icon", "✨"); i.putExtra("color", "#0C3D1F")
                          context.sendBroadcast(i)
                      },
                      modifier = Modifier.fillMaxWidth().height(56.dp), colors = ButtonDefaults.buttonColors(containerColor = MTCapsuleText)
                  ) { Text("Tester Animation", fontSize = 16.sp, color = Color.White) }
              }
          }

          @Composable
          fun ParametresScreen() {
              val context = LocalContext.current
              Column(modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp)) {
                  Text("Paramètres", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = MTCapsuleText)
                  Spacer(modifier = Modifier.height(16.dp))
                  Text("Apparence", color = MTCapsuleText, fontWeight = FontWeight.Bold, modifier = Modifier.padding(bottom = 8.dp))
                  Card(modifier = Modifier.fillMaxWidth().padding(bottom = 16.dp), colors = CardDefaults.cardColors(containerColor = MTCapsuleCard), shape = RoundedCornerShape(24.dp)) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          SettingItem(icon = Icons.Rounded.Palette, title = "Thème de l'application", subtitle = "Suivre le système")
                          HorizontalDivider(color = MTCapsuleBg)
                          SettingItem(icon = Icons.Rounded.Language, title = "Langue de l'application", subtitle = "Par défaut du système")
                      }
                  }
                  Text("Avancé", color = MTCapsuleText, fontWeight = FontWeight.Bold, modifier = Modifier.padding(bottom = 8.dp))
                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = MTCapsuleCard), shape = RoundedCornerShape(24.dp)) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          SettingItem(icon = Icons.Rounded.AccessibilityNew, title = "Accessibilité", subtitle = "Activer le service MT Capsule pour le fonctionnement", onClick = { context.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) })
                          HorizontalDivider(color = MTCapsuleBg)
                          SettingItem(icon = Icons.Rounded.BatteryAlert, title = "Ignorer l'optimisation batterie", subtitle = "Nécessaire si la capsule s'arrête", onClick = { context.startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)) })
                      }
                  }
              }
          }

          @Composable
          fun SettingItem(icon: ImageVector, title: String, subtitle: String, onClick: () -> Unit = {}) {
              Row(modifier = Modifier.fillMaxWidth().clickable { onClick() }.padding(vertical = 12.dp), verticalAlignment = Alignment.CenterVertically) {
                  Icon(icon, contentDescription = null, tint = MTCapsuleText, modifier = Modifier.size(28.dp))
                  Spacer(modifier = Modifier.width(16.dp))
                  Column(modifier = Modifier.weight(1f)) {
                      Text(title, fontWeight = FontWeight.Bold, color = MTCapsuleText, fontSize = 15.sp)
                      Text(subtitle, fontSize = 13.sp, color = Color.Gray, lineHeight = 16.sp)
                  }
                  Icon(Icons.Rounded.ChevronRight, contentDescription = null, tint = Color.LightGray)
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".DynamicIslandService" android:exported="true" android:label="MT Capsule Pro" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>
                  
                  <service android:name=".IslandNotificationListener" android:label="Dynamic Island Notifications" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          INNER_EOF
          
          gradle wrapper --gradle-version 8.4 --no-daemon

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Project Cache
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/MTCapsule-Pro.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MTCapsule-Pro
          path: release-output/MTCapsule-Pro.apk
          retention-days: 5

name: Build Dynamic Island Pixel 8 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. تثبيت إصدار Gradle 8.4 المتوافق 100% مع أندرويد
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # 4. إعداد Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. تنظيف وتجهيز موارد المشروع
      - name: Configure Android Project
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/dynamicisland/pixel8

          # تنظيف أسماء الملفات الخاطئة في drawable إن وجدت
          rm -rf app/src/main/res/drawable/*

          # ملف الخلفية الصحيح
          cat << 'EOF' > app/src/main/res/drawable/bg_island_capsule.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#000000" />
              <corners android:radius="24dp" />
              <stroke
                  android:width="1dp"
                  android:color="#33FFFFFF" />
          </shape>
          EOF

          # ضبط إعدادات AndroidX
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 6. البناء بدون أخطاء التوافق
      - name: Build Debug APK
        run: gradle assembleDebug -x test -x lint

      # 7. رفع وتجهيز ملف الـ APK للتحميل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-Pixel8-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

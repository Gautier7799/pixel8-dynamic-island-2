          # 11. محرك الجزيرة المطور مع حركات iOS الفيزيائية واللمس التفاعلي
          cat << 'EOF' > app/src/main/java/com/dynamicisland/pixel8/IslandOverlayService.kt
          package com.dynamicisland.pixel8

          import android.animation.ValueAnimator
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.PixelFormat
          import android.os.BatteryManager
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.View
          import android.view.WindowManager
          import android.view.animation.OvershootInterpolator
          import android.widget.ImageView
          import android.widget.TextView

          class IslandOverlayService : Service() {

              companion object {
                  private var windowManager: WindowManager? = null
                  private var islandView: View? = null
                  private var layoutParams: WindowManager.LayoutParams? = null
                  private val mainHandler = Handler(Looper.getMainLooper())
                  private var currentAnimator: ValueAnimator? = null

                  var isExpanded = false

                  fun startOverlay(context: Context) {
                      if (islandView != null) {
                          updateSize(context)
                          return
                      }

                      windowManager = context.applicationContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager

                      val layoutFlag = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY

                      val prefs = context.getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                      val w = prefs.getInt("width", 80)
                      val h = prefs.getInt("height", 26)
                      val y = prefs.getInt("pos_y", 6)
                      val density = context.resources.displayMetrics.density

                      val params = WindowManager.LayoutParams(
                          (w * density).toInt(),
                          (h * density).toInt(),
                          layoutFlag,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                          this.y = (y * density).toInt()
                      }

                      layoutParams = params
                      val inflater = LayoutInflater.from(context.applicationContext)
                      islandView = inflater.inflate(R.layout.view_pixel8_island, null)

                      islandView?.setOnClickListener {
                          if (!isExpanded) {
                              showExpandedEvent(
                                  context,
                                  R.drawable.ic_launcher_foreground,
                                  "Dynamic Island Pixel 8",
                                  "انقر مجدداً للطي أو اسحب للتحكم",
                                  "مفعّل"
                              )
                          } else {
                              collapseToIdle(context)
                          }
                      }

                      try {
                          windowManager?.addView(islandView, params)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }

                  fun updateSize(context: Context) {
                      val wm = windowManager ?: return
                      val view = islandView ?: return
                      val params = layoutParams ?: return

                      val prefs = context.getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                      val w = prefs.getInt("width", 80)
                      val h = prefs.getInt("height", 26)
                      val y = prefs.getInt("pos_y", 6)
                      val density = context.resources.displayMetrics.density

                      if (!isExpanded) {
                          params.width = (w * density).toInt()
                          params.height = (h * density).toInt()
                          params.y = (y * density).toInt()

                          try {
                              wm.updateViewLayout(view, params)
                          } catch (e: Exception) {}
                      }
                  }

                  fun showCompactEvent(context: Context, iconRes: Int, title: String, value: String) {
                      if (islandView == null) startOverlay(context)
                      val view = islandView ?: return

                      val layoutIdle = view.findViewById<View>(R.id.layoutIdle)
                      val layoutCompact = view.findViewById<View>(R.id.layoutCompact)
                      val layoutExpanded = view.findViewById<View>(R.id.layoutExpanded)

                      layoutIdle?.visibility = View.GONE
                      layoutExpanded?.visibility = View.GONE
                      layoutCompact?.visibility = View.VISIBLE

                      val ivIcon = view.findViewById<ImageView>(R.id.ivCompactIcon)
                      val tvTitle = view.findViewById<TextView>(R.id.tvCompactTitle)
                      val tvValue = view.findViewById<TextView>(R.id.tvCompactValue)

                      ivIcon?.setImageResource(iconRes)
                      tvTitle?.text = title
                      tvValue?.text = value

                      animateDimensions(context, targetWidthDp = 180, targetHeightDp = 34)

                      mainHandler.removeCallbacksAndMessages(null)
                      mainHandler.postDelayed({
                          collapseToIdle(context)
                      }, 4000)
                  }

                  fun showExpandedEvent(
                      context: Context,
                      iconRes: Int,
                      header: String,
                      subtext: String,
                      extra: String
                  ) {
                      if (islandView == null) startOverlay(context)
                      val view = islandView ?: return
                      isExpanded = true

                      val layoutIdle = view.findViewById<View>(R.id.layoutIdle)
                      val layoutCompact = view.findViewById<View>(R.id.layoutCompact)
                      val layoutExpanded = view.findViewById<View>(R.id.layoutExpanded)

                      layoutIdle?.visibility = View.GONE
                      layoutCompact?.visibility = View.GONE
                      layoutExpanded?.visibility = View.VISIBLE

                      val ivBadge = view.findViewById<ImageView>(R.id.ivExpandedBadge)
                      val tvHeader = view.findViewById<TextView>(R.id.tvExpandedHeader)
                      val tvSubtext = view.findViewById<TextView>(R.id.tvExpandedSubtext)
                      val tvExtra = view.findViewById<TextView>(R.id.tvExpandedExtra)

                      ivBadge?.setImageResource(iconRes)
                      tvHeader?.text = header
                      tvSubtext?.text = subtext
                      tvExtra?.text = extra

                      animateDimensions(context, targetWidthDp = 300, targetHeightDp = 90)

                      mainHandler.removeCallbacksAndMessages(null)
                      mainHandler.postDelayed({
                          collapseToIdle(context)
                      }, 6000)
                  }

                  fun collapseToIdle(context: Context) {
                      val view = islandView ?: return
                      isExpanded = false

                      val layoutIdle = view.findViewById<View>(R.id.layoutIdle)
                      val layoutCompact = view.findViewById<View>(R.id.layoutCompact)
                      val layoutExpanded = view.findViewById<View>(R.id.layoutExpanded)

                      layoutCompact?.visibility = View.GONE
                      layoutExpanded?.visibility = View.GONE
                      layoutIdle?.visibility = View.VISIBLE

                      val prefs = context.getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                      val w = prefs.getInt("width", 80)
                      val h = prefs.getInt("height", 26)

                      animateDimensions(context, targetWidthDp = w, targetHeightDp = h)
                  }

                  private fun animateDimensions(context: Context, targetWidthDp: Int, targetHeightDp: Int) {
                      val wm = windowManager ?: return
                      val view = islandView ?: return
                      val params = layoutParams ?: return
                      val density = context.resources.displayMetrics.density

                      val startWidth = params.width
                      val endWidth = (targetWidthDp * density).toInt()
                      val startHeight = params.height
                      val endHeight = (targetHeightDp * density).toInt()

                      currentAnimator?.cancel()
                      val animator = ValueAnimator.ofFloat(0f, 1f).apply {
                          duration = 320
                          interpolator = OvershootInterpolator(1.15f)
                          addUpdateListener { va ->
                              val frac = va.animatedFraction
                              params.width = (startWidth + (endWidth - startWidth) * frac).toInt()
                              params.height = (startHeight + (endHeight - startHeight) * frac).toInt()
                              try {
                                  wm.updateViewLayout(view, params)
                              } catch (e: Exception) {}
                          }
                      }
                      currentAnimator = animator
                      animator.start()
                  }
              }

              private val batteryReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (context == null || intent == null) return
                      val action = intent.action
                      if (action == Intent.ACTION_POWER_CONNECTED) {
                          val batteryStatus: Intent? = IntentFilter(Intent.ACTION_BATTERY_CHANGED).let { ifilter ->
                              context.registerReceiver(null, ifilter)
                          }
                          val level: Int = batteryStatus?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                          val scale: Int = batteryStatus?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                          val pct = if (level >= 0 && scale > 0) (level * 100 / scale) else 85
                          showCompactEvent(context, R.drawable.ic_bolt, "الشاحن السريع متصل", "$pct%")
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  startOverlay(this)
                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_POWER_CONNECTED)
                      addAction(Intent.ACTION_POWER_DISCONNECTED)
                  }
                  registerReceiver(batteryReceiver, filter)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      unregisterReceiver(batteryReceiver)
                  } catch (e: Exception) {}
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 12. خدمة مراقبة الإشعارات الحية
          cat << 'EOF' > app/src/main/java/com/dynamicisland/pixel8/NotificationReceiverService.kt
          package com.dynamicisland.pixel8

          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NotificationReceiverService : NotificationListenerService() {

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  IslandOverlayService.startOverlay(this)
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  val notif = sbn?.notification ?: return
                  val extras = notif.extras ?: return
                  val title = extras.getString("android.title") ?: return
                  val text = extras.getCharSequence("android.text")?.toString() ?: ""

                  if (title.isNotBlank()) {
                      IslandOverlayService.showExpandedEvent(
                          this,
                          R.drawable.ic_launcher_foreground,
                          title,
                          text,
                          "الآن"
                      )
                  }
              }
          }
          EOF


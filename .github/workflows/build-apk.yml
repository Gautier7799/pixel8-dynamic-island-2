          # --- توليد ملفات Gradle الضرورية ---
          gradle wrapper --gradle-version 8.4 --no-daemon

      # --- Build & Verification ---
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Clean & Debug Build
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      # --- Publish GitHub Release (The Professional CI/CD Step) ---
      - name: Publish GitHub Release automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_TAG="v2.3.${{ github.run_number }}.${{ github.run_attempt }}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APK_NAME="NovaIsland-Pro-V2.3-Enterprise.apk"
          
          cp "$APK_PATH" "$APK_NAME"
          
          RELEASE_INTRO=$(cat <<EOF
          > **NOVA ISLAND Pro $VERSION_TAG (Enterprise Edition)**

          ## Quoi de neuf dans V2.3 ?
          - **Capsule Interactive (Nouveau)** : La capsule est désormais interactive même au repos (IDLE). Un clic sur la capsule noire ouvre le menu de réception avec le message "Aucune nouvelle notification" s'il n'y a pas d'alerte en cours.
          - **Mise en place des Guidelines (AI Prompt)** : Inclus pour la sécurité du code.
          - **Smart Charging & Laboratoire** : Maintenus avec les dernières corrections de précision.

          ## Installation
          Téléchargez et installez l'APK : **[$APK_NAME](https://github.com/${{ github.repository }}/releases/download/$VERSION_TAG/$APK_NAME)**
          EOF
          )
          
          gh release delete "$VERSION_TAG" --cleanup-tag -y || true
          
          gh release create "$VERSION_TAG" "$APK_NAME" \
            --title "NOVA ISLAND Pro $VERSION_TAG (Enterprise Edition)" \
            --notes "$RELEASE_INTRO"

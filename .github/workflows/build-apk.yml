          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/IslandNotificationListener.kt
          package com.dynamicisland.aipro

          import android.app.Notification
          import android.content.Intent
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class IslandNotificationListener : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val extras = sbn.notification.extras
                  val title = extras.getString("android.title") ?: return
                  val text = extras.getCharSequence("android.text")?.toString() ?: return
                  val pkg = sbn.packageName
                  
                  // تجاهل المجموعات
                  if ((sbn.notification.flags and Notification.FLAG_GROUP_SUMMARY) != 0) return

                  // التحقق إذا كان الإشعار عبارة عن مقطع موسيقي
                  val isMedia = extras.containsKey(Notification.EXTRA_MEDIA_SESSION) || extras.getString(Notification.EXTRA_TEMPLATE) == "android.app.Notification\$MediaStyle"
                  
                  val intent = Intent("com.dynamicisland.aipro.NEW_EVENT")
                  sbn.notification.contentIntent?.let { intent.putExtra("contentIntent", it) }
                  
                  if (isMedia) {
                      intent.putExtra("type", "MUSIC")
                      intent.putExtra("title", title) // اسم الأغنية
                      intent.putExtra("text", text)   // اسم الفنان
                      intent.putExtra("icon", "🎵")
                      intent.putExtra("color", "#1DB954") // لون أخضر للموسيقى
                  } else {
                      // إشعار عادي
                      if (sbn.isOngoing) return // تجاهل الإشعارات المستمرة غير الموسيقية
                      
                      val colorHex = when {
                          pkg.contains("facebook") || pkg.contains("messenger") -> "#1877F2"
                          pkg.contains("whatsapp") -> "#25D366"
                          pkg.contains("instagram") -> "#E1306C"
                          pkg.contains("twitter") || pkg.contains("x") -> "#1DA1F2"
                          pkg.contains("snapchat") -> "#FFFC00"
                          pkg.contains("tiktok") -> "#00F2FE"
                          pkg.contains("youtube") -> "#FF0000"
                          pkg.contains("gmail") -> "#EA4335"
                          pkg.contains("telegram") -> "#0088CC"
                          else -> "#FFFFFF"
                      }
                      
                      intent.putExtra("type", "MSG")
                      intent.putExtra("title", title)
                      intent.putExtra("text", text)
                      intent.putExtra("icon", "💬")
                      intent.putExtra("color", colorHex)
                  }
                  
                  sendBroadcast(intent)
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/DynamicIslandService.kt
          package com.dynamicisland.aipro

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.graphics.PixelFormat
          import android.os.BatteryManager
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import androidx.compose.animation.animateContentSize
          import androidx.compose.animation.core.Spring
          import androidx.compose.animation.core.spring
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.ComposeView
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.LifecycleService
          import androidx.lifecycle.ViewModelStore
          import androidx.lifecycle.ViewModelStoreOwner
          import androidx.lifecycle.setViewTreeLifecycleOwner
          import androidx.lifecycle.setViewTreeViewModelStoreOwner
          import androidx.savedstate.SavedStateRegistry
          import androidx.savedstate.SavedStateRegistryController
          import androidx.savedstate.SavedStateRegistryOwner
          import androidx.savedstate.setViewTreeSavedStateRegistryOwner

          enum class IslandMode { IDLE, EVENT_COMPACT, EVENT_EXPANDED }

          data class IslandEvent(
              val type: String = "MSG",
              val title: String = "",
              val text: String = "",
              val icon: String = "💬",
              val colorStr: String = "#FFFFFF",
              val pendingIntent: android.app.PendingIntent? = null
          ) {
              val color: Color get() = try { Color(android.graphics.Color.parseColor(colorStr)) } catch(e:Exception){ Color.White }
          }

          class DynamicIslandService : LifecycleService(), ViewModelStoreOwner, SavedStateRegistryOwner {

              private lateinit var windowManager: WindowManager
              private lateinit var composeView: ComposeView
              private lateinit var params: WindowManager.LayoutParams
              private lateinit var prefs: SharedPreferences

              private val store = ViewModelStore()
              private val savedStateRegistryController = SavedStateRegistryController.create(this)
              override val viewModelStore: ViewModelStore get() = store
              override val savedStateRegistry: SavedStateRegistry get() = savedStateRegistryController.savedStateRegistry

              private val islandModeState = mutableStateOf(IslandMode.IDLE)
              private val currentEventState = mutableStateOf(IslandEvent())

              private val islandWidthState = mutableStateOf(130.dp)
              private val islandHeightState = mutableStateOf(38.dp)
              private val islandRadiusState = mutableStateOf(100.dp)
              private val glowWidthState = mutableStateOf(2.dp)

              private val handler = Handler(Looper.getMainLooper())
              private val collapseRunnable = Runnable { 
                  if (islandModeState.value == IslandMode.EVENT_COMPACT) {
                      islandModeState.value = IslandMode.IDLE 
                  }
              }

              private val eventReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == "com.dynamicisland.aipro.NEW_EVENT") {
                          val type = intent.getStringExtra("type") ?: "MSG"
                          val title = intent.getStringExtra("title") ?: ""
                          val text = intent.getStringExtra("text") ?: ""
                          val icon = intent.getStringExtra("icon") ?: "💬"
                          val color = intent.getStringExtra("color") ?: "#FFFFFF"
                          val pendingIntent = intent.getParcelableExtra<android.app.PendingIntent>("contentIntent")
                             
                          currentEventState.value = IslandEvent(type, title, text, icon, color, pendingIntent)
                          islandModeState.value = IslandMode.EVENT_COMPACT 
                             
                          handler.removeCallbacks(collapseRunnable)
                          handler.postDelayed(collapseRunnable, 4000)
                      }
                  }
              }

              private val powerReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == Intent.ACTION_POWER_CONNECTED) {
                          val bm = context?.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                          val level = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                          currentEventState.value = IslandEvent(type = "BATTERY", title = "جاري الشحن", text = "$level%", icon = "⚡", colorStr = "#00FF00")
                          islandModeState.value = IslandMode.EVENT_COMPACT
                          handler.removeCallbacks(collapseRunnable)
                          handler.postDelayed(collapseRunnable, 4000)
                      }
                  }
              }

              private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { _, key ->
                  when (key) {
                      "width" -> islandWidthState.value = prefs.getInt("width", 130).dp
                      "height" -> islandHeightState.value = prefs.getInt("height", 38).dp
                      "radius" -> islandRadiusState.value = prefs.getInt("radius", 100).dp
                      "glow" -> glowWidthState.value = prefs.getInt("glow", 2).dp
                      "pos_x", "pos_y" -> {
                          params.x = prefs.getInt("pos_x", 0)
                          params.y = prefs.getInt("pos_y", 32)
                          if (::composeView.isInitialized) windowManager.updateViewLayout(composeView, params)
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  savedStateRegistryController.performRestore(null)
                  
                  prefs = getSharedPreferences("IslandPrefs", Context.MODE_PRIVATE)
                  islandWidthState.value = prefs.getInt("width", 130).dp
                  islandHeightState.value = prefs.getInt("height", 38).dp
                  islandRadiusState.value = prefs.getInt("radius", 100).dp
                  glowWidthState.value = prefs.getInt("glow", 2).dp
                  prefs.registerOnSharedPreferenceChangeListener(prefListener)

                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  
                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      x = prefs.getInt("pos_x", 0)
                      y = prefs.getInt("pos_y", 32)
                  }

                  registerReceiver(eventReceiver, IntentFilter("com.dynamicisland.aipro.NEW_EVENT"), Context.RECEIVER_EXPORTED)
                  registerReceiver(powerReceiver, IntentFilter(Intent.ACTION_POWER_CONNECTED))

                  composeView = ComposeView(this).apply {
                      setViewTreeLifecycleOwner(this@DynamicIslandService)
                      setViewTreeViewModelStoreOwner(this@DynamicIslandService)
                      setViewTreeSavedStateRegistryOwner(this@DynamicIslandService)
                  }

                  var initialY = 0f
                  var initialTouchY = 0f
                  var isDragging = false

                  composeView.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialY = params.y.toFloat()
                              initialTouchY = event.rawY
                              isDragging = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val diffY = event.rawY - initialTouchY
                              if (Math.abs(diffY) > 10) isDragging = true
                              if (isDragging) {
                                  params.y = (initialY + diffY).toInt()
                                  windowManager.updateViewLayout(composeView, params)
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!isDragging) {
                                  // Click detected
                                  when (islandModeState.value) {
                                      IslandMode.IDLE, IslandMode.EVENT_COMPACT -> {
                                          islandModeState.value = IslandMode.EVENT_EXPANDED
                                          handler.removeCallbacks(collapseRunnable)
                                      }
                                      IslandMode.EVENT_EXPANDED -> islandModeState.value = IslandMode.IDLE
                                  }
                              } else {
                                  prefs.edit().putInt("pos_x", params.x).putInt("pos_y", params.y).apply()
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  composeView.setContent {
                      DynamicIslandContent(
                          mode = islandModeState.value,
                          event = currentEventState.value,
                          width = islandWidthState.value,
                          height = islandHeightState.value,
                          radius = islandRadiusState.value,
                          glow = glowWidthState.value,
                          onOpenSettings = {
                              islandModeState.value = IslandMode.IDLE
                              val intent = Intent(Settings.ACTION_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                              startActivity(intent)
                          }
                      )
                  }

                  windowManager.addView(composeView, params)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  unregisterReceiver(powerReceiver)
                  unregisterReceiver(eventReceiver)
                  prefs.unregisterOnSharedPreferenceChangeListener(prefListener)
                  if (::composeView.isInitialized) windowManager.removeView(composeView)
              }
          }

          @Composable
          fun DynamicIslandContent(
              mode: IslandMode,
              event: IslandEvent,
              width: androidx.compose.ui.unit.Dp,
              height: androidx.compose.ui.unit.Dp,
              radius: androidx.compose.ui.unit.Dp,
              glow: androidx.compose.ui.unit.Dp,
              onOpenSettings: () -> Unit
          ) {
              val targetWidth = when (mode) {
                  IslandMode.EVENT_COMPACT -> 340.dp
                  IslandMode.EVENT_EXPANDED -> 340.dp
                  else -> width
              }
              
              val borderModifier = if (mode != IslandMode.IDLE && glow > 0.dp) {
                  Modifier.border(width = glow, color = event.color, shape = RoundedCornerShape(radius))
              } else {
                  Modifier
              }

              Box(
                  modifier = Modifier
                      .width(targetWidth)
                      .then(
                          if (mode == IslandMode.EVENT_EXPANDED) 
                              Modifier.heightIn(min = 100.dp, max = 350.dp) // ديناميكي بناءً على النص
                          else 
                              Modifier.height(if (mode == IslandMode.EVENT_COMPACT) 70.dp else height)
                      )
                      .animateContentSize(animationSpec = spring(dampingRatio = 0.75f, stiffness = 500f))
                      .then(borderModifier)
                      .background(Color.Black, shape = RoundedCornerShape(radius))
                      .clickable {
                          try {
                              event.pendingIntent?.send()
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      },
                  contentAlignment = Alignment.TopCenter
              ) {
                  when (mode) {
                      IslandMode.IDLE -> { /* فارغة تماماً */ }
                      IslandMode.EVENT_COMPACT -> {
                          Row(
                              modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Box(modifier = Modifier.size(36.dp).background(Color(0xFF1E2320), CircleShape), contentAlignment = Alignment.Center) {
                                  Text(event.icon, fontSize = 16.sp)
                              }
                              Spacer(modifier = Modifier.width(12.dp))
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(text = event.title, color = event.color, fontSize = 14.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  Text(text = event.text, color = Color.LightGray, fontSize = 12.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              }
                          }
                      }
                      IslandMode.EVENT_EXPANDED -> {
                          Column(
                              modifier = Modifier.fillMaxWidth().verticalScroll(rememberScrollState()).padding(16.dp),
                              horizontalAlignment = Alignment.Start
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.fillMaxWidth()) {
                                  Box(modifier = Modifier.size(32.dp).background(Color(0xFF1E2320), CircleShape), contentAlignment = Alignment.Center) {
                                      Text(event.icon, fontSize = 14.sp)
                                  }
                                  Spacer(modifier = Modifier.width(12.dp))
                                  Text(text = event.title, color = event.color, fontSize = 15.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                                  
                                  // زر إعدادات الهاتف الداخلي
                                  Box(modifier = Modifier.size(32.dp).clip(CircleShape).background(Color(0xFF2D322E)).clickable { onOpenSettings() }, contentAlignment = Alignment.Center) {
                                      Text("⚙️", fontSize = 16.sp)
                                  }
                              }
                              Spacer(modifier = Modifier.height(12.dp))
                              // عرض النص كاملاً بدون حدود (Unlimited)
                              Text(text = event.text, color = Color.White, fontSize = 15.sp, lineHeight = 22.sp)
                          }
                      }
                  }
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/MainActivity.kt
          package com.dynamicisland.aipro

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  val prefs = getSharedPreferences("IslandPrefs", Context.MODE_PRIVATE)
                  val dp = resources.displayMetrics.density
                  
                  val bgDark = Color.parseColor("#090B0A")
                  val pillActive = Color.parseColor("#C2F2B4") // أخضر فاتح مشع
                  val textOnActive = Color.parseColor("#0D1C0F")
                  val cardBg = Color.parseColor("#141815")
                  
                  val scrollView = ScrollView(this).apply {
                      setBackgroundColor(bgDark)
                      isFillViewport = true
                  }
                  
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding((24*dp).toInt(), (40*dp).toInt(), (24*dp).toInt(), (40*dp).toInt())
                  }
                  scrollView.addView(root)

                  // عنوان التطبيق
                  root.addView(TextView(this).apply {
                      text = "Nova Island Pro"
                      textSize = 32f
                      setTextColor(Color.WHITE)
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER_HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                          bottomMargin = (32*dp).toInt()
                      }
                  })

                  // دالة لصناعة شريط تمرير (مستوحى من تصميم iOS Slider)
                  fun createMaterialSlider(initialValue: Float, min: Float, max: Float, onUpdate: (Float) -> Unit): View {
                      val containerHeight = (40*dp).toInt()
                      val container = FrameLayout(this@MainActivity).apply {
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, containerHeight)
                          background = GradientDrawable().apply {
                              setColor(cardBg)
                              cornerRadius = containerHeight / 2f
                          }
                      }
                      val fillView = View(this@MainActivity).apply {
                          background = GradientDrawable().apply {
                              setColor(pillActive)
                              cornerRadius = containerHeight / 2f
                          }
                      }
                      container.addView(fillView)
                      
                      var currentWidth = initialValue
                      
                      fun updateFillWidth(totalWidth: Int) {
                          if (totalWidth <= 0) return
                          val progress = (currentWidth - min) / (max - min)
                          val w = containerHeight + (progress * (totalWidth - containerHeight)).toInt()
                          fillView.layoutParams = FrameLayout.LayoutParams(w, ViewGroup.LayoutParams.MATCH_PARENT)
                      }

                      container.post { updateFillWidth(container.width) }

                      container.setOnTouchListener { v, event ->
                          val totalWidth = v.width
                          if (totalWidth <= 0) return@setOnTouchListener false

                          var newWidth = event.x.toInt()
                          if (newWidth < containerHeight) newWidth = containerHeight
                          if (newWidth > totalWidth) newWidth = totalWidth
                          
                          fillView.layoutParams = FrameLayout.LayoutParams(newWidth, ViewGroup.LayoutParams.MATCH_PARENT)
                          fillView.requestLayout()
                          
                          val progress = (newWidth - containerHeight).toFloat() / (totalWidth - containerHeight).toFloat()
                          currentWidth = min + (progress * (max - min))
                          onUpdate(currentWidth)
                          true
                      }
                      return container
                  }

                  fun createSliderSection(title: String, initial: Float, min: Float, max: Float, onUpdate: (Float) -> Unit) {
                      val label = TextView(this@MainActivity).apply {
                          text = title + ": " + initial.toInt()
                          textSize = 14f
                          setTextColor(Color.WHITE)
                          setPadding(0, 0, 0, (8*dp).toInt())
                      }
                      val slider = createMaterialSlider(initial, min, max) { newVal ->
                          label.text = title + ": " + newVal.toInt()
                          onUpdate(newVal)
                      }
                      val section = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                              bottomMargin = (20*dp).toInt()
                          }
                      }
                      section.addView(label)
                      section.addView(slider)
                      root.addView(section)
                  }

                  createSliderSection("سمك الضوء المتفاعل (Glow)", prefs.getInt("glow", 2).toFloat(), 0f, 10f) {
                      prefs.edit().putInt("glow", it.toInt()).apply()
                  }
                  createSliderSection("العرض (Width)", prefs.getInt("width", 130).toFloat(), 30f, 400f) {
                      prefs.edit().putInt("width", it.toInt()).apply()
                  }
                  createSliderSection("الارتفاع (Height)", prefs.getInt("height", 38).toFloat(), 10f, 150f) {
                      prefs.edit().putInt("height", it.toInt()).apply()
                  }
                  createSliderSection("الاستدارة (Corner Radius)", prefs.getInt("radius", 100).toFloat(), 0f, 150f) {
                      prefs.edit().putInt("radius", it.toInt()).apply()
                  }
                  createSliderSection("يمين / يسار (X Axis)", prefs.getInt("pos_x", 0).toFloat(), -600f, 600f) {
                      prefs.edit().putInt("pos_x", it.toInt()).apply()
                  }
                  createSliderSection("أعلى / أسفل (Y Axis)", prefs.getInt("pos_y", 32).toFloat(), -800f, 500f) {
                      prefs.edit().putInt("pos_y", it.toInt()).apply()
                  }

                  root.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(1, 0, 1f) }) 

                  val notifBtn = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1E2320")); cornerRadius = 24f * dp }
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, (56*dp).toInt())
                      gravity = Gravity.CENTER
                      addView(TextView(context).apply {
                          text = "صلاحية الإشعارات 💬"
                          textSize = 15f
                          setTextColor(Color.WHITE)
                          typeface = android.graphics.Typeface.DEFAULT_BOLD
                      })
                      setOnClickListener {
                          startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"))
                      }
                  }
                  root.addView(notifBtn)

                  val btn = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      background = GradientDrawable().apply { setColor(pillActive); cornerRadius = 24f * dp }
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, (56*dp).toInt()).apply {
                          topMargin = (12*dp).toInt()
                      }
                      gravity = Gravity.CENTER
                      addView(TextView(context).apply {
                          text = "تحديث الجزيرة 🚀"
                          textSize = 16f
                          setTextColor(textOnActive)
                          typeface = android.graphics.Typeface.DEFAULT_BOLD
                      })
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                              startActivity(intent)
                          } else {
                              startService(Intent(this@MainActivity, DynamicIslandService::class.java))
                          }
                      }
                  }
                  root.addView(btn)

                  setContentView(scrollView)
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".DynamicIslandService" android:exported="false" />
                  
                  <service android:name=".IslandNotificationListener" 
                           android:label="Dynamic Island Notifications" 
                           android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" 
                           android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          INNER_EOF
          
          gradle wrapper --gradle-version 8.4 --no-daemon

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Project Cache
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/Dynamic-Island-Pro.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Island-Pro
          path: release-output/Dynamic-Island-Pro.apk
          retention-days: 5

          cat << 'EOF' > app/src/main/java/com/dynamicisland/pixel8/MainActivity.kt
          package com.dynamicisland.pixel8

          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.NotificationManagerCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var prefs: SharedPreferences

              private lateinit var ivStatusOverlay: ImageView
              private lateinit var ivStatusNotif: ImageView
              private lateinit var tvOverlayAction: TextView
              private lateinit var tvNotifAction: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  prefs = getSharedPreferences("island_prefs", Context.MODE_PRIVATE)

                  val btnOverlay = findViewById<View>(R.id.btnOverlayPermission)
                  val btnNotification = findViewById<View>(R.id.btnNotificationPermission)
                  val btnStart = findViewById<Button>(R.id.btnStartService)

                  ivStatusOverlay = findViewById(R.id.ivStatusOverlay)
                  ivStatusNotif = findViewById(R.id.ivStatusNotif)
                  tvOverlayAction = findViewById(R.id.tvOverlayAction)
                  tvNotifAction = findViewById(R.id.tvNotifAction)

                  val btnTestCharging = findViewById<Button>(R.id.btnTestCharging)
                  val btnTestMusic = findViewById<Button>(R.id.btnTestMusic)
                  val btnTestHeadphones = findViewById<Button>(R.id.btnTestHeadphones)
                  val btnTestNotification = findViewById<Button>(R.id.btnTestNotification)

                  val sbWidth = findViewById<SeekBar>(R.id.sbWidth)
                  val sbHeight = findViewById<SeekBar>(R.id.sbHeight)
                  val sbPosY = findViewById<SeekBar>(R.id.sbPosY)

                  val tvWidth = findViewById<TextView>(R.id.tvWidthLabel)
                  val tvHeight = findViewById<TextView>(R.id.tvHeightLabel)
                  val tvPosY = findViewById<TextView>(R.id.tvPosYLabel)

                  val savedWidth = prefs.getInt("width", 75)
                  val savedHeight = prefs.getInt("height", 27)
                  val savedPosY = prefs.getInt("pos_y", 8)

                  sbWidth.progress = savedWidth
                  sbHeight.progress = savedHeight
                  sbPosY.progress = savedPosY

                  tvWidth.text = "$savedWidth dp"
                  tvHeight.text = "$savedHeight dp"
                  tvPosY.text = "$savedPosY dp"

                  sbWidth.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          val w = if (progress < 40) 40 else progress
                          tvWidth.text = "$w dp"
                          prefs.edit().putInt("width", w).apply()
                          IslandOverlayService.updateSize(this@MainActivity)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  sbHeight.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          val h = if (progress < 16) 16 else progress
                          tvHeight.text = "$h dp"
                          prefs.edit().putInt("height", h).apply()
                          IslandOverlayService.updateSize(this@MainActivity)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  sbPosY.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          tvPosY.text = "$progress dp"
                          prefs.edit().putInt("pos_y", progress).apply()
                          IslandOverlayService.updateSize(this@MainActivity)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  btnOverlay.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                      } else {
                          Toast.makeText(this, "إذن الظهور مفعّل مسبقاً!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnNotification.setOnClickListener {
                      openNotificationAccessSettings()
                  }

                  btnStart.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "يرجى منح إذن الظهور أولاً", Toast.LENGTH_SHORT).show()
                      } else {
                          val svcIntent = Intent(this, IslandOverlayService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(svcIntent)
                          } else {
                              startService(svcIntent)
                          }
                          Toast.makeText(this, "تم تشغيل Dynamic Island بنجاح!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnTestCharging.setOnClickListener {
                      IslandOverlayService.showCompactEvent(
                          this,
                          R.drawable.ic_bolt,
                          "الشاحن متصل",
                          "85%",
                          0xFF34D399.toInt()
                      )
                  }

                  btnTestMusic.setOnClickListener {
                      IslandOverlayService.showExpandedEvent(
                          this,
                          R.drawable.ic_spotify,
                          "Spotify Music",
                          "Starboy • The Weeknd",
                          "02:45",
                          0xFF1DB954.toInt()
                      )
                  }

                  btnTestHeadphones.setOnClickListener {
                      IslandOverlayService.showCompactEvent(
                          this,
                          R.drawable.ic_headphones,
                          "Pixel Buds Pro",
                          "100%",
                          0xFF38BDF8.toInt()
                      )
                  }

                  btnTestNotification.setOnClickListener {
                      IslandOverlayService.showExpandedEvent(
                          this,
                          R.drawable.ic_whatsapp,
                          "💬 WhatsApp (أحمد)",
                          "السلام عليكم، الجزيرة تعمل بكامل طاقتها مع المحيط الملون!",
                          "الآن",
                          0xFF25D366.toInt()
                      )
                  }
              }

              override fun onResume() {
                  super.onResume()
                  checkPermissionsStatus()
              }

              private fun checkPermissionsStatus() {
                  val overlayGranted = Settings.canDrawOverlays(this)
                  if (overlayGranted) {
                      tvOverlayAction.text = "مفعّل ✓"
                      tvOverlayAction.setTextColor(0xFF6DD58C.toInt())
                  } else {
                      tvOverlayAction.text = "تفعيل ❯"
                      tvOverlayAction.setTextColor(0xFF9ECAFF.toInt())
                  }

                  val notifGranted = isNotificationServiceEnabled()
                  if (notifGranted) {
                      tvNotifAction.text = "مفعّل ✓"
                      tvNotifAction.setTextColor(0xFF6DD58C.toInt())
                  } else {
                      tvNotifAction.text = "تفعيل ❯"
                      tvNotifAction.setTextColor(0xFF9ECAFF.toInt())
                  }
              }

              private fun isNotificationServiceEnabled(): Boolean {
                  val pkgName = packageName
                  val flat = Settings.Secure.getString(contentResolver, "enabled_notification_listeners")
                  if (flat != null && flat.isNotEmpty()) {
                      val names = flat.split(":")
                      for (name in names) {
                          val cn = ComponentName.unflattenFromString(name)
                          if (cn != null && cn.packageName == pkgName) {
                              return true
                          }
                      }
                  }
                  return false
              }

              private fun openNotificationAccessSettings() {
                  try {
                      val intent = Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)
                      startActivity(intent)
                  } catch (e: Exception) {
                      try {
                          val intent = Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS")
                          startActivity(intent)
                      } catch (e2: Exception) {
                          Toast.makeText(this, "ابحث عن 'الوصول إلى الإشعارات' في إعدادات النظام", Toast.LENGTH_LONG).show()
                      }
                  }
              }
          }

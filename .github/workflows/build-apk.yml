name: Build Nova Island Pro (Smart Intent Fix)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Nova Island Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Nova Island Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/novaisland/pro app/src/main/res/mipmap app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "NovaIslandPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.novaisland.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.novaisland.pro"; minSdk = 28; targetSdk = 34; versionCode = 10; versionName = "1.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.cardview:cardview:1.0.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Nova Island Pro</string>
          </resources>
          EOF

          # --- أيقونة الإعدادات ---
          cat << 'EOF' > app/src/main/res/drawable/ic_settings.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFF" android:pathData="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.06,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.73,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.06,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.43,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.49 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></vector>
          EOF

          # --- تصميم النافذة العائمة (الجزيرة) ---
          cat << 'EOF' > app/src/main/res/layout/island_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:padding="8dp">

              <androidx.cardview.widget.CardView
                  android:id="@+id/islandCard"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  app:cardBackgroundColor="#000000"
                  app:cardCornerRadius="40dp"
                  app:cardElevation="10dp"
                  android:clickable="true"
                  android:focusable="true">

                  <LinearLayout
                      android:id="@+id/islandContent"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="16dp">

                      <!-- الصف العلوي: الأيقونة، النصوص، الإعدادات -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical">

                          <ImageView
                              android:id="@+id/appIcon"
                              android:layout_width="40dp"
                              android:layout_height="40dp"
                              android:background="@drawable/circle_bg"
                              android:padding="4dp"
                              android:src="@mipmap/ic_launcher_round" />

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:orientation="vertical"
                              android:layout_marginStart="12dp"
                              android:layout_marginEnd="12dp">

                              <TextView
                                  android:id="@+id/appName"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Messenger"
                                  android:textColor="#FFFFFF"
                                  android:textSize="17sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:id="@+id/notifText"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Nouveau message"
                                  android:textColor="#B3B3B3"
                                  android:textSize="14sp"
                                  android:maxLines="1"
                                  android:ellipsize="end" />
                          </LinearLayout>

                          <ImageView
                              android:id="@+id/settingsBtn"
                              android:layout_width="36dp"
                              android:layout_height="36dp"
                              android:background="@drawable/circle_dark_bg"
                              android:padding="6dp"
                              android:src="@drawable/ic_settings" />
                      </LinearLayout>

                      <!-- زر الفتح -->
                      <LinearLayout
                          android:id="@+id/actionContainer"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="end"
                          android:layout_marginTop="16dp">

                          <TextView
                              android:id="@+id/btnOpen"
                              android:layout_width="wrap_content"
                              android:layout_height="42dp"
                              android:background="@drawable/btn_white_rounded"
                              android:gravity="center"
                              android:paddingStart="24dp"
                              android:paddingEnd="24dp"
                              android:text="Ouvrir"
                              android:textColor="#000000"
                              android:textSize="16sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                  </LinearLayout>
              </androidx.cardview.widget.CardView>
          </FrameLayout>
          EOF

          # --- خلفيات برمجية للأزرار ---
          cat << 'EOF' > app/src/main/res/drawable/circle_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#FFFFFF"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/circle_dark_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#2C2C2C"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/btn_white_rounded.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FFFFFF"/><corners android:radius="21dp"/></shape>
          EOF

          # --- واجهة التطبيق الرئيسية لمنح الصلاحيات ---
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="24dp"
              android:background="#121212">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Nova Island Pro"
                  android:textSize="32sp"
                  android:textStyle="bold"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="40dp"/>

              <Button
                  android:id="@+id/btnOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:text="1. تفعيل الظهور فوق التطبيقات"
                  android:layout_marginBottom="16dp"
                  android:backgroundTint="#2C2C2C"
                  android:textColor="#FFFFFF"/>

              <Button
                  android:id="@+id/btnListener"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:text="2. تفعيل قراءة الإشعارات"
                  android:backgroundTint="#2C2C2C"
                  android:textColor="#FFFFFF"/>
                  
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="بمجرد تفعيل الصلاحيتين، ستظهر الجزيرة عند وصول أي إشعار جديد."
                  android:textColor="#888888"
                  android:gravity="center"
                  android:layout_marginTop="32dp"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/novaisland/pro/MainActivity.kt
          package com.novaisland.pro

          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.NotificationManagerCompat

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  findViewById<Button>(R.id.btnOverlay).setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION))
                      }
                  }

                  findViewById<Button>(R.id.btnListener).setOnClickListener {
                      val enabledListeners = NotificationManagerCompat.getEnabledListenerPackages(this)
                      if (!enabledListeners.contains(packageName)) {
                          startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"))
                      }
                  }
              }
          }
          EOF

          # 🔥 Service: هنا يكمن السحر وإصلاح الـ Intent بسلاسة تامة 🔥
          cat << 'EOF' > app/src/main/java/com/novaisland/pro/IslandService.kt
          package com.novaisland.pro

          import android.animation.ValueAnimator
          import android.app.Notification
          import android.app.PendingIntent
          import android.content.Context
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.View
          import android.view.WindowManager
          import android.view.animation.OvershootInterpolator
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.cardview.widget.CardView

          class IslandService : NotificationListenerService() {

              private lateinit var windowManager: WindowManager
              private lateinit var islandView: View
              private lateinit var layoutParams: WindowManager.LayoutParams
              
              private lateinit var appNameTxt: TextView
              private lateinit var notifTextTxt: TextView
              private lateinit var appIconImg: ImageView
              private lateinit var actionContainer: LinearLayout
              private lateinit var islandCard: CardView
              private lateinit var btnOpen: TextView
              
              private var isExpanded = false
              private val handler = Handler(Looper.getMainLooper())
              
              // 🔥 هذا هو المتغير الذي سيحفظ أمر الفتح (Intent) 🔥
              private var currentPendingIntent: PendingIntent? = null
              private var collapseRunnable = Runnable { collapseIsland() }

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  islandView = LayoutInflater.from(this).inflate(R.layout.island_layout, null)
                  
                  appNameTxt = islandView.findViewById(R.id.appName)
                  notifTextTxt = islandView.findViewById(R.id.notifText)
                  appIconImg = islandView.findViewById(R.id.appIcon)
                  actionContainer = islandView.findViewById(R.id.actionContainer)
                  islandCard = islandView.findViewById(R.id.islandCard)
                  btnOpen = islandView.findViewById(R.id.btnOpen)

                  layoutParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  layoutParams.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                  layoutParams.y = 50 
                  
                  // 🔥 تنفيذ الفتح عند الضغط على الجزيرة أو زر Ouvrir 🔥
                  val openAction = View.OnClickListener {
                      try {
                          currentPendingIntent?.send()
                          collapseIsland()
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
                  
                  islandCard.setOnClickListener(openAction)
                  btnOpen.setOnClickListener(openAction)
                  
                  // إخفاء الجزيرة في البداية (حجم صفر)
                  islandView.alpha = 0f
                  islandView.scaleX = 0.5f
                  islandView.scaleY = 0.5f
                  
                  try {
                      windowManager.addView(islandView, layoutParams)
                  } catch (e: Exception) {}
              }

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  // نتجاهل الإشعارات المستمرة (مثل الموسيقى أو الشحن)
                  if (!sbn.isClearable) return

                  val notification = sbn.notification
                  val extras = notification.extras
                  
                  val title = extras.getString(Notification.EXTRA_TITLE)
                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString()
                  
                  if (title.isNullOrEmpty() && text.isNullOrEmpty()) return

                  // 🔥 حفظ الـ PendingIntent لاستخدامه عند الضغط 🔥
                  currentPendingIntent = notification.contentIntent
                  
                  handler.post {
                      appNameTxt.text = title ?: "الإشعار"
                      notifTextTxt.text = text ?: ""
                      
                      try {
                          val iconContext = createPackageContext(sbn.packageName, 0)
                          val drawable = notification.smallIcon?.loadDrawable(iconContext)
                          if (drawable != null) {
                              appIconImg.setImageDrawable(drawable)
                          } else {
                              appIconImg.setImageResource(R.mipmap.ic_launcher_round)
                          }
                      } catch (e: Exception) {
                          appIconImg.setImageResource(R.mipmap.ic_launcher_round)
                      }
                      
                      expandIsland()
                  }
              }

              private fun expandIsland() {
                  handler.removeCallbacks(collapseRunnable)
                  if (!isExpanded) {
                      isExpanded = true
                      islandView.animate()
                          .alpha(1f)
                          .scaleX(1f)
                          .scaleY(1f)
                          .setDuration(400)
                          .setInterpolator(OvershootInterpolator(1.2f))
                          .start()
                  }
                  // إخفاء تلقائي بعد 5 ثوانٍ
                  handler.postDelayed(collapseRunnable, 5000)
              }

              private fun collapseIsland() {
                  if (isExpanded) {
                      isExpanded = false
                      islandView.animate()
                          .alpha(0f)
                          .scaleX(0.5f)
                          .scaleY(0.5f)
                          .setDuration(300)
                          .start()
                  }
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification) {
                  // إذا تم مسح الإشعار من شريط الإشعارات، نخفي الجزيرة
                  if (currentPendingIntent == sbn.notification.contentIntent) {
                      handler.post { collapseIsland() }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::islandView.isInitialized) {
                      windowManager.removeView(islandView)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  
                  <service android:name=".IslandService" android:exported="true" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          
          # إنشاء أيقونات التطبيق
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#000000"/></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FFFFFF" android:pathData="M34,54h40v10h-40zM34,34h40v10h-40zM34,74h20v10h-20z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          EOF

          gradle wrapper --gradle-version 8.4 --no-daemon

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Project Cache
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/Nova-Island-Pro.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Island-Pro-V45
          path: release-output/Nova-Island-Pro.apk
          retention-days: 5

name: Build Dynamic Island AI Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for Dynamic Island
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Dynamic Island Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/dynamicisland/aipro app/src/main/res/mipmap-anydpi-v26

          cat << 'INNER_EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          INNER_EOF

          cat << 'INNER_EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DynamicIslandAIPro"
          include(":app")
          INNER_EOF

          cat << 'INNER_EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          INNER_EOF

          cat << 'INNER_EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.dynamicisland.aipro"
              compileSdk = 34
              defaultConfig { applicationId = "com.dynamicisland.aipro"; minSdk = 28; targetSdk = 34; versionCode = 1; versionName = "1.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Dynamic Island AI</string>
          </resources>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#000000"/></shape>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00FF88" android:pathData="M24,44h60v20h-60zM44,44a10,10 0 0,1 20,0a10,10 0 0,1 -20,0z"/>
          </vector>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/IslandService.kt
          package com.dynamicisland.aipro

          import android.animation.ValueAnimator
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.animation.OvershootInterpolator
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          class IslandService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var islandView: FrameLayout
              private lateinit var params: WindowManager.LayoutParams
              
              private var isExpanded = false
              private val collapsedWidthDp = 160f
              private val collapsedHeightDp = 40f
              private val expandedWidthDp = 340f
              private val expandedHeightDp = 160f

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val dp = resources.displayMetrics.density

                  params = WindowManager.LayoutParams(
                      (collapsedWidthDp * dp).toInt(),
                      (collapsedHeightDp * dp).toInt(),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = (15 * dp).toInt() // المسافة من أعلى الشاشة
                  }

                  islandView = FrameLayout(this).apply {
                      background = GradientDrawable().apply {
                          setColor(Color.BLACK)
                          cornerRadius = 100f * dp // حواف دائرية مثالية
                      }
                  }

                  // المحتوى المصغر (أيقونة الذكاء الاصطناعي)
                  val collapsedContent = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      gravity = Gravity.CENTER
                  }
                  collapsedContent.addView(TextView(this).apply {
                      text = "✨"
                      textSize = 18f
                  })

                  // المحتوى الموسع
                  val expandedContent = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                      gravity = Gravity.CENTER
                      alpha = 0f // مخفي في البداية
                  }
                  expandedContent.addView(TextView(this).apply {
                      text = "مرحباً بك في Dynamic Island AI Pro"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  })
                  expandedContent.addView(TextView(this).apply {
                      text = "أنا مستعد لأوامرك الذكية..."
                      textSize = 12f
                      setTextColor(Color.GRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, (8*dp).toInt(), 0, 0)
                  })

                  islandView.addView(expandedContent)
                  islandView.addView(collapsedContent)

                  islandView.setOnClickListener {
                      isExpanded = !isExpanded
                      animateIsland(isExpanded, collapsedContent, expandedContent)
                  }

                  windowManager.addView(islandView, params)
              }

              private fun animateIsland(expand: Boolean, collapsed: View, expanded: View) {
                  val dp = resources.displayMetrics.density
                  val startW = if (expand) collapsedWidthDp else expandedWidthDp
                  val endW = if (expand) expandedWidthDp else collapsedWidthDp
                  val startH = if (expand) collapsedHeightDp else expandedHeightDp
                  val endH = if (expand) expandedHeightDp else collapsedHeightDp

                  val animator = ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 400
                      interpolator = OvershootInterpolator(1.2f) // حركة مرنة (Bouncy) مثل iOS
                      addUpdateListener { anim ->
                          val fraction = anim.animatedValue as Float
                          params.width = ((startW + (endW - startW) * fraction) * dp).toInt()
                          params.height = ((startH + (endH - startH) * fraction) * dp).toInt()
                          windowManager.updateViewLayout(islandView, params)
                          
                          // تلاشي المحتويات
                          if (expand) {
                              collapsed.alpha = 1f - (fraction * 2f).coerceIn(0f, 1f)
                              expanded.alpha = ((fraction - 0.5f) * 2f).coerceIn(0f, 1f)
                          } else {
                              expanded.alpha = 1f - (fraction * 2f).coerceIn(0f, 1f)
                              collapsed.alpha = ((fraction - 0.5f) * 2f).coerceIn(0f, 1f)
                          }
                      }
                  }
                  animator.start()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::windowManager.isInitialized && ::islandView.isInitialized) {
                      windowManager.removeView(islandView)
                  }
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/MainActivity.kt
          package com.dynamicisland.aipro

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val dp = resources.displayMetrics.density

                  val bgDark = Color.parseColor("#101411")
                  val pillActive = Color.parseColor("#A8E5BA")
                  val textOnActive = Color.parseColor("#0F2015")
                  val textOnDark = Color.parseColor("#E1E3DF")

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bgDark)
                      setPadding((24*dp).toInt(), (60*dp).toInt(), (24*dp).toInt(), (24*dp).toInt())
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  root.addView(TextView(this).apply {
                      text = "Dynamic Island AI"
                      textSize = 36f
                      setTextColor(textOnDark)
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, (20*dp).toInt())
                  })

                  root.addView(TextView(this).apply {
                      text = "لتشغيل الجزيرة، نحتاج إلى إذن الظهور فوق التطبيقات الأخرى."
                      textSize = 16f
                      setTextColor(Color.GRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, (40*dp).toInt())
                  })

                  val btn = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      background = GradientDrawable().apply { setColor(pillActive); cornerRadius = 24f * dp }
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, (72*dp).toInt())
                      gravity = Gravity.CENTER
                      
                      addView(TextView(context).apply {
                          text = "تشغيل الجزيرة التفاعلية 🚀"
                          textSize = 18f
                          setTextColor(textOnActive)
                          typeface = android.graphics.Typeface.DEFAULT_BOLD
                      })
                      
                      setOnClickListener {
                          checkOverlayAndStart()
                      }
                  }
                  
                  root.addView(btn)
                  setContentView(root)
              }

              private fun checkOverlayAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:\$packageName"))
                      startActivity(intent)
                  } else {
                      startService(Intent(this, IslandService::class.java))
                      finish() // إغلاق التطبيق والبقاء مع الجزيرة
                  }
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- إذن الظهور فوق التطبيقات للجزيرة التفاعلية -->
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".IslandService" android:exported="false" />
              </application>
          </manifest>
          INNER_EOF
          
          gradle wrapper --gradle-version 8.4 --no-daemon

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Project Cache
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/Dynamic-Island-AI.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Island-AI-Pro
          path: release-output/Dynamic-Island-AI.apk
          retention-days: 5

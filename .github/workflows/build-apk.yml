name: Build Dynamic Island Pixel 8 APK

# يتم تشغيل الـ Workflow عند كل Push أو Pull Request أو يدوياً عبر زر Run
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود المصدري من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (JDK 17) المتوافقة مع أندرويد 14/15 و Pixel 8
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. منح صلاحيات التنفيذ لـ Gradle Wrapper
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || echo "gradlew not found, will use gradle"

      # 4. بناء الـ APK بصيغة Debug و Release
      - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      # 5. رفع ملف الـ APK الناتج كـ Artifact لتنزيله مباشرة من GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-Pixel8-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

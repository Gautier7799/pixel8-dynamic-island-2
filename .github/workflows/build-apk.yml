name: Build Dynamic Island Pixel 8 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK for Pixel 8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # تنظيف وإعداد كود أندرويد الحديث المخصص لـ Pixel
      - name: Build Pixel 8 Engine
        run: |
          rm -rf app/src/main/res
          rm -rf app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/java/com/dynamicisland/pixel8

          # 1. إعداد gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. إعداد settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DynamicIslandPixel8"
          include(":app")
          EOF

          # 3. إعداد build.gradle.kts الرئيسي
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. إعداد app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.dynamicisland.pixel8"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.dynamicisland.pixel8"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 4
                  versionName = "2.2.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          # 5. الأيقونات الرسمية
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#000000" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M24,44h60a10,10 0 0,1 10,10v0a10,10 0 0,1 -10,10h-60a10,10 0 0,1 -10,-10v0a10,10 0 0,1 10,-10z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/black"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/black"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 6. خلفية الكبسولة
          cat << 'EOF' > app/src/main/res/drawable/bg_island_capsule.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#000000" />
              <corners android:radius="100dp" />
              <stroke android:width="1dp" android:color="#44FFFFFF" />
          </shape>
          EOF

          # 7. واجهة الجزيرة التفاعلية (view_pixel8_island.xml)
          cat << 'EOF' > app/src/main/res/layout/view_pixel8_island.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/islandContainer"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/bg_island_capsule"
              android:gravity="center"
              android:orientation="horizontal"
              android:paddingStart="8dp"
              android:paddingEnd="8dp">

              <TextView
                  android:id="@+id/tvNotificationTitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="#FFFFFF"
                  android:textSize="12sp"
                  android:textStyle="bold"
                  android:visibility="gone"
                  android:maxLines="1" />

              <TextView
                  android:id="@+id/tvNotificationText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="#DDDDDD"
                  android:textSize="11sp"
                  android:layout_marginStart="4dp"
                  android:visibility="gone"
                  android:maxLines="1" />
          </LinearLayout>
          EOF

          # 8. واجهة الإعدادات الشاملة مع تنبيه فك القيود (activity_main.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0C0C10"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Dynamic Island 2"
                      android:textColor="#FFFFFF"
                      android:textSize="24sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Google Pixel 8 Modern Edition"
                      android:textColor="#9E9EA4"
                      android:textSize="13sp"
                      android:layout_marginBottom="16dp" />

                  <!-- صندوق إرشادات فك القيود لهواتف Pixel الحديثة -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="#1E1A2C"
                      android:padding="12dp"
                      android:orientation="vertical"
                      android:layout_marginBottom="16dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="💡 ملاحظة لهواتف Pixel الحديثة:"
                          android:textColor="#D0BCFF"
                          android:textStyle="bold"
                          android:textSize="13sp"
                          android:layout_marginBottom="4dp" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="إذا ظهر خيار الإشعارات باللون الرمادي: اذهب لإعدادات التطبيق واضغط على النقاط الثلاث (⋮) في الأعلى ثم اختر 'السماح بالإعدادات المقيدة'."
                          android:textColor="#E6E1E5"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <Button
                      android:id="@+id/btnOverlayPermission"
                      android:layout_width="match_parent"
                      android:layout_height="54dp"
                      android:text="1. إذن الظهور فوق التطبيقات"
                      android:backgroundTint="#242436"
                      android:textColor="#FFFFFF"
                      android:layout_marginBottom="8dp" />

                  <Button
                      android:id="@+id/btnNotificationPermission"
                      android:layout_width="match_parent"
                      android:layout_height="54dp"
                      android:text="2. إذن قراءة الإشعارات"
                      android:backgroundTint="#242436"
                      android:textColor="#FFFFFF"
                      android:layout_marginBottom="16dp" />

                  <!-- لوحة المعايرة -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="#161622"
                      android:padding="16dp"
                      android:layout_marginBottom="16dp">

                      <TextView
                          android:id="@+id/tvWidthLabel"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="عرض الجزيرة: 80 dp"
                          android:textColor="#FFFFFF"
                          android:textSize="12sp" />

                      <SeekBar
                          android:id="@+id/sbWidth"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:max="140"
                          android:progress="80"
                          android:layout_marginBottom="12dp" />

                      <TextView
                          android:id="@+id/tvHeightLabel"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="ارتفاع الجزيرة: 26 dp"
                          android:textColor="#FFFFFF"
                          android:textSize="12sp" />

                      <SeekBar
                          android:id="@+id/sbHeight"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:max="50"
                          android:progress="26"
                          android:layout_marginBottom="12dp" />

                      <TextView
                          android:id="@+id/tvPosYLabel"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="المسافة من أعلى الشاشة: 6 dp"
                          android:textColor="#FFFFFF"
                          android:textSize="12sp" />

                      <SeekBar
                          android:id="@+id/sbPosY"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:max="30"
                          android:progress="6" />
                  </LinearLayout>

                  <Button
                      android:id="@+id/btnStartService"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:text="تشغيل الجزيرة الآن فوراً"
                      android:backgroundTint="#7F52FF"
                      android:textColor="#FFFFFF"
                      android:textStyle="bold"
                      android:layout_marginBottom="10dp" />

                  <Button
                      android:id="@+id/btnTestNotification"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:text="إرسال إشعار تجريبي (Test)"
                      android:backgroundTint="#242436"
                      android:textColor="#D0BCFF" />
              </LinearLayout>
          </ScrollView>
          EOF

          # 9. كود شاشة التحكم MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/dynamicisland/pixel8/MainActivity.kt
          package com.dynamicisland.pixel8

          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var prefs: SharedPreferences

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  prefs = getSharedPreferences("island_prefs", Context.MODE_PRIVATE)

                  val btnOverlay = findViewById<Button>(R.id.btnOverlayPermission)
                  val btnNotification = findViewById<Button>(R.id.btnNotificationPermission)
                  val btnStart = findViewById<Button>(R.id.btnStartService)
                  val btnTest = findViewById<Button>(R.id.btnTestNotification)

                  val sbWidth = findViewById<SeekBar>(R.id.sbWidth)
                  val sbHeight = findViewById<SeekBar>(R.id.sbHeight)
                  val sbPosY = findViewById<SeekBar>(R.id.sbPosY)

                  val tvWidth = findViewById<TextView>(R.id.tvWidthLabel)
                  val tvHeight = findViewById<TextView>(R.id.tvHeightLabel)
                  val tvPosY = findViewById<TextView>(R.id.tvPosYLabel)

                  val savedWidth = prefs.getInt("width", 80)
                  val savedHeight = prefs.getInt("height", 26)
                  val savedPosY = prefs.getInt("pos_y", 6)

                  sbWidth.progress = savedWidth
                  sbHeight.progress = savedHeight
                  sbPosY.progress = savedPosY

                  tvWidth.text = "عرض الجزيرة: $savedWidth dp"
                  tvHeight.text = "ارتفاع الجزيرة: $savedHeight dp"
                  tvPosY.text = "المسافة من أعلى الشاشة: $savedPosY dp"

                  sbWidth.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          val w = if (progress < 40) 40 else progress
                          tvWidth.text = "عرض الجزيرة: $w dp"
                          prefs.edit().putInt("width", w).apply()
                          IslandOverlayService.updateLayout(this@MainActivity)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  sbHeight.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          val h = if (progress < 16) 16 else progress
                          tvHeight.text = "ارتفاع الجزيرة: $h dp"
                          prefs.edit().putInt("height", h).apply()
                          IslandOverlayService.updateLayout(this@MainActivity)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  sbPosY.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          tvPosY.text = "المسافة من أعلى الشاشة: $progress dp"
                          prefs.edit().putInt("pos_y", progress).apply()
                          IslandOverlayService.updateLayout(this@MainActivity)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  btnOverlay.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                      } else {
                          Toast.makeText(this, "إذن الظهور مفعّل بالفعل!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnNotification.setOnClickListener {
                      try {
                          startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                      } catch (e: Exception) {
                          Toast.makeText(this, "يرجى فتح إعدادات الإشعارات للتطبيق", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnStart.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "يرجى منح إذن الظهور أولاً (الزر 1)", Toast.LENGTH_SHORT).show()
                      } else {
                          IslandOverlayService.startOverlay(this)
                          Toast.makeText(this, "تم تشغيل الجزيرة بنجاح!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnTest.setOnClickListener {
                      IslandOverlayService.expandWithNotification(this, "💬 WhatsApp", "رسالة جديدة على Pixel 8!")
                  }
              }
          }
          EOF

          # 10. خدمة IslandOverlayService.kt المحدثة خصيصاً للرسم الفوري والمباشر
          cat << 'EOF' > app/src/main/java/com/dynamicisland/pixel8/IslandOverlayService.kt
          package com.dynamicisland.pixel8

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import androidx.core.app.NotificationCompat

          class IslandOverlayService : Service() {

              companion object {
                  private var windowManager: WindowManager? = null
                  private var islandView: View? = null
                  private var layoutParams: WindowManager.LayoutParams? = null
                  private val mainHandler = Handler(Looper.getMainLooper())

                  fun startOverlay(context: Context) {
                      if (islandView != null) {
                          updateLayout(context)
                          return
                      }

                      windowManager = context.applicationContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager

                      val layoutFlag = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY

                      val prefs = context.getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                      val w = prefs.getInt("width", 80)
                      val h = prefs.getInt("height", 26)
                      val y = prefs.getInt("pos_y", 6)
                      val density = context.resources.displayMetrics.density

                      val params = WindowManager.LayoutParams(
                          (w * density).toInt(),
                          (h * density).toInt(),
                          layoutFlag,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                          this.y = (y * density).toInt()
                      }

                      layoutParams = params
                      val inflater = LayoutInflater.from(context.applicationContext)
                      islandView = inflater.inflate(R.layout.view_pixel8_island, null)

                      islandView?.setOnClickListener {
                          expandWithNotification(context, "Pixel 8 Island", "استجابة لمس فورية")
                      }

                      try {
                          windowManager?.addView(islandView, params)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }

                  fun updateLayout(context: Context) {
                      val wm = windowManager ?: return
                      val view = islandView ?: return
                      val params = layoutParams ?: return

                      val prefs = context.getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                      val w = prefs.getInt("width", 80)
                      val h = prefs.getInt("height", 26)
                      val y = prefs.getInt("pos_y", 6)
                      val density = context.resources.displayMetrics.density

                      params.width = (w * density).toInt()
                      params.height = (h * density).toInt()
                      params.y = (y * density).toInt()

                      try {
                          wm.updateViewLayout(view, params)
                      } catch (e: Exception) {}
                  }

                  fun expandWithNotification(context: Context, title: String, message: String) {
                      if (islandView == null) {
                          startOverlay(context)
                      }
                      val wm = windowManager ?: return
                      val view = islandView ?: return
                      val params = layoutParams ?: return
                      val density = context.resources.displayMetrics.density

                      params.width = (240 * density).toInt()
                      params.height = (50 * density).toInt()

                      val tvTitle = view.findViewById<TextView>(R.id.tvNotificationTitle)
                      val tvText = view.findViewById<TextView>(R.id.tvNotificationText)

                      tvTitle?.text = title
                      tvTitle?.visibility = View.VISIBLE
                      tvText?.text = message
                      tvText?.visibility = View.VISIBLE

                      try {
                          wm.updateViewLayout(view, params)
                      } catch (e: Exception) {}

                      mainHandler.removeCallbacksAndMessages(null)
                      mainHandler.postDelayed({
                          collapse(context)
                      }, 4000)
                  }

                  fun collapse(context: Context) {
                      val view = islandView ?: return
                      view.findViewById<TextView>(R.id.tvNotificationTitle)?.visibility = View.GONE
                      view.findViewById<TextView>(R.id.tvNotificationText)?.visibility = View.GONE
                      updateLayout(context)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  startOverlay(this)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 11. خدمة مراقبة الإشعارات NotificationReceiverService.kt
          cat << 'EOF' > app/src/main/java/com/dynamicisland/pixel8/NotificationReceiverService.kt
          package com.dynamicisland.pixel8

          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NotificationReceiverService : NotificationListenerService() {

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  IslandOverlayService.startOverlay(this)
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  val notif = sbn?.notification ?: return
                  val extras = notif.extras ?: return
                  val title = extras.getString("android.title") ?: return
                  val text = extras.getCharSequence("android.text")?.toString() ?: ""

                  if (title.isNotBlank()) {
                      IslandOverlayService.expandWithNotification(this, title, text)
                  }
              }
          }
          EOF

          # 12. ملف AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Dynamic Island 2"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".IslandOverlayService"
                      android:enabled="true"
                      android:exported="false" />

                  <service
                      android:name=".NotificationReceiverService"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # 13. ملفات القيم والألوان
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Dynamic Island 2</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 14. أمر البناء النظيف للـ APK
      - name: Build Debug APK
        run: gradle assembleDebug -x test -x lint --stacktrace

      # 15. رفع حزمة الـ APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland2-Pixel8-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

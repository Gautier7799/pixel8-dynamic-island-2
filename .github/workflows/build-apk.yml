name: Build Dynamic Island Pixel 8 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # تنظيف الأسماء الخاطئة وإنشاء الموارد بأسماء صحيحة 100%
      - name: Clean & Fix Android Resources
        run: |
          # 1. تنظيف أي ملفات بأسماء غير صالحة في مجلد drawable
          rm -rf app/src/main/res/drawable/*
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          # 2. إنشاء ملف bg_island_capsule.xml بالاسم الصحيح النظيف
          cat << 'EOF' > app/src/main/res/drawable/bg_island_capsule.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#000000" />
              <corners android:radius="24dp" />
              <stroke
                  android:width="1dp"
                  android:color="#33FFFFFF" />
          </shape>
          EOF

          # 3. ضبط gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 4. أمر البناء النظيف
      - name: Build Debug APK
        run: gradle assembleDebug -x test -x lint --stacktrace

      # 5. رفع ملف الـ APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-Pixel8-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

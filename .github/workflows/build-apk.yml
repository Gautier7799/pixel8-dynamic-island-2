          # 11. محرك الجزيرة المطور مع النزول تحت شريط الحالة والتحكم الحقيقي في الموسيقى
          cat << 'EOF' > app/src/main/java/com/dynamicisland/pixel8/IslandOverlayService.kt
          package com.dynamicisland.pixel8

          import android.animation.ValueAnimator
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.media.AudioManager
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.LayoutInflater
          import android.view.View
          import android.view.WindowManager
          import android.view.animation.OvershootInterpolator
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.core.app.NotificationCompat

          class IslandOverlayService : Service() {

              companion object {
                  private const val CHANNEL_ID = "dynamic_island_foreground_channel"
                  private const val NOTIF_ID = 1001

                  private var windowManager: WindowManager? = null
                  private var islandView: View? = null
                  private var layoutParams: WindowManager.LayoutParams? = null
                  private val mainHandler = Handler(Looper.getMainLooper())
                  private var currentAnimator: ValueAnimator? = null

                  var isExpanded = false

                  const val DEFAULT_BORDER_COLOR = 0xFFC8CCD6.toInt()
                  const val SOLID_BLACK_COLOR = 0xFF000000.toInt()

                  fun createIslandDrawable(borderColor: Int, cornerRadiusDp: Float, context: Context): GradientDrawable {
                      val density = context.resources.displayMetrics.density
                      return GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE
                          setColor(SOLID_BLACK_COLOR)
                          cornerRadius = cornerRadiusDp * density
                          setStroke((1.2f * density).toInt(), borderColor)
                      }
                  }

                  fun startOverlay(context: Context) {
                      if (islandView != null) {
                          updateSize(context)
                          return
                      }

                      windowManager = context.applicationContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      val layoutFlag = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY

                      val prefs = context.getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                      val w = prefs.getInt("width", 75)
                      val h = prefs.getInt("height", 27)
                      val y = prefs.getInt("pos_y", 8)
                      val density = context.resources.displayMetrics.density

                      val params = WindowManager.LayoutParams(
                          (w * density).toInt(),
                          (h * density).toInt(),
                          layoutFlag,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                          this.y = (y * density).toInt()
                      }

                      layoutParams = params
                      val inflater = LayoutInflater.from(context.applicationContext)
                      islandView = inflater.inflate(R.layout.view_pixel8_island, null)

                      islandView?.clipToOutline = true
                      islandView?.background = createIslandDrawable(DEFAULT_BORDER_COLOR, 100f, context)

                      // أزرار التحكم في الموسيقى
                      val btnPrev = islandView?.findViewById<Button>(R.id.btnActionPrev)
                      val btnPlayPause = islandView?.findViewById<Button>(R.id.btnActionPlayPause)
                      val btnNext = islandView?.findViewById<Button>(R.id.btnActionNext)

                      val audioManager = context.applicationContext.getSystemService(Context.AUDIO_SERVICE) as? AudioManager

                      btnPrev?.setOnClickListener {
                          audioManager?.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_MEDIA_PREVIOUS))
                          audioManager?.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_MEDIA_PREVIOUS))
                      }

                      btnPlayPause?.setOnClickListener {
                          audioManager?.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE))
                          audioManager?.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE))
                      }

                      btnNext?.setOnClickListener {
                          audioManager?.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_MEDIA_NEXT))
                          audioManager?.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_MEDIA_NEXT))
                      }

                      islandView?.setOnClickListener {
                          if (!isExpanded) {
                              showExpandedEvent(
                                  context,
                                  R.drawable.ic_launcher_foreground,
                                  "Dynamic Island Pixel 8",
                                  "انقر مجدداً للطي أو اسحب للتحكم",
                                  "مفعّل",
                                  DEFAULT_BORDER_COLOR
                              )
                          } else {
                              collapseToIdle(context)
                          }
                      }

                      try {
                          windowManager?.addView(islandView, params)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }

                  fun updateSize(context: Context) {
                      val wm = windowManager ?: return
                      val view = islandView ?: return
                      val params = layoutParams ?: return

                      val prefs = context.getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                      val w = prefs.getInt("width", 75)
                      val h = prefs.getInt("height", 27)
                      val y = prefs.getInt("pos_y", 8)
                      val density = context.resources.displayMetrics.density

                      if (!isExpanded) {
                          params.width = (w * density).toInt()
                          params.height = (h * density).toInt()
                          params.y = (y * density).toInt()

                          try {
                              wm.updateViewLayout(view, params)
                          } catch (e: Exception) {}
                      }
                  }

                  // كبسولة تنبيه مقتضبة محصورة بين الكاميرا والرموز فقط
                  fun showCompactEvent(context: Context, iconRes: Int, title: String, value: String, borderColor: Int = DEFAULT_BORDER_COLOR) {
                      if (islandView == null) startOverlay(context)
                      val view = islandView ?: return

                      view.background = createIslandDrawable(borderColor, 100f, context)

                      val layoutIdle = view.findViewById<View>(R.id.layoutIdle)
                      val layoutCompact = view.findViewById<View>(R.id.layoutCompact)
                      val layoutExpanded = view.findViewById<View>(R.id.layoutExpanded)

                      layoutIdle?.visibility = View.GONE
                      layoutExpanded?.visibility = View.GONE
                      layoutCompact?.visibility = View.VISIBLE

                      val ivIcon = view.findViewById<ImageView>(R.id.ivCompactIcon)
                      val tvTitle = view.findViewById<TextView>(R.id.tvCompactTitle)
                      val tvValue = view.findViewById<TextView>(R.id.tvCompactValue)

                      ivIcon?.setImageResource(iconRes)
                      tvTitle?.text = title
                      tvValue?.text = value
                      tvValue?.setTextColor(borderColor)

                      val prefs = context.getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                      val y = prefs.getInt("pos_y", 8)

                      // عرض 135dp فقط يحافظ عليها في منتصف ثقب الكاميرا ولا يقترب من الساعة أو البطارية
                      animateIsland(context, targetWidthDp = 135, targetHeightDp = 30, targetPosY = y)

                      mainHandler.removeCallbacksAndMessages(null)
                      mainHandler.postDelayed({
                          collapseToIdle(context)
                      }, 4000)
                  }

                  // بطاقة التوسع: تنزل للأسفل تحت شريط الحالة (Y = 48dp) لمنع أي تداخل مع الساعة وLTE
                  fun showExpandedEvent(
                      context: Context,
                      iconRes: Int,
                      header: String,
                      subtext: String,
                      extra: String,
                      borderColor: Int = DEFAULT_BORDER_COLOR
                  ) {
                      if (islandView == null) startOverlay(context)
                      val view = islandView ?: return
                      isExpanded = true

                      view.background = createIslandDrawable(borderColor, 24f, context)

                      val layoutIdle = view.findViewById<View>(R.id.layoutIdle)
                      val layoutCompact = view.findViewById<View>(R.id.layoutCompact)
                      val layoutExpanded = view.findViewById<View>(R.id.layoutExpanded)

                      layoutIdle?.visibility = View.GONE
                      layoutCompact?.visibility = View.GONE
                      layoutExpanded?.visibility = View.VISIBLE

                      val ivBadge = view.findViewById<ImageView>(R.id.ivExpandedBadge)
                      val tvHeader = view.findViewById<TextView>(R.id.tvExpandedHeader)
                      val tvSubtext = view.findViewById<TextView>(R.id.tvExpandedSubtext)
                      val tvExtra = view.findViewById<TextView>(R.id.tvExpandedExtra)

                      ivBadge?.setImageResource(iconRes)
                      tvHeader?.text = header
                      tvSubtext?.text = subtext
                      tvExtra?.text = extra
                      tvExtra?.setTextColor(borderColor)

                      // تنزل تحت شريط الحالة بالكامل (Y = 48dp) مع أبعاد فسيحة
                      animateIsland(context, targetWidthDp = 330, targetHeightDp = 105, targetPosY = 48)

                      mainHandler.removeCallbacksAndMessages(null)
                      mainHandler.postDelayed({
                          collapseToIdle(context)
                      }, 6000)
                  }

                  fun collapseToIdle(context: Context) {
                      val view = islandView ?: return
                      isExpanded = false

                      view.background = createIslandDrawable(DEFAULT_BORDER_COLOR, 100f, context)

                      val layoutIdle = view.findViewById<View>(R.id.layoutIdle)
                      val layoutCompact = view.findViewById<View>(R.id.layoutCompact)
                      val layoutExpanded = view.findViewById<View>(R.id.layoutExpanded)

                      layoutCompact?.visibility = View.GONE
                      layoutExpanded?.visibility = View.GONE
                      layoutIdle?.visibility = View.VISIBLE

                      val prefs = context.getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                      val w = prefs.getInt("width", 75)
                      val h = prefs.getInt("height", 27)
                      val y = prefs.getInt("pos_y", 8)

                      animateIsland(context, targetWidthDp = w, targetHeightDp = h, targetPosY = y)
                  }

                  private fun animateIsland(context: Context, targetWidthDp: Int, targetHeightDp: Int, targetPosY: Int) {
                      val wm = windowManager ?: return
                      val view = islandView ?: return
                      val params = layoutParams ?: return
                      val density = context.resources.displayMetrics.density

                      val startWidth = params.width
                      val endWidth = (targetWidthDp * density).toInt()
                      val startHeight = params.height
                      val endHeight = (targetHeightDp * density).toInt()
                      val startY = params.y
                      val endY = (targetPosY * density).toInt()

                      currentAnimator?.cancel()
                      val animator = ValueAnimator.ofFloat(0f, 1f).apply {
                          duration = 280
                          interpolator = OvershootInterpolator(1.05f)
                          addUpdateListener { va ->
                              val frac = va.animatedFraction
                              params.width = (startWidth + (endWidth - startWidth) * frac).toInt()
                              params.height = (startHeight + (endHeight - startHeight) * frac).toInt()
                              params.y = (startY + (endY - startY) * frac).toInt()
                              try {
                                  wm.updateViewLayout(view, params)
                              } catch (e: Exception) {}
                          }
                      }
                      currentAnimator = animator
                      animator.start()
                  }
              }

              private val batteryReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (context == null || intent == null) return
                      val action = intent.action
                      if (action == Intent.ACTION_POWER_CONNECTED) {
                          val batteryStatus: Intent? = IntentFilter(Intent.ACTION_BATTERY_CHANGED).let { ifilter ->
                              context.registerReceiver(null, ifilter)
                          }
                          val level: Int = batteryStatus?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                          val scale: Int = batteryStatus?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                          val pct = if (level >= 0 && scale > 0) (level * 100 / scale) else 85
                          showCompactEvent(
                              context,
                              R.drawable.ic_bolt,
                              "الشاحن متصل",
                              "$pct%",
                              0xFF34D399.toInt()
                          )
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  startForeground(NOTIF_ID, buildForegroundNotification())
                  startOverlay(this)

                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_POWER_CONNECTED)
                      addAction(Intent.ACTION_POWER_DISCONNECTED)
                  }
                  registerReceiver(batteryReceiver, filter)
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          getString(R.string.channel_name),
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = getString(R.string.channel_desc)
                          setShowBadge(false)
                      }
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(channel)
                  }
              }

              private fun buildForegroundNotification(): Notification {
                  val intent = Intent(this, MainActivity::class.java)
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, intent,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Dynamic Island مفعّلة")
                      .setContentText("الجزيرة التفاعلية تعمل بسلاسة في الخلفية")
                      .setSmallIcon(R.drawable.ic_bolt)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      unregisterReceiver(batteryReceiver)
                  } catch (e: Exception) {}
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 12. خدمة مراقبة وقراءة الموسيقى والإشعارات الحية في النظام
          cat << 'EOF' > app/src/main/java/com/dynamicisland/pixel8/NotificationReceiverService.kt
          package com.dynamicisland.pixel8

          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.os.Handler
          import android.os.Looper
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NotificationReceiverService : NotificationListenerService() {

              private val handler = Handler(Looper.getMainLooper())

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  IslandOverlayService.startOverlay(this)
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  val notif = sbn?.notification ?: return
                  val extras = notif.extras ?: return
                  val title = extras.getString("android.title") ?: extras.getCharSequence("android.title")?.toString() ?: return
                  val text = extras.getCharSequence("android.text")?.toString() ?: ""
                  val pkg = sbn.packageName ?: ""

                  if (pkg == packageName) return

                  val (color, iconRes) = when {
                      pkg.contains("whatsapp", ignoreCase = true) -> Pair(0xFF25D366.toInt(), R.drawable.ic_whatsapp)
                      pkg.contains("spotify", ignoreCase = true) -> Pair(0xFF1DB954.toInt(), R.drawable.ic_spotify)
                      pkg.contains("telegram", ignoreCase = true) -> Pair(0xFF229ED9.toInt(), R.drawable.ic_launcher_foreground)
                      pkg.contains("youtube", ignoreCase = true) -> Pair(0xFFFF0000.toInt(), R.drawable.ic_spotify)
                      pkg.contains("instagram", ignoreCase = true) -> Pair(0xFFE1306C.toInt(), R.drawable.ic_launcher_foreground)
                      pkg.contains("facebook", ignoreCase = true) -> Pair(0xFF1877F2.toInt(), R.drawable.ic_launcher_foreground)
                      pkg.contains("x.android", ignoreCase = true) || pkg.contains("twitter", ignoreCase = true) -> Pair(IslandOverlayService.DEFAULT_BORDER_COLOR, R.drawable.ic_launcher_foreground)
                      else -> Pair(IslandOverlayService.DEFAULT_BORDER_COLOR, R.drawable.ic_launcher_foreground)
                  }

                  if (title.isNotBlank()) {
                      handler.post {
                          IslandOverlayService.showExpandedEvent(
                              applicationContext,
                              iconRes,
                              title,
                              text,
                              "الآن",
                              color
                          )
                      }
                  }
              }
          }
          EOF

          # 13. ملف AndroidManifest.xml مع التعريف القياسي الرسمي لخدمة NotificationListenerService
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Dynamic Island"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".IslandOverlayService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse" />

                  <!-- التسجيل الرسمي لخدمة قراءة الإشعارات والموسيقى في نظام Android -->
                  <service
                      android:name=".NotificationReceiverService"
                      android:label="Dynamic Island Listener"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 14. أمر البناء النظيف للـ APK

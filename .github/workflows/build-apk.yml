                      Box(modifier = Modifier.size(48.dp).background(color.copy(alpha = 0.15f), RoundedCornerShape(14.dp)), contentAlignment = Alignment.Center) { Icon(icon, null, tint = color) }
                      Spacer(modifier = Modifier.width(16.dp))
                      Column(modifier = Modifier.weight(1f)) {
                          Text(title, fontWeight = FontWeight.Bold, fontSize = 15.sp)
                          Text(subtitle, fontSize = 13.sp, color = Color.Gray, lineHeight = 16.sp, modifier = Modifier.padding(top = 2.dp))
                          if(badgeText != null) {
                              Surface(color = if(badgeText == "Action Required") Color(0xFFFFF3E0) else Color(0xFFE3F2FD), shape = RoundedCornerShape(8.dp), modifier = Modifier.padding(top = 8.dp)) {
                                  Text(badgeText, color = if(badgeText == "Action Required") Color(0xFFEF6C00) else MaterialTheme.colorScheme.primary, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp))
                              }
                          }
                      }
                      Spacer(modifier = Modifier.width(8.dp))
                      if(showRedDot == true) Box(modifier = Modifier.size(8.dp).background(Color(0xFFE53935), CircleShape))
                      else Icon(Icons.Rounded.ChevronRight, null, tint = Color.LightGray)
                  }
              }
          }
          INNER_EOF


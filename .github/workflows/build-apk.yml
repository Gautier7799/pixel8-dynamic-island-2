                              context.sendBroadcast(i)
                          }, contentAlignment = Alignment.Center) { Icon(Icons.Rounded.Message, contentDescription = null, tint = NovaAccent) }
                          
                          Box(modifier = Modifier.size(56.dp).background(NovaBg, CircleShape).clickable {
                              val i = Intent("com.novaisland.pro.EVENT")
                              i.putExtra("type", "MUSIC"); i.putExtra("title", "Starboy"); i.putExtra("text", "The Weeknd"); i.putExtra("icon", "🎵"); i.putExtra("color", "#38BDF8")
                              context.sendBroadcast(i)
                          }, contentAlignment = Alignment.Center) { Icon(Icons.Rounded.LibraryMusic, contentDescription = null, tint = NovaAccent) }
                      }

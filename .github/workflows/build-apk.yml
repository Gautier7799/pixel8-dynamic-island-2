name: Build Dynamic Island Pixel 8 Pro Final APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for Pixel 8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Pixel 8 Pro Dynamic Island
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/layout app/src/main/res/mipmap-anydpi-v26 app/src/main/java/com/dynamicisland/pixel8

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DynamicIslandPixel8"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.dynamicisland.pixel8"
              compileSdk = 34
              defaultConfig { applicationId = "com.dynamicisland.pixel8"; minSdk = 28; targetSdk = 34; versionCode = 16; versionName = "6.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.media:media:1.7.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="m3_surface">#0A0C10</color>
              <color name="m3_surface_container">#14171E</color>
              <color name="m3_primary">#9ECAFF</color>
              <color name="m3_on_primary">#003258</color>
              <color name="m3_text_primary">#F0F3FA</color>
              <color name="m3_text_secondary">#9DA3B0</color>
              <color name="island_black">#000000</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">Dynamic Island</string></resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_round_pill_button.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#9ECAFF" /><corners android:radius="100dp" /></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_card_m3.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#14171E" /><corners android:radius="24dp" /><stroke android:width="1dp" android:color="#222731" /></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_action_chip.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#1C202B" /><corners android:radius="100dp" /><stroke android:width="0.8dp" android:color="#323846" /></shape>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/bg_m3_icon_btn.xml
          <ripple xmlns:android="http://schemas.android.com/apk/res/android" android:color="#30FFFFFF"><item><shape android:shape="oval"><solid android:color="#14171E" /></shape></item></ripple>
          EOF
          
          cat << 'EOF' > app/src/main/res/drawable/ic_settings.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#9DA3B0" android:pathData="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87c-0.12,0.21 -0.08,0.47 0.12,0.61l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_bolt.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#34D399" android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_spotify.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#1DB954" android:pathData="M12 2C6.477 2 2 6.477 2 12c0 5.523 4.477 10 10 10s10-4.477 10-10c0-5.523-4.477-10-10-10zm4.586 14.424c-.18.295-.563.387-.857.207-2.35-1.434-5.308-1.758-8.793-.963-.335.077-.67-.133-.746-.468-.077-.334.132-.67.467-.746 3.808-.87 7.076-.51 9.721 1.113.294.18.388.563.208.857zm1.226-2.723c-.226.367-.707.482-1.074.256-2.69-1.653-6.79-2.133-9.97-1.168-.413.125-.85-.11-.975-.523-.125-.413.11-.85.523-.975 3.633-1.103 8.15-.569 11.24 1.336.367.226.482.707.256 1.074zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71c-.494.15-1.018-.129-1.168-.623-.15-.494.129-1.018.623-1.168 3.532-1.072 9.404-.87 13.13 1.344.444.263.59.837.327 1.28-.264.445-.838.59-1.282.328z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_whatsapp.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#25D366" android:pathData="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm.01 1.67c4.54 0 8.24 3.7 8.24 8.24 0 2.2-.86 4.27-2.42 5.83a8.18 8.18 0 0 1-5.82 2.41c-1.49 0-2.95-.4-4.22-1.16l-.3-.18-3.13.82.83-3.05-.2-.31a8.196 8.196 0 0 1-1.26-4.36c0-4.54 3.7-8.24 8.28-8.24zm4.53 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.03-1.25-.75-.67-1.26-1.5-1.41-1.75-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.13-.14.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.34-.76-1.84-.2-.49-.4-.42-.56-.43h-.47c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.44.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.07-.1-.23-.17-.48-.29z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_headphones.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#38BDF8" android:pathData="M12,3a9,9 0 0,0 -9,9v7a3,3 0 0,0 3,3h1a2,2 0 0,0 2,-2v-4a2,2 0 0,0 -2,-2H5v-2a7,7 0 0,1 14,0v2h-2a2,2 0 0,0 -2,2v4a2,2 0 0,0 2,2h1a3,3 0 0,0 3,-3v-7a9,9 0 0,0 -9,-9z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#0A0C10" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#9ECAFF" android:pathData="M24,42h60a12,12 0 0,1 12,12v0a12,12 0 0,1 -12,12h-60a12,12 0 0,1 -12,-12v0a12,12 0 0,1 12,-12z"/><path android:fillColor="#003258" android:pathData="M38,50a4,4 0 1,1 0,8 4,4 0 0,1 0,-8z"/></vector>
          EOF
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/m3_surface"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF

          # واجهة الجزيرة المطورة: منسدلة تحت الكاميرا مع زر إعدادات
          cat << 'EOF' > app/src/main/res/layout/view_pixel8_island.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/islandRoot"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <View android:id="@+id/layoutIdle" android:layout_width="match_parent" android:layout_height="match_parent" android:visibility="visible" />

              <LinearLayout android:id="@+id/layoutCompact" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center_vertical" android:orientation="horizontal" android:paddingStart="12dp" android:paddingEnd="8dp" android:visibility="gone">
                  <ImageView android:id="@+id/ivCompactIcon" android:layout_width="20dp" android:layout_height="20dp" />
                  <TextView android:id="@+id/tvCompactTitle" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="8dp" android:textColor="#F0F3FA" android:textSize="13sp" android:maxLines="1" android:ellipsize="end" />
                  <TextView android:id="@+id/tvCompactValue" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#34D399" android:textSize="13sp" android:textStyle="bold" android:layout_marginEnd="8dp" />
                  <ImageButton android:id="@+id/btnQuickSettingsCompact" android:layout_width="28dp" android:layout_height="28dp" android:background="@drawable/bg_m3_icon_btn" android:src="@drawable/ic_settings" android:scaleType="centerInside" />
              </LinearLayout>

              <LinearLayout android:id="@+id/layoutExpanded" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="16dp" android:gravity="center_vertical" android:visibility="gone">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical">
                      <FrameLayout android:layout_width="40dp" android:layout_height="40dp" android:background="@drawable/bg_action_chip" android:padding="7dp">
                          <ImageView android:id="@+id/ivExpandedBadge" android:layout_width="match_parent" android:layout_height="match_parent" />
                      </FrameLayout>
                      <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="12dp" android:orientation="vertical">
                          <TextView android:id="@+id/tvExpandedHeader" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="15sp" android:textStyle="bold" android:maxLines="1" />
                          <TextView android:id="@+id/tvExpandedSubtext" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#C8CCD6" android:textSize="13sp" android:maxLines="2" />
                      </LinearLayout>
                      <ImageButton android:id="@+id/btnExpandedSettings" android:layout_width="32dp" android:layout_height="32dp" android:background="@drawable/bg_m3_icon_btn" android:src="@drawable/ic_settings" android:scaleType="centerInside" />
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          EOF

          # واجهة التطبيق الرئيسية (تم اختصارها لتوفير المساحة وتجنب الانقطاع، تحتوي على أهم الأزرار)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="@color/m3_surface" android:orientation="vertical" android:padding="20dp" android:gravity="center">

              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Dynamic Island Pixel 8" android:textColor="@color/m3_text_primary" android:textSize="24sp" android:textStyle="bold" android:layout_marginBottom="24dp" />

              <Button android:id="@+id/btnOverlayPermission" android:layout_width="match_parent" android:layout_height="50dp" android:text="1. السماح بالظهور فوق التطبيقات" android:layout_marginBottom="12dp" />
              <Button android:id="@+id/btnNotificationPermission" android:layout_width="match_parent" android:layout_height="50dp" android:text="2. السماح بقراءة الإشعارات" android:layout_marginBottom="24dp" />
              
              <Button android:id="@+id/btnStartService" android:layout_width="match_parent" android:layout_height="60dp" android:text="تشغيل الجزيرة الآن" android:backgroundTint="@color/m3_primary" android:textColor="@color/m3_on_primary" android:textSize="18sp" android:layout_marginBottom="24dp" />

              <GridLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:columnCount="2">
                  <Button android:id="@+id/btnTestCharging" android:layout_width="0dp" android:layout_height="50dp" android:layout_columnWeight="1" android:layout_margin="4dp" android:text="تجربة الشحن" />
                  <Button android:id="@+id/btnTestMusic" android:layout_width="0dp" android:layout_height="50dp" android:layout_columnWeight="1" android:layout_margin="4dp" android:text="تجربة واتساب" />
              </GridLayout>
          </LinearLayout>
          EOF

          # كود التطبيق الأساسي
          cat << 'EOF' > app/src/main/java/com/dynamicisland/pixel8/MainActivity.kt
          package com.dynamicisland.pixel8
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  findViewById<Button>(R.id.btnOverlayPermission).setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } else { Toast.makeText(this, "مفعل مسبقاً", Toast.LENGTH_SHORT).show() }
                  }

                  findViewById<Button>(R.id.btnNotificationPermission).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  }

                  findViewById<Button>(R.id.btnStartService).setOnClickListener {
                      if (Settings.canDrawOverlays(this)) {
                          val intent = Intent(this, IslandOverlayService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)
                          Toast.makeText(this, "تم تشغيل الجزيرة!", Toast.LENGTH_SHORT).show()
                      } else { Toast.makeText(this, "يرجى تفعيل الظهور أولاً", Toast.LENGTH_SHORT).show() }
                  }

                  findViewById<Button>(R.id.btnTestCharging).setOnClickListener {
                      IslandOverlayService.showCompactEvent(this, R.drawable.ic_bolt, "الشاحن متصل", "100%", 0xFF34D399.toInt())
                  }
                  findViewById<Button>(R.id.btnTestMusic).setOnClickListener {
                      IslandOverlayService.showExpandedEvent(this, R.drawable.ic_whatsapp, "رسالة جديدة", "مرحباً، هذه رسالة تجريبية!", "", 0xFF25D366.toInt())
                  }
              }
          }
          EOF

          # محرك الجزيرة المطور مع الألوان والكبسولة المنسدلة
          cat << 'EOF' > app/src/main/java/com/dynamicisland/pixel8/IslandOverlayService.kt
          package com.dynamicisland.pixel8
          import android.animation.ValueAnimator
          import android.app.*
          import android.content.*
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.*
          import android.view.*
          import android.view.animation.OvershootInterpolator
          import android.widget.*
          import androidx.core.app.NotificationCompat
          import java.util.Calendar

          class IslandOverlayService : Service() {
              companion object {
                  private var wm: WindowManager? = null
                  private var view: View? = null
                  private var params: WindowManager.LayoutParams? = null
                  private val handler = Handler(Looper.getMainLooper())
                  private var animator: ValueAnimator? = null
                  private var isExpanded = false

                  // تحديد لون الهالة بناءً على الوقت (نهار = أبيض، ليل = أخضر)
                  fun getAuraColor(): Int {
                      val hour = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                      return if (hour in 6..17) 0xFFFFFFFF.toInt() else 0xFF34D399.toInt()
                  }

                  fun createDrawable(color: Int, radiusDp: Float, ctx: Context): GradientDrawable {
                      val d = ctx.resources.displayMetrics.density
                      return GradientDrawable().apply {
                          shape = GradientDrawable.RECTANGLE; setColor(0xFF000000.toInt())
                          cornerRadius = radiusDp * d; setStroke((1.5f * d).toInt(), color)
                      }
                  }

                  fun startOverlay(ctx: Context) {
                      if (view != null) return
                      wm = ctx.getSystemService(WINDOW_SERVICE) as WindowManager
                      val d = ctx.resources.displayMetrics.density
                      params = WindowManager.LayoutParams(
                          (75 * d).toInt(), (27 * d).toInt(),
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT
                      ).apply { gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; y = (8 * d).toInt() }

                      view = LayoutInflater.from(ctx).inflate(R.layout.view_pixel8_island, null)
                      view?.background = createDrawable(getAuraColor(), 100f, ctx)

                      // فتح الإعدادات
                      val openSettings = View.OnClickListener {
                          val intent = Intent(ctx, MainActivity::class.java).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }
                          ctx.startActivity(intent)
                          collapse(ctx)
                      }
                      view?.findViewById<View>(R.id.btnQuickSettingsCompact)?.setOnClickListener(openSettings)
                      view?.findViewById<View>(R.id.btnExpandedSettings)?.setOnClickListener(openSettings)

                      // إصلاح اللمس: توسيع وطي الجزيرة
                      view?.setOnClickListener {
                          if (isExpanded) collapse(ctx)
                          else showExpandedEvent(ctx, R.drawable.ic_launcher_foreground, "Dynamic Island", "تعمل بشكل ممتاز", "", getAuraColor())
                      }

                      try { wm?.addView(view, params) } catch (e: Exception) {}
                  }

                  fun showCompactEvent(ctx: Context, icon: Int, title: String, value: String, color: Int) {
                      if (view == null) startOverlay(ctx)
                      view?.background = createDrawable(color, 100f, ctx)
                      view?.findViewById<View>(R.id.layoutIdle)?.visibility = View.GONE
                      view?.findViewById<View>(R.id.layoutExpanded)?.visibility = View.GONE
                      view?.findViewById<View>(R.id.layoutCompact)?.visibility = View.VISIBLE
                      
                      view?.findViewById<ImageView>(R.id.ivCompactIcon)?.setImageResource(icon)
                      view?.findViewById<TextView>(R.id.tvCompactTitle)?.text = title
                      view?.findViewById<TextView>(R.id.tvCompactValue)?.apply { text = value; setTextColor(color) }

                      // الكبسولة المنسدلة: تنزل تحت الكاميرا (Y = 48dp بدلاً من 8dp)
                      animate(ctx, 160, 36, 48)
                      handler.removeCallbacksAndMessages(null)
                      handler.postDelayed({ collapse(ctx) }, 4000)
                  }

                  fun showExpandedEvent(ctx: Context, icon: Int, title: String, sub: String, extra: String, color: Int) {
                      if (view == null) startOverlay(ctx)
                      isExpanded = true
                      view?.background = createDrawable(color, 24f, ctx)
                      view?.findViewById<View>(R.id.layoutIdle)?.visibility = View.GONE
                      view?.findViewById<View>(R.id.layoutCompact)?.visibility = View.GONE
                      view?.findViewById<View>(R.id.layoutExpanded)?.visibility = View.VISIBLE
                      
                      view?.findViewById<ImageView>(R.id.ivExpandedBadge)?.setImageResource(icon)
                      view?.findViewById<TextView>(R.id.tvExpandedHeader)?.text = title
                      view?.findViewById<TextView>(R.id.tvExpandedSubtext)?.text = sub

                      // بطاقة التوسع: مساحة كبيرة تحت الكاميرا (Y = 52dp)
                      animate(ctx, 340, 90, 52)
                      handler.removeCallbacksAndMessages(null)
                      handler.postDelayed({ collapse(ctx) }, 6000)
                  }

                  fun collapse(ctx: Context) {
                      isExpanded = false
                      view?.background = createDrawable(getAuraColor(), 100f, ctx)
                      view?.findViewById<View>(R.id.layoutCompact)?.visibility = View.GONE
                      view?.findViewById<View>(R.id.layoutExpanded)?.visibility = View.GONE
                      view?.findViewById<View>(R.id.layoutIdle)?.visibility = View.VISIBLE
                      animate(ctx, 75, 27, 8) // العودة لمكان الكاميرا الأصلي
                  }

                  private fun animate(ctx: Context, wDp: Int, hDp: Int, yDp: Int) {
                      val d = ctx.resources.displayMetrics.density
                      val sw = params?.width ?: 0; val ew = (wDp * d).toInt()
                      val sh = params?.height ?: 0; val eh = (hDp * d).toInt()
                      val sy = params?.y ?: 0; val ey = (yDp * d).toInt()

                      animator?.cancel()
                      animator = ValueAnimator.ofFloat(0f, 1f).apply {
                          duration = 350; interpolator = OvershootInterpolator(1.05f)
                          addUpdateListener { va ->
                              val f = va.animatedFraction
                              params?.width = (sw + (ew - sw) * f).toInt()
                              params?.height = (sh + (eh - sh) * f).toInt()
                              params?.y = (sy + (ey - sy) * f).toInt()
                              try { wm?.updateViewLayout(view, params) } catch (e: Exception) {}
                          }
                      }; animator?.start()
                  }
              }

              private val batteryReceiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      if (i?.action == Intent.ACTION_POWER_CONNECTED && c != null) {
                          showCompactEvent(c, R.drawable.ic_bolt, "جاري الشحن السريع", "⚡", 0xFF34D399.toInt())
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val chan = NotificationChannel("di", "DI", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(chan)
                  }
                  startForeground(1, NotificationCompat.Builder(this, "di").setSmallIcon(R.drawable.ic_bolt).setContentTitle("الجزيرة مفعلة").build())
                  startOverlay(this)
                  registerReceiver(batteryReceiver, IntentFilter(Intent.ACTION_POWER_CONNECTED))
              }
              override fun onDestroy() { super.onDestroy(); unregisterReceiver(batteryReceiver) }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # خدمة قراءة الإشعارات
          cat << 'EOF' > app/src/main/java/com/dynamicisland/pixel8/NotificationReceiverService.kt
          package com.dynamicisland.pixel8
          import android.os.Handler
          import android.os.Looper
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NotificationReceiverService : NotificationListenerService() {
              private val h = Handler(Looper.getMainLooper())
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  val title = sbn?.notification?.extras?.getString("android.title") ?: return
                  val text = sbn.notification.extras.getCharSequence("android.text")?.toString() ?: ""
                  val pkg = sbn.packageName ?: ""
                  if (pkg == packageName) return

                  val color = if (pkg.contains("whatsapp")) 0xFF25D366.toInt() else IslandOverlayService.getAuraColor()
                  val icon = if (pkg.contains("whatsapp")) R.drawable.ic_whatsapp else R.drawable.ic_launcher_foreground

                  h.post { IslandOverlayService.showExpandedEvent(applicationContext, icon, title, text, "", color) }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <application android:icon="@mipmap/ic_launcher" android:label="Dynamic Island" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name=".IslandOverlayService" android:exported="false" android:foregroundServiceType="specialUse" />
                  <service android:name=".NotificationReceiverService" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: |
          gradle assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/DynamicIsland-Pixel8-Final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-Pixel8-Final
          path: release-output/DynamicIsland-Pixel8-Final.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: final-release
          name: "Dynamic Island Pixel 8 Pro - التحديث النهائي"
          body: "إشعارات منسدلة تحت الكاميرا - إصلاح اللمس - ألوان النهار والليل - زر إعدادات سريع"
          files: release-output/DynamicIsland-Pixel8-Final.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Dynamic Island Compose Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for Dynamic Island
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Dynamic Island Compose Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/dynamicisland/aipro app/src/main/res/mipmap-anydpi-v26

          cat << 'INNER_EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          INNER_EOF

          cat << 'INNER_EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DynamicIslandAIPro"
          include(":app")
          INNER_EOF

          cat << 'INNER_EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          INNER_EOF

          cat << 'INNER_EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.dynamicisland.aipro"
              compileSdk = 34
              defaultConfig { applicationId = "com.dynamicisland.aipro"; minSdk = 28; targetSdk = 34; versionCode = 1; versionName = "1.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              // تم إضافة المكتبات التالية لإصلاح خطأ الـ Theme
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-service:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Dynamic Island Pro</string>
          </resources>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#000000"/></shape>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00FF88" android:pathData="M24,44h60v20h-60zM44,44a10,10 0 0,1 20,0a10,10 0 0,1 -20,0z"/>
          </vector>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/DynamicIslandService.kt
          package com.dynamicisland.aipro

          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.PixelFormat
          import android.view.Gravity
          import android.view.WindowManager
          import androidx.compose.animation.animateContentSize
          import androidx.compose.animation.core.Spring
          import androidx.compose.animation.core.spring
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.ComposeView
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.LifecycleService
          import androidx.lifecycle.ViewModelStore
          import androidx.lifecycle.ViewModelStoreOwner
          import androidx.lifecycle.setViewTreeLifecycleOwner
          import androidx.lifecycle.setViewTreeViewModelStoreOwner
          import androidx.savedstate.SavedStateRegistry
          import androidx.savedstate.SavedStateRegistryController
          import androidx.savedstate.SavedStateRegistryOwner
          import androidx.savedstate.setViewTreeSavedStateRegistryOwner
          import android.view.View

          class DynamicIslandService : LifecycleService(), ViewModelStoreOwner, SavedStateRegistryOwner {

              private lateinit var windowManager: WindowManager
              private lateinit var composeView: ComposeView
              private lateinit var params: WindowManager.LayoutParams
              private lateinit var prefs: SharedPreferences

              private val store = ViewModelStore()
              private val savedStateRegistryController = SavedStateRegistryController.create(this)
              override val viewModelStore: ViewModelStore get() = store
              override val savedStateRegistry: SavedStateRegistry get() = savedStateRegistryController.savedStateRegistry

              override fun onCreate() {
                  super.onCreate()
                  savedStateRegistryController.performRestore(null)
                  
                  prefs = getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  composeView = ComposeView(this)

                  composeView.setViewTreeLifecycleOwner(this)
                  composeView.setViewTreeViewModelStoreOwner(this)
                  composeView.setViewTreeSavedStateRegistryOwner(this)

                  val initialX = prefs.getInt("pos_x", 0)
                  val initialY = prefs.getInt("pos_y", 32)

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or 
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or 
                              WindowManager.LayoutParams.FLAG_LAYOUT_INSET_DECOR,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      x = initialX
                      y = initialY
                  }

                  composeView.setContent {
                      DynamicIslandComponent(prefs, windowManager, params, composeView)
                  }

                  windowManager.addView(composeView, params)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::composeView.isInitialized) {
                      windowManager.removeView(composeView)
                  }
              }
          }

          @Composable
          fun DynamicIslandComponent(
              prefs: SharedPreferences,
              windowManager: WindowManager,
              params: WindowManager.LayoutParams,
              view: View
          ) {
              var isExpanded by remember { mutableStateOf(false) }
              
              var islandWidth by remember { mutableStateOf(prefs.getInt("width", 130).dp) }
              var islandHeight by remember { mutableStateOf(prefs.getInt("height", 38).dp) }

              DisposableEffect(Unit) {
                  val listener = SharedPreferences.OnSharedPreferenceChangeListener { sharedPreferences, key ->
                      if (key == "width") islandWidth = sharedPreferences.getInt("width", 130).dp
                      if (key == "height") islandHeight = sharedPreferences.getInt("height", 38).dp
                  }
                  prefs.registerOnSharedPreferenceChangeListener(listener)
                  onDispose { prefs.unregisterOnSharedPreferenceChangeListener(listener) }
              }

              Box(
                  modifier = Modifier
                      .pointerInput(Unit) {
                          detectDragGestures(
                              onDragEnd = {
                                  prefs.edit()
                                      .putInt("pos_x", params.x)
                                      .putInt("pos_y", params.y)
                                      .apply()
                              }
                          ) { change, dragAmount ->
                              change.consume()
                              params.x += dragAmount.x.toInt()
                              params.y += dragAmount.y.toInt()
                              windowManager.updateViewLayout(view, params)
                          }
                      }
                      .padding(top = 8.dp)
                      .animateContentSize(
                          animationSpec = spring(
                              dampingRatio = Spring.DampingRatioLowBouncy,
                              stiffness = Spring.StiffnessLow
                          )
                      )
                      .background(Color.Black, shape = RoundedCornerShape(100.dp))
                      .clickable { isExpanded = !isExpanded },
                  contentAlignment = Alignment.Center
              ) {
                  if (!isExpanded) {
                      Row(
                          modifier = Modifier
                              .width(islandWidth)
                              .height(islandHeight)
                              .padding(horizontal = 12.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text("🟢", fontSize = 12.sp)
                          Text("AI Pro", color = Color.White, fontSize = 12.sp)
                      }
                  } else {
                      Column(
                          modifier = Modifier
                              .width(320.dp)
                              .height(100.dp)
                              .padding(16.dp),
                          verticalArrangement = Arrangement.Center
                      ) {
                          Text(text = "رسالة ذكية", color = Color.LightGray, fontSize = 12.sp)
                          Spacer(modifier = Modifier.height(8.dp))
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(text = "مرحباً! يمكنني المساعدة.", color = Color.White, fontSize = 16.sp)
                              Text(
                                  text = "✨", 
                                  fontSize = 18.sp,
                                  modifier = Modifier.clickable { isExpanded = false }
                              )
                          }
                      }
                  }
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/MainActivity.kt
          package com.dynamicisland.aipro

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("island_prefs", Context.MODE_PRIVATE)

                  setContent {
                      MaterialTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = Color(0xFF101411) 
                          ) {
                              Column(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .padding(24.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Text(
                                      text = "إعدادات الجزيرة 🏝️",
                                      color = Color.White,
                                      fontSize = 28.sp,
                                      fontWeight = FontWeight.Bold,
                                      modifier = Modifier.padding(bottom = 32.dp, top = 24.dp)
                                  )

                                  var widthValue by remember { mutableStateOf(prefs.getInt("width", 130).toFloat()) }
                                  ControlSlider(
                                      label = "العرض (Width): \${widthValue.toInt()}",
                                      value = widthValue,
                                      range = 80f..250f,
                                      onValueChange = { 
                                          widthValue = it
                                          prefs.edit().putInt("width", it.toInt()).apply()
                                      }
                                  )

                                  var heightValue by remember { mutableStateOf(prefs.getInt("height", 38).toFloat()) }
                                  ControlSlider(
                                      label = "الارتفاع (Height): \${heightValue.toInt()}",
                                      value = heightValue,
                                      range = 24f..80f,
                                      onValueChange = { 
                                          heightValue = it
                                          prefs.edit().putInt("height", it.toInt()).apply()
                                      }
                                  )
                                  
                                  Spacer(modifier = Modifier.height(24.dp))
                                  
                                  Card(
                                      colors = CardDefaults.cardColors(containerColor = Color(0xFF1E2320)),
                                      shape = RoundedCornerShape(16.dp),
                                      modifier = Modifier.fillMaxWidth()
                                  ) {
                                      Text(
                                          text = "💡 نصيحة: يمكنك تحريك الجزيرة وتغيير مكانها بمجرد الضغط عليها وسحبها بإصبعك على الشاشة مباشرة!",
                                          color = Color(0xFFA8E5BA),
                                          modifier = Modifier.padding(16.dp),
                                          fontSize = 14.sp
                                      )
                                  }

                                  Spacer(modifier = Modifier.weight(1f))

                                  Button(
                                      onClick = { checkOverlayAndStart() },
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .height(64.dp),
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFA8E5BA)),
                                      shape = RoundedCornerShape(32.dp)
                                  ) {
                                      Text(
                                          text = "تشغيل الجزيرة التفاعلية 🚀",
                                          color = Color(0xFF0F2015),
                                          fontSize = 18.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                              }
                          }
                      }
                  }
              }

              @Composable
              fun ControlSlider(label: String, value: Float, range: ClosedFloatingPointRange<Float>, onValueChange: (Float) -> Unit) {
                  Column(modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp)) {
                      Text(text = label, color = Color.LightGray, fontSize = 16.sp)
                      Slider(
                          value = value,
                          onValueChange = onValueChange,
                          valueRange = range,
                          colors = SliderDefaults.colors(
                              thumbColor = Color(0xFFA8E5BA),
                              activeTrackColor = Color(0xFFA8E5BA),
                              inactiveTrackColor = Color(0xFF2D322E)
                          )
                      )
                  }
              }

              private fun checkOverlayAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:\$packageName"))
                      startActivity(intent)
                  } else {
                      startService(Intent(this, DynamicIslandService::class.java))
                  }
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- صلاحية عرض النوافذ فوق التطبيقات -->
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".DynamicIslandService" android:exported="false" />
              </application>
          </manifest>
          INNER_EOF
          
          gradle wrapper --gradle-version 8.4 --no-daemon

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Project Cache
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/Dynamic-Island-Pro.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Island-Pro
          path: release-output/Dynamic-Island-Pro.apk
          retention-days: 5

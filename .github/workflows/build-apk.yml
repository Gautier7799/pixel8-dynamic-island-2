name: Build Dynamic Island Elegant Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for Dynamic Island
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Dynamic Island Compose Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/dynamicisland/aipro app/src/main/res/mipmap-anydpi-v26

          cat << 'INNER_EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          INNER_EOF

          cat << 'INNER_EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DynamicIslandAIPro"
          include(":app")
          INNER_EOF

          cat << 'INNER_EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          INNER_EOF

          cat << 'INNER_EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.dynamicisland.aipro"
              compileSdk = 34
              defaultConfig { applicationId = "com.dynamicisland.aipro"; minSdk = 28; targetSdk = 34; versionCode = 4; versionName = "1.3.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-service:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Dynamic Island Pro</string>
          </resources>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#000000"/></shape>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00FF88" android:pathData="M24,44h60v20h-60zM44,44a10,10 0 0,1 20,0a10,10 0 0,1 -20,0z"/>
          </vector>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/IslandNotificationListener.kt
          package com.dynamicisland.aipro

          import android.content.Intent
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class IslandNotificationListener : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val extras = sbn.notification.extras
                  val title = extras.getString("android.title") ?: return
                  val text = extras.getCharSequence("android.text")?.toString() ?: return
                  
                  if (sbn.isOngoing || (sbn.notification.flags and android.app.Notification.FLAG_GROUP_SUMMARY) != 0) return

                  val intent = Intent("com.dynamicisland.aipro.NEW_NOTIFICATION")
                  intent.putExtra("title", title)
                  intent.putExtra("text", text)
                  sendBroadcast(intent)
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/DynamicIslandService.kt
          package com.dynamicisland.aipro

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.graphics.PixelFormat
          import android.os.BatteryManager
          import android.os.Handler
          import android.os.Looper
          import android.provider.AlarmClock
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import androidx.compose.animation.animateContentSize
          import androidx.compose.animation.core.Spring
          import androidx.compose.animation.core.spring
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.ComposeView
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.LifecycleService
          import androidx.lifecycle.ViewModelStore
          import androidx.lifecycle.ViewModelStoreOwner
          import androidx.lifecycle.lifecycleScope
          import androidx.lifecycle.setViewTreeLifecycleOwner
          import androidx.lifecycle.setViewTreeViewModelStoreOwner
          import androidx.savedstate.SavedStateRegistry
          import androidx.savedstate.SavedStateRegistryController
          import androidx.savedstate.SavedStateRegistryOwner
          import androidx.savedstate.setViewTreeSavedStateRegistryOwner
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch

          enum class IslandMode { IDLE, SHORTCUTS, CHARGING, NOTIF_COMPACT, NOTIF_EXPANDED }

          class DynamicIslandService : LifecycleService(), ViewModelStoreOwner, SavedStateRegistryOwner {

              private lateinit var windowManager: WindowManager
              private lateinit var composeView: ComposeView
              private lateinit var params: WindowManager.LayoutParams
              private lateinit var prefs: SharedPreferences

              private val store = ViewModelStore()
              private val savedStateRegistryController = SavedStateRegistryController.create(this)
              override val viewModelStore: ViewModelStore get() = store
              override val savedStateRegistry: SavedStateRegistry get() = savedStateRegistryController.savedStateRegistry

              private val islandModeState = mutableStateOf(IslandMode.IDLE)
              private val batteryLevelState = mutableStateOf(100)
              
              private val notifTitleState = mutableStateOf("")
              private val notifTextState = mutableStateOf("")

              private val islandWidthState = mutableStateOf(130.dp)
              private val islandHeightState = mutableStateOf(38.dp)
              private val islandRadiusState = mutableStateOf(100.dp)

              private val handler = Handler(Looper.getMainLooper())
              private val collapseRunnable = Runnable { 
                  if (islandModeState.value == IslandMode.NOTIF_COMPACT) {
                      islandModeState.value = IslandMode.IDLE 
                  }
              }

              private val notificationReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == "com.dynamicisland.aipro.NEW_NOTIFICATION") {
                          notifTitleState.value = intent.getStringExtra("title") ?: ""
                          notifTextState.value = intent.getStringExtra("text") ?: ""
                          islandModeState.value = IslandMode.NOTIF_COMPACT 
                          
                          handler.removeCallbacks(collapseRunnable)
                          handler.postDelayed(collapseRunnable, 4000)
                      }
                  }
              }

              private val powerReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == Intent.ACTION_POWER_CONNECTED) {
                          val bm = context?.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                          batteryLevelState.value = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                          islandModeState.value = IslandMode.CHARGING
                          lifecycleScope.launch {
                              delay(3000)
                              if (islandModeState.value == IslandMode.CHARGING) islandModeState.value = IslandMode.IDLE
                          }
                      }
                  }
              }

              private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { sharedPreferences, key ->
                  when (key) {
                      "width" -> islandWidthState.value = sharedPreferences.getInt("width", 130).dp
                      "height" -> islandHeightState.value = sharedPreferences.getInt("height", 38).dp
                      "radius" -> islandRadiusState.value = sharedPreferences.getInt("radius", 100).dp
                      "pos_x" -> {
                          params.x = sharedPreferences.getInt("pos_x", 0)
                          windowManager.updateViewLayout(composeView, params)
                      }
                      "pos_y" -> {
                          params.y = sharedPreferences.getInt("pos_y", 32)
                          windowManager.updateViewLayout(composeView, params)
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  savedStateRegistryController.performRestore(null)
                  
                  prefs = getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                  prefs.registerOnSharedPreferenceChangeListener(prefListener)
                  
                  islandWidthState.value = prefs.getInt("width", 130).dp
                  islandHeightState.value = prefs.getInt("height", 38).dp
                  islandRadiusState.value = prefs.getInt("radius", 100).dp

                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  composeView = ComposeView(this)

                  composeView.setViewTreeLifecycleOwner(this)
                  composeView.setViewTreeViewModelStoreOwner(this)
                  composeView.setViewTreeSavedStateRegistryOwner(this)

                  val filter = IntentFilter(Intent.ACTION_POWER_CONNECTED)
                  registerReceiver(powerReceiver, filter)

                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(notificationReceiver, IntentFilter("com.dynamicisland.aipro.NEW_NOTIFICATION"), Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(notificationReceiver, IntentFilter("com.dynamicisland.aipro.NEW_NOTIFICATION"))
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or 
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or 
                              WindowManager.LayoutParams.FLAG_LAYOUT_INSET_DECOR,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      x = prefs.getInt("pos_x", 0)
                      y = prefs.getInt("pos_y", 32)
                  }

                  var initialX = 0
                  var initialY = 0
                  var initialTouchX = 0f
                  var initialTouchY = 0f
                  var isMoving = false

                  composeView.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              isMoving = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - initialTouchX).toInt()
                              val dy = (event.rawY - initialTouchY).toInt()
                              if (Math.abs(dx) > 10 || Math.abs(dy) > 10) { 
                                  isMoving = true
                                  params.x = initialX + dx
                                  params.y = initialY + dy
                                  windowManager.updateViewLayout(composeView, params)
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!isMoving) {
                                  // نظام النقر الذكي الجديد
                                  when (islandModeState.value) {
                                      IslandMode.IDLE -> islandModeState.value = IslandMode.SHORTCUTS
                                      IslandMode.SHORTCUTS -> islandModeState.value = IslandMode.IDLE
                                      IslandMode.NOTIF_COMPACT -> {
                                          islandModeState.value = IslandMode.NOTIF_EXPANDED
                                          handler.removeCallbacks(collapseRunnable) // إيقاف الإغلاق التلقائي
                                      }
                                      IslandMode.NOTIF_EXPANDED -> islandModeState.value = IslandMode.IDLE
                                      IslandMode.CHARGING -> islandModeState.value = IslandMode.IDLE
                                  }
                              } else {
                                  prefs.edit().putInt("pos_x", params.x).putInt("pos_y", params.y).apply()
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  composeView.setContent {
                      DynamicIslandContent(
                          mode = islandModeState.value,
                          batteryLevel = batteryLevelState.value,
                          width = islandWidthState.value,
                          height = islandHeightState.value,
                          radius = islandRadiusState.value,
                          notifTitle = notifTitleState.value,
                          notifText = notifTextState.value,
                          onShortcutClick = { action -> executeAction(action) }
                      )
                  }

                  windowManager.addView(composeView, params)
              }

              private fun executeAction(action: String) {
                  islandModeState.value = IslandMode.IDLE 
                  try {
                      val intent = when (action) {
                          "settings" -> Intent(Settings.ACTION_SETTINGS)
                          "clock" -> Intent(AlarmClock.ACTION_SHOW_ALARMS)
                          "camera" -> Intent(MediaStore.ACTION_IMAGE_CAPTURE)
                          "ai" -> Intent(Intent.ACTION_WEB_SEARCH).apply { putExtra("query", "ChatGPT") }
                          else -> null
                      }
                      intent?.let {
                          it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(it)
                      }
                  } catch (e: Exception) {}
              }

              override fun onDestroy() {
                  super.onDestroy()
                  unregisterReceiver(powerReceiver)
                  unregisterReceiver(notificationReceiver)
                  prefs.unregisterOnSharedPreferenceChangeListener(prefListener)
                  if (::composeView.isInitialized) windowManager.removeView(composeView)
              }
          }

          @Composable
          fun DynamicIslandContent(
              mode: IslandMode,
              batteryLevel: Int,
              width: androidx.compose.ui.unit.Dp,
              height: androidx.compose.ui.unit.Dp,
              radius: androidx.compose.ui.unit.Dp,
              notifTitle: String,
              notifText: String,
              onShortcutClick: (String) -> Unit
          ) {
              val targetWidth = when (mode) {
                  IslandMode.SHORTCUTS -> 320.dp
                  IslandMode.CHARGING -> 220.dp
                  IslandMode.NOTIF_COMPACT -> 340.dp
                  IslandMode.NOTIF_EXPANDED -> 340.dp
                  else -> width
              }
              val targetHeight = when (mode) {
                  IslandMode.SHORTCUTS -> 90.dp
                  IslandMode.CHARGING -> 50.dp
                  IslandMode.NOTIF_COMPACT -> 70.dp
                  IslandMode.NOTIF_EXPANDED -> 160.dp // مساحة أكبر لقراءة الإشعار كاملاً
                  else -> height
              }

              Box(
                  modifier = Modifier
                      .width(targetWidth)
                      .height(targetHeight)
                      .animateContentSize(
                          // حركة سريعة جداً للقضاء على اللاق والانبثاق للأسفل
                          animationSpec = spring(
                              dampingRatio = 0.75f, 
                              stiffness = 500f 
                          )
                      )
                      .background(Color.Black, shape = RoundedCornerShape(radius)),
                  contentAlignment = Alignment.TopCenter // التوسيع يكون للأسفل!
              ) {
                  when (mode) {
                      IslandMode.IDLE -> {
                          // فارغة تماماً وسوداء لتندمج مع الكاميرا
                      }
                      IslandMode.CHARGING -> {
                          Row(
                              modifier = Modifier.fillMaxSize().padding(horizontal = 24.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(text = "⚡", fontSize = 18.sp)
                              Text(text = batteryLevel.toString() + "%", color = Color(0xFF4CAF50), fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                      IslandMode.SHORTCUTS -> {
                          Row(
                              modifier = Modifier.fillMaxSize(),
                              horizontalArrangement = Arrangement.SpaceEvenly,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              ShortcutButton("⚙️", { onShortcutClick("settings") })
                              ShortcutButton("⏰", { onShortcutClick("clock") })
                              ShortcutButton("📸", { onShortcutClick("camera") })
                              ShortcutButton("✨", { onShortcutClick("ai") }) // زر الذكاء الاصطناعي كاختيار
                          }
                      }
                      IslandMode.NOTIF_COMPACT -> {
                          Row(
                              modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Box(modifier = Modifier.size(36.dp).background(Color(0xFF1E2320), CircleShape), contentAlignment = Alignment.Center) {
                                  Text("💬", fontSize = 16.sp)
                              }
                              Spacer(modifier = Modifier.width(12.dp))
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(text = notifTitle, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  Text(text = notifText, color = Color.LightGray, fontSize = 12.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              }
                          }
                      }
                      IslandMode.NOTIF_EXPANDED -> {
                          Column(
                              modifier = Modifier.fillMaxSize().padding(16.dp),
                              horizontalAlignment = Alignment.Start
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Box(modifier = Modifier.size(32.dp).background(Color(0xFF1E2320), CircleShape), contentAlignment = Alignment.Center) {
                                      Text("💬", fontSize = 14.sp)
                                  }
                                  Spacer(modifier = Modifier.width(12.dp))
                                  Text(text = notifTitle, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                              }
                              Spacer(modifier = Modifier.height(12.dp))
                              // عرض النص كاملاً
                              Text(text = notifText, color = Color.LightGray, fontSize = 14.sp, maxLines = 6, overflow = TextOverflow.Ellipsis)
                          }
                      }
                  }
              }
          }

          @Composable
          fun ShortcutButton(icon: String, onClick: () -> Unit) {
              Box(
                  modifier = Modifier
                      .size(44.dp)
                      .clip(CircleShape)
                      .background(Color(0xFF1E2320))
                      .clickable { onClick() },
                  contentAlignment = Alignment.Center
              ) {
                  Text(text = icon, fontSize = 20.sp)
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/MainActivity.kt
          package com.dynamicisland.aipro

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                  val dp = resources.displayMetrics.density

                  val bgDark = Color.parseColor("#101411")
                  val pillActive = Color.parseColor("#A8E5BA")
                  val pillInactive = Color.parseColor("#2D322E")
                  val textOnActive = Color.parseColor("#0F2015")
                  val textOnDark = Color.parseColor("#E1E3DF")

                  val scrollView = ScrollView(this).apply {
                      setBackgroundColor(bgDark)
                      isFillViewport = true
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding((20*dp).toInt(), (32*dp).toInt(), (20*dp).toInt(), (32*dp).toInt())
                  }
                  scrollView.addView(root)

                  root.addView(TextView(this).apply {
                      text = "إعدادات الجزيرة 🏝️"
                      textSize = 28f
                      setTextColor(textOnDark)
                      gravity = Gravity.CENTER
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, (24*dp).toInt())
                  })

                  // تم تصغير سمك الشريط ليصبح أنحف وأكثر أناقة (24dp بدلاً من 56dp)
                  fun createMaterialSlider(currentVal: Float, min: Float, max: Float, onUpdate: (Float) -> Unit): View {
                      val containerHeight = (24 * dp).toInt() 
                      val container = FrameLayout(this@MainActivity).apply {
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, containerHeight)
                          background = GradientDrawable().apply { setColor(pillInactive); cornerRadius = containerHeight / 2f }
                      }
                      
                      val fillView = View(this@MainActivity).apply {
                          layoutParams = FrameLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT)
                          background = GradientDrawable().apply { setColor(pillActive); cornerRadius = containerHeight / 2f }
                      }
                      container.addView(fillView)

                      var currentWidth = currentVal
                      fun updateFillWidth(totalWidth: Int) {
                          if (totalWidth <= 0) return
                          val progress = ((currentWidth - min) / (max - min)).coerceIn(0f, 1f)
                          val fillWidth = (containerHeight + progress * (totalWidth - containerHeight)).toInt()
                          fillView.layoutParams = FrameLayout.LayoutParams(fillWidth, ViewGroup.LayoutParams.MATCH_PARENT)
                          fillView.requestLayout()
                      }

                      container.addOnLayoutChangeListener { _, left, _, right, _, oldLeft, _, oldRight, _ ->
                          val width = right - left
                          val oldWidth = oldRight - oldLeft
                          if (width > 0 && width != oldWidth) updateFillWidth(width)
                      }
                      container.post { updateFillWidth(container.width) }

                      container.setOnTouchListener { v, event ->
                          val totalWidth = v.width
                          if (totalWidth <= 0) return@setOnTouchListener false
                          var newWidth = event.x.toInt()
                          if (newWidth < containerHeight) newWidth = containerHeight
                          if (newWidth > totalWidth) newWidth = totalWidth
                          
                          fillView.layoutParams = FrameLayout.LayoutParams(newWidth, ViewGroup.LayoutParams.MATCH_PARENT)
                          fillView.requestLayout()
                          
                          val progress = (newWidth - containerHeight).toFloat() / (totalWidth - containerHeight).toFloat()
                          currentWidth = min + (progress * (max - min))
                          onUpdate(currentWidth)
                          true
                      }
                      return container
                  }

                  fun createSliderSection(title: String, initial: Float, min: Float, max: Float, onUpdate: (Float) -> Unit) {
                      val label = TextView(this@MainActivity).apply {
                          text = title + ": " + initial.toInt()
                          textSize = 14f
                          setTextColor(Color.WHITE)
                          setPadding(0, 0, 0, (8*dp).toInt())
                      }
                      val slider = createMaterialSlider(initial, min, max) { newVal ->
                          label.text = title + ": " + newVal.toInt()
                          onUpdate(newVal)
                      }
                      val section = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                              bottomMargin = (20*dp).toInt()
                          }
                      }
                      section.addView(label)
                      section.addView(slider)
                      root.addView(section)
                  }

                  // تم توسيع النطاقات (Limits) بناءً على طلبك
                  createSliderSection("العرض (Width)", prefs.getInt("width", 130).toFloat(), 30f, 400f) {
                      prefs.edit().putInt("width", it.toInt()).apply()
                  }
                  // الحد الأدنى للارتفاع أصبح 10 ليتطابق مع أصغر كاميرا
                  createSliderSection("الارتفاع (Height)", prefs.getInt("height", 38).toFloat(), 10f, 150f) {
                      prefs.edit().putInt("height", it.toInt()).apply()
                  }
                  createSliderSection("الاستدارة (Corner Radius)", prefs.getInt("radius", 100).toFloat(), 0f, 150f) {
                      prefs.edit().putInt("radius", it.toInt()).apply()
                  }
                  createSliderSection("يمين / يسار (X Axis)", prefs.getInt("pos_x", 0).toFloat(), -600f, 600f) {
                      prefs.edit().putInt("pos_x", it.toInt()).apply()
                  }
                  // النطاق أصبح حتى -800 لرفع الجزيرة لأقصى حد
                  createSliderSection("أعلى / أسفل (Y Axis)", prefs.getInt("pos_y", 32).toFloat(), -800f, 500f) {
                      prefs.edit().putInt("pos_y", it.toInt()).apply()
                  }

                  root.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(1, 0, 1f) }) 

                  val notifBtn = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1E2320")); cornerRadius = 24f * dp }
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, (56*dp).toInt())
                      gravity = Gravity.CENTER
                      addView(TextView(context).apply {
                          text = "صلاحية الإشعارات 💬"
                          textSize = 15f
                          setTextColor(Color.WHITE)
                          typeface = android.graphics.Typeface.DEFAULT_BOLD
                      })
                      setOnClickListener {
                          startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"))
                      }
                  }
                  root.addView(notifBtn)

                  val btn = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      background = GradientDrawable().apply { setColor(pillActive); cornerRadius = 24f * dp }
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, (56*dp).toInt()).apply {
                          topMargin = (12*dp).toInt()
                      }
                      gravity = Gravity.CENTER
                      addView(TextView(context).apply {
                          text = "تشغيل الجزيرة التفاعلية 🚀"
                          textSize = 16f
                          setTextColor(textOnActive)
                          typeface = android.graphics.Typeface.DEFAULT_BOLD
                      })
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                              startActivity(intent)
                          } else {
                              startService(Intent(this@MainActivity, DynamicIslandService::class.java))
                          }
                      }
                  }
                  root.addView(btn)

                  setContentView(scrollView)
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".DynamicIslandService" android:exported="false" />
                  
                  <service android:name=".IslandNotificationListener"
                           android:label="Dynamic Island Notifications"
                           android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                           android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          INNER_EOF
          
          gradle wrapper --gradle-version 8.4 --no-daemon

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Project Cache
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/Dynamic-Island-Pro.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Island-Pro
          path: release-output/Dynamic-Island-Pro.apk
          retention-days: 5

name: Build Dynamic Island Pixel 8 Pro Luxury Edition APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK for Pixel 8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # بناء المحرك الجديد مع تصحيح ربط خدمة الإشعارات والموسيقى في نظام أندرويد بالكامل
      # ونزول الجزيرة المتوسعة تحت شريط الحالة لمنع تداخل الساعة وأيقونات الشبكة والبطارية
      - name: Build Pixel 8 Pro Dynamic Island Luxury App
        run: |
          rm -rf app/src/main/res
          rm -rf app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/anim
          mkdir -p app/src/main/java/com/dynamicisland/pixel8

          # 1. إعداد gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. إعداد settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DynamicIslandPixel8"
          include(":app")
          EOF

          # 3. إعداد build.gradle.kts الرئيسي
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. إعداد app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.dynamicisland.pixel8"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.dynamicisland.pixel8"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 12
                  versionName = "4.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.media:media:1.7.0")
          }
          EOF

          # 5. منظومة الألوان
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="m3_surface">#0A0C10</color>
              <color name="m3_surface_container">#14171E</color>
              <color name="m3_surface_container_high">#1E222B</color>
              <color name="m3_primary">#9ECAFF</color>
              <color name="m3_on_primary">#003258</color>
              <color name="m3_primary_container">#00497D</color>
              <color name="m3_text_primary">#C8CCD6</color>
              <color name="m3_text_secondary">#9DA3B0</color>
              <color name="m3_text_tertiary">#6E7482</color>
              <color name="m3_outline_variant">#222731</color>
              <color name="island_black">#000000</color>
              <color name="island_border_soft">#C8CCD6</color>
              <color name="island_whatsapp">#25D366</color>
              <color name="island_spotify">#1DB954</color>
              <color name="island_charging">#34D399</color>
              <color name="island_buds">#38BDF8</color>
          </resources>
          EOF

          # 6. نصوص التطبيق
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Dynamic Island</string>
              <string name="channel_name">Dynamic Island Service</string>
              <string name="channel_desc">تشغيل الجزيرة التفاعلية فوق الشاشة</string>
          </resources>
          EOF

          # 7. الأشكال والرسومات الدائرية بالكامل (Arrondi)
          cat << 'EOF' > app/src/main/res/drawable/bg_round_pill_button.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#9ECAFF" />
              <corners android:radius="100dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_test_btn_charging.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#003315" />
              <corners android:radius="100dp" />
              <stroke android:width="1.2dp" android:color="#34D399" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_test_btn_music.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#062410" />
              <corners android:radius="100dp" />
              <stroke android:width="1.2dp" android:color="#1DB954" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_test_btn_buds.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#002230" />
              <corners android:radius="100dp" />
              <stroke android:width="1.2dp" android:color="#38BDF8" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_test_btn_whatsapp.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#042C11" />
              <corners android:radius="100dp" />
              <stroke android:width="1.2dp" android:color="#25D366" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card_m3.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#14171E" />
              <corners android:radius="26dp" />
              <stroke android:width="1dp" android:color="#222731" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_action_chip.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#1C202B" />
              <corners android:radius="100dp" />
              <stroke android:width="0.8dp" android:color="#323846" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0A0C10" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#9ECAFF" android:pathData="M24,42h60a12,12 0 0,1 12,12v0a12,12 0 0,1 -12,12h-60a12,12 0 0,1 -12,-12v0a12,12 0 0,1 12,-12z"/>
              <path android:fillColor="#003258" android:pathData="M38,50a4,4 0 1,1 0,8 4,4 0 0,1 0,-8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/m3_surface"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/m3_surface"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_bolt.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#34D399" android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_spotify.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#1DB954" android:pathData="M12 2C6.477 2 2 6.477 2 12c0 5.523 4.477 10 10 10s10-4.477 10-10c0-5.523-4.477-10-10-10zm4.586 14.424c-.18.295-.563.387-.857.207-2.35-1.434-5.308-1.758-8.793-.963-.335.077-.67-.133-.746-.468-.077-.334.132-.67.467-.746 3.808-.87 7.076-.51 9.721 1.113.294.18.388.563.208.857zm1.226-2.723c-.226.367-.707.482-1.074.256-2.69-1.653-6.79-2.133-9.97-1.168-.413.125-.85-.11-.975-.523-.125-.413.11-.85.523-.975 3.633-1.103 8.15-.569 11.24 1.336.367.226.482.707.256 1.074zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71c-.494.15-1.018-.129-1.168-.623-.15-.494.129-1.018.623-1.168 3.532-1.072 9.404-.87 13.13 1.344.444.263.59.837.327 1.28-.264.445-.838.59-1.282.328z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_whatsapp.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#25D366" android:pathData="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm.01 1.67c4.54 0 8.24 3.7 8.24 8.24 0 2.2-.86 4.27-2.42 5.83a8.18 8.18 0 0 1-5.82 2.41c-1.49 0-2.95-.4-4.22-1.16l-.3-.18-3.13.82.83-3.05-.2-.31a8.196 8.196 0 0 1-1.26-4.36c0-4.54 3.7-8.24 8.28-8.24zm4.53 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.03-1.25-.75-.67-1.26-1.5-1.41-1.75-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.13-.14.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.34-.76-1.84-.2-.49-.4-.42-.56-.43h-.47c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.44.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.07-.1-.23-.17-.48-.29z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_headphones.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#38BDF8" android:pathData="M12,3a9,9 0 0,0 -9,9v7a3,3 0 0,0 3,3h1a2,2 0 0,0 2,-2v-4a2,2 0 0,0 -2,-2H5v-2a7,7 0 0,1 14,0v2h-2a2,2 0 0,0 -2,2v4a2,2 0 0,0 2,2h1a3,3 0 0,0 3,-3v-7a9,9 0 0,0 -9,-9z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_check_circle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#6DD58C" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,17l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z"/>
          </vector>
          EOF

          # 8. واجهة الجزيرة التفاعلية (معزولة بالكامل دون تداخل مع الساعة وأيقونات شريط الحالة)
          cat << 'EOF' > app/src/main/res/layout/view_pixel8_island.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/islandRoot"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <!-- حالة السكون الافتراضية (Idle State - فوق الكاميرا فقط) -->
              <View
                  android:id="@+id/layoutIdle"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#000000"
                  android:visibility="visible" />

              <!-- كبسولة التنبيه المصغرة الممتدة (Compact Pill - عرض 135dp فقط في منتصف الكاميرا لا يصل للساعة أو البطارية) -->
              <LinearLayout
                  android:id="@+id/layoutCompact"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#000000"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="8dp"
                  android:paddingEnd="8dp"
                  android:visibility="gone">

                  <ImageView
                      android:id="@+id/ivCompactIcon"
                      android:layout_width="16dp"
                      android:layout_height="16dp"
                      android:src="@drawable/ic_bolt" />

                  <TextView
                      android:id="@+id/tvCompactTitle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="4dp"
                      android:layout_marginEnd="4dp"
                      android:gravity="center"
                      android:textColor="#C8CCD6"
                      android:textSize="11sp"
                      android:fontFamily="sans-serif-medium"
                      android:maxLines="1"
                      android:ellipsize="end" />

                  <TextView
                      android:id="@+id/tvCompactValue"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="#34D399"
                      android:textSize="11sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- بطاقة التوسع الفاخرة المستقلة (Expanded Card - تفتح تحت شريط الحالة بمساحة فسيحة معزولة 100%) -->
              <LinearLayout
                  android:id="@+id/layoutExpanded"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#000000"
                  android:orientation="vertical"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp"
                  android:paddingTop="12dp"
                  android:paddingBottom="12dp"
                  android:gravity="center_vertical"
                  android:visibility="gone">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical">

                      <FrameLayout
                          android:layout_width="38dp"
                          android:layout_height="38dp"
                          android:background="@drawable/bg_action_chip"
                          android:padding="6dp">
                          <ImageView
                              android:id="@+id/ivExpandedBadge"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:src="@drawable/ic_spotify" />
                      </FrameLayout>

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:layout_marginStart="12dp"
                          android:layout_marginEnd="8dp"
                          android:orientation="vertical">

                          <TextView
                              android:id="@+id/tvExpandedHeader"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:textColor="#C8CCD6"
                              android:textSize="14sp"
                              android:textStyle="bold"
                              android:text="Spotify Music"
                              android:maxLines="1"
                              android:ellipsize="end" />

                          <TextView
                              android:id="@+id/tvExpandedSubtext"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:textColor="#9DA3B0"
                              android:textSize="12sp"
                              android:text="Starboy • The Weeknd"
                              android:maxLines="1"
                              android:ellipsize="end" />
                      </LinearLayout>

                      <TextView
                          android:id="@+id/tvExpandedExtra"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:textColor="#C8CCD6"
                          android:textSize="12sp"
                          android:text="02:45" />
                  </LinearLayout>

                  <!-- أزرار الإجراءات التفاعلية للتحكم الحقيقي في الموسيقى -->
                  <LinearLayout
                      android:id="@+id/layoutExpandedActions"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center"
                      android:layout_marginTop="12dp">

                      <androidx.appcompat.widget.AppCompatButton
                          android:id="@+id/btnActionPrev"
                          android:layout_width="0dp"
                          android:layout_height="34dp"
                          android:layout_weight="1"
                          android:text="⏮️ السابق"
                          android:textSize="11sp"
                          android:background="@drawable/bg_action_chip"
                          android:textColor="#C8CCD6"
                          android:layout_marginEnd="6dp" />

                      <androidx.appcompat.widget.AppCompatButton
                          android:id="@+id/btnActionPlayPause"
                          android:layout_width="0dp"
                          android:layout_height="34dp"
                          android:layout_weight="1"
                          android:text="⏯️ تشغيل/إيقاف"
                          android:textSize="11sp"
                          android:background="@drawable/bg_round_pill_button"
                          android:textColor="#003258"
                          android:textStyle="bold"
                          android:layout_marginEnd="6dp" />

                      <androidx.appcompat.widget.AppCompatButton
                          android:id="@+id/btnActionNext"
                          android:layout_width="0dp"
                          android:layout_height="34dp"
                          android:layout_weight="1"
                          android:text="⏭️ التالي"
                          android:textSize="11sp"
                          android:background="@drawable/bg_action_chip"
                          android:textColor="#C8CCD6" />
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          EOF

          # 9. واجهة تطبيق Google Pixel الرسمية
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/m3_surface"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <!-- Header Pixel 8 Pro Style -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="24dp">

                      <FrameLayout
                          android:layout_width="54dp"
                          android:layout_height="54dp"
                          android:background="@drawable/bg_round_pill_button"
                          android:padding="4dp">
                          <ImageView
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:src="@drawable/ic_launcher_foreground" />
                      </FrameLayout>

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:layout_marginStart="16dp"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Dynamic Island"
                              android:textColor="@color/m3_text_primary"
                              android:textSize="24sp"
                              android:fontFamily="sans-serif-medium"
                              android:textStyle="bold" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Google Pixel 8 Pro • Final Edition"
                              android:textColor="@color/m3_primary"
                              android:textSize="13sp" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- بطاقة حالة وتفعيل الصلاحيات -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="إعدادات وصلاحيات النظام"
                      android:textColor="@color/m3_text_secondary"
                      android:textSize="13sp"
                      android:fontFamily="sans-serif-medium"
                      android:layout_marginStart="6dp"
                      android:layout_marginBottom="8dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="@drawable/bg_card_m3"
                      android:padding="16dp"
                      android:layout_marginBottom="20dp">

                      <!-- صلاحية 1: الظهور فوق التطبيقات -->
                      <LinearLayout
                          android:id="@+id/btnOverlayPermission"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"

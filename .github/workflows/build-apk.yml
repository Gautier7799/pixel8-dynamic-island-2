name: Build Dynamic Island Pixel 8 Pro Edition APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK for Pixel 8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # إعادة تصميم وبناء تطبيق بمستوى جوجل الرسمي Material You 3
      - name: Build Pixel 8 Pro Dynamic Island Luxury App
        run: |
          rm -rf app/src/main/res
          rm -rf app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/anim
          mkdir -p app/src/main/java/com/dynamicisland/pixel8

          # 1. إعداد gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. إعداد settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DynamicIslandPixel8"
          include(":app")
          EOF

          # 3. إعداد build.gradle.kts الرئيسي
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. إعداد app/build.gradle.kts مع أحدث مكتبات Material 3 و Core KTX
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.dynamicisland.pixel8"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.dynamicisland.pixel8"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 6
                  versionName = "3.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.cardview:cardview:1.0.0")
          }
          EOF

          # 5. منظومة الألوان الفاخرة Material You M3
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="m3_surface">#111318</color>
              <color name="m3_surface_container">#1D2024</color>
              <color name="m3_surface_container_high">#272A2F</color>
              <color name="m3_surface_container_highest">#32353A</color>
              <color name="m3_primary">#A8C7FA</color>
              <color name="m3_on_primary">#062E6F</color>
              <color name="m3_primary_container">#0842A0</color>
              <color name="m3_on_primary_container">#D3E3FD</color>
              <color name="m3_secondary">#7FCFFF</color>
              <color name="m3_secondary_container">#004D68</color>
              <color name="m3_tertiary">#6DD58C</color>
              <color name="m3_tertiary_container">#005324</color>
              <color name="m3_text_primary">#E1E2E8</color>
              <color name="m3_text_secondary">#C3C6CF</color>
              <color name="m3_text_tertiary">#8D9199</color>
              <color name="m3_outline">#43474E</color>
              <color name="m3_outline_variant">#2B2F36</color>
              <color name="true_black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="battery_green">#34D399</color>
              <color name="music_pink">#F43F5E</color>
              <color name="bluetooth_blue">#38BDF8</color>
          </resources>
          EOF

          # 6. نصوص التطبيق الاحترافية
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Dynamic Island Pro</string>
          </resources>
          EOF

          # 7. بطاقات وتأثيرات Material You 3 الدائرية الفاخرة
          cat << 'EOF' > app/src/main/res/drawable/bg_island_capsule.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#000000" />
              <corners android:radius="100dp" />
              <stroke android:width="1.2dp" android:color="#33FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_island_expanded.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#0C0E12" />
              <corners android:radius="26dp" />
              <stroke android:width="1.2dp" android:color="#44FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card_m3.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#1D2024" />
              <corners android:radius="24dp" />
              <stroke android:width="1dp" android:color="#2B2F36" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_chip_active.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#0842A0" />
              <corners android:radius="14dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_pill_button.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#A8C7FA" />
              <corners android:radius="100dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#111318" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#A8C7FA" android:pathData="M24,42h60a12,12 0 0,1 12,12v0a12,12 0 0,1 -12,12h-60a12,12 0 0,1 -12,-12v0a12,12 0 0,1 12,-12z"/>
              <path android:fillColor="#062E6F" android:pathData="M38,50a4,4 0 1,1 0,8 4,4 0 0,1 0,-8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/m3_surface"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/m3_surface"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # أيقونات Vectorial عالية الدقة للميزات
          cat << 'EOF' > app/src/main/res/drawable/ic_bolt.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#34D399" android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_music.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#F43F5E" android:pathData="M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55 -2.21,0 -4,1.79 -4,4s1.79,4 4,4 4,-1.79 4,-4V7h4V3h-6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_headphones.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#38BDF8" android:pathData="M12,3a9,9 0 0,0 -9,9v7a3,3 0 0,0 3,3h1a2,2 0 0,0 2,-2v-4a2,2 0 0,0 -2,-2H5v-2a7,7 0 0,1 14,0v2h-2a2,2 0 0,0 -2,2v4a2,2 0 0,0 2,2h1a3,3 0 0,0 3,-3v-7a9,9 0 0,0 -9,-9z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_check_circle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#6DD58C" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,17l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z"/>
          </vector>
          EOF

          # 8. واجهة الجزيرة الفاخرة
          cat << 'EOF' > app/src/main/res/layout/view_pixel8_island.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/islandRoot"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/bg_island_capsule">

              <!-- حالة السكون الافتراضية (Idle State) -->
              <LinearLayout
                  android:id="@+id/layoutIdle"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:gravity="center"
                  android:orientation="horizontal"
                  android:visibility="visible">
                  <View
                      android:layout_width="14dp"
                      android:layout_height="14dp"
                      android:background="#000000" />
              </LinearLayout>

              <!-- كبسولة التنبيه المصغرة الممتدة (Compact Island) -->
              <LinearLayout
                  android:id="@+id/layoutCompact"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="12dp"
                  android:paddingEnd="12dp"
                  android:visibility="gone">

                  <ImageView
                      android:id="@+id/ivCompactIcon"
                      android:layout_width="18dp"
                      android:layout_height="18dp"
                      android:src="@drawable/ic_bolt" />

                  <TextView
                      android:id="@+id/tvCompactTitle"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="8dp"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp"
                      android:fontFamily="sans-serif-medium"
                      android:maxLines="1"
                      android:ellipsize="end" />

                  <TextView
                      android:id="@+id/tvCompactValue"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="#34D399"
                      android:textSize="12sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- بطاقة التوسع الفاخرة للتحكم والقراءة (Expanded Card) -->
              <LinearLayout
                  android:id="@+id/layoutExpanded"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:padding="16dp"
                  android:gravity="center_vertical"
                  android:visibility="gone">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical">

                      <ImageView
                          android:id="@+id/ivExpandedBadge"
                          android:layout_width="38dp"
                          android:layout_height="38dp"
                          android:padding="8dp"
                          android:background="@drawable/bg_island_capsule"
                          android:src="@drawable/ic_music" />

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:layout_marginStart="12dp"
                          android:orientation="vertical">

                          <TextView
                              android:id="@+id/tvExpandedHeader"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp"
                              android:textStyle="bold"
                              android:text="Spotify Music"
                              android:maxLines="1" />

                          <TextView
                              android:id="@+id/tvExpandedSubtext"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:textColor="#C3C6CF"
                              android:textSize="12sp"
                              android:text="Starboy • The Weeknd"
                              android:maxLines="2" />
                      </LinearLayout>

                      <TextView
                          android:id="@+id/tvExpandedExtra"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:textColor="#A8C7FA"
                          android:textSize="12sp"
                          android:text="02:45" />
                  </LinearLayout>

                  <!-- أزرار الإجراءات التفاعلية -->
                  <LinearLayout
                      android:id="@+id/layoutExpandedActions"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center"
                      android:layout_marginTop="12dp">

                      <Button
                          android:id="@+id/btnAction1"
                          android:layout_width="wrap_content"
                          android:layout_height="36dp"
                          android:text="⏮️ السابق"
                          android:textSize="11sp"
                          android:backgroundTint="#272A2F"
                          android:textColor="#FFFFFF"
                          android:layout_marginEnd="8dp" />

                      <Button
                          android:id="@+id/btnAction2"
                          android:layout_width="wrap_content"
                          android:layout_height="36dp"
                          android:text="⏸️ إيقاف"
                          android:textSize="11sp"
                          android:backgroundTint="#0842A0"
                          android:textColor="#D3E3FD"
                          android:layout_marginEnd="8dp" />

                      <Button
                          android:id="@+id/btnAction3"
                          android:layout_width="wrap_content"
                          android:layout_height="36dp"
                          android:text="⏭️ التالي"
                          android:textSize="11sp"
                          android:backgroundTint="#272A2F"
                          android:textColor="#FFFFFF" />
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          EOF

          # 9. واجهة تطبيق Google Pixel الرسمية الفاخرة (Material You 3 activity_main.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/m3_surface"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <!-- Header Pixel 8 Pro Style -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="24dp">

                      <FrameLayout
                          android:layout_width="54dp"
                          android:layout_height="54dp"
                          android:background="@drawable/bg_island_capsule"
                          android:padding="4dp">
                          <ImageView
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:src="@drawable/ic_launcher_foreground" />
                      </FrameLayout>

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:layout_marginStart="16dp"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Dynamic Island"
                              android:textColor="@color/m3_text_primary"
                              android:textSize="24sp"
                              android:fontFamily="sans-serif-medium"
                              android:textStyle="bold" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Google Pixel 8 Pro • Material You"
                              android:textColor="@color/m3_primary"
                              android:textSize="13sp" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- بطاقة حالة وتفعيل الصلاحيات بأسلوب Google Settings -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="إعدادات وصلاحيات النظام"
                      android:textColor="@color/m3_text_secondary"
                      android:textSize="13sp"
                      android:fontFamily="sans-serif-medium"
                      android:layout_marginStart="6dp"
                      android:layout_marginBottom="8dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="@drawable/bg_card_m3"
                      android:padding="16dp"
                      android:layout_marginBottom="20dp">

                      <!-- صلاحية 1: الظهور فوق التطبيقات -->
                      <LinearLayout
                          android:id="@+id/btnOverlayPermission"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:clickable="true"
                          android:focusable="true"
                          android:background="?attr/selectableItemBackground"
                          android:paddingTop="8dp"
                          android:paddingBottom="12dp">

                          <ImageView
                              android:id="@+id/ivStatusOverlay"
                              android:layout_width="26dp"
                              android:layout_height="26dp"
                              android:src="@drawable/ic_check_circle" />

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:layout_marginStart="14dp"
                              android:orientation="vertical">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="الظهور فوق التطبيقات"
                                  android:textColor="@color/m3_text_primary"
                                  android:textSize="15sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="مطلوب لرسم الجزيرة فوق الكاميرا"
                                  android:textColor="@color/m3_text_tertiary"
                                  android:textSize="12sp" />
                          </LinearLayout>

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="تفعيل ❯"
                              android:textColor="@color/m3_primary"
                              android:textSize="13sp"
                              android:fontFamily="sans-serif-medium" />
                      </LinearLayout>

                      <View
                          android:layout_width="match_parent"
                          android:layout_height="1dp"
                          android:background="@color/m3_outline_variant"
                          android:layout_marginTop="4dp"
                          android:layout_marginBottom="4dp" />

                      <!-- صلاحية 2: قراءة الإشعارات والموسيقى -->
                      <LinearLayout
                          android:id="@+id/btnNotificationPermission"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:clickable="true"
                          android:focusable="true"
                          android:background="?attr/selectableItemBackground"
                          android:paddingTop="12dp"
                          android:paddingBottom="8dp">

                          <ImageView
                              android:id="@+id/ivStatusNotif"
                              android:layout_width="26dp"
                              android:layout_height="26dp"
                              android:src="@drawable/ic_check_circle" />

                          <LinearLayout
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:layout_marginStart="14dp"
                              android:orientation="vertical">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="الوصول إلى الإشعارات والموسيقى"
                                  android:textColor="@color/m3_text_primary"
                                  android:textSize="15sp"
                                  android:textStyle="bold" />

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="لقراءة الرسائل وعرض مشغل الموسيقى"
                                  android:textColor="@color/m3_text_tertiary"
                                  android:textSize="12sp" />
                          </LinearLayout>

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="تفعيل ❯"
                              android:textColor="@color/m3_primary"
                              android:textSize="13sp"
                              android:fontFamily="sans-serif-medium" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- بطاقة المعايرة الهندسية لكاميرا Pixel 8 -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="معايرة ثقب الكاميرا (Precision Calibration)"
                      android:textColor="@color/m3_text_secondary"
                      android:textSize="13sp"
                      android:fontFamily="sans-serif-medium"
                      android:layout_marginStart="6dp"
                      android:layout_marginBottom="8dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="@drawable/bg_card_m3"
                      android:padding="18dp"
                      android:layout_marginBottom="20dp">

                      <!-- عرض الجزيرة -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:layout_marginBottom="6dp">
                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"

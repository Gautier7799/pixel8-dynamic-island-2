name: Build Dynamic Island MT Capsule Edition V3.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for Dynamic Island
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Dynamic Island Compose Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/dynamicisland/aipro app/src/main/res/mipmap-anydpi-v26

          cat << 'INNER_EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          INNER_EOF

          cat << 'INNER_EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DynamicIslandAIPro"
          include(":app")
          INNER_EOF

          cat << 'INNER_EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          INNER_EOF

          cat << 'INNER_EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.dynamicisland.aipro"
              compileSdk = 34
              defaultConfig { applicationId = "com.dynamicisland.aipro"; minSdk = 28; targetSdk = 34; versionCode = 18; versionName = "3.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-service:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MT Capsule Pro</string>
          </resources>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#A8E5BA"/></shape>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1B5E20" android:pathData="M24,44h60v20h-60zM44,44a10,10 0 0,1 20,0a10,10 0 0,1 -20,0z"/>
          </vector>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/IslandNotificationListener.kt
          package com.dynamicisland.aipro

          import android.app.Notification
          import android.content.Intent
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class IslandNotificationListener : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val extras = sbn.notification.extras
                  val title = extras.getString("android.title") ?: return
                  val text = extras.getCharSequence("android.text")?.toString() ?: return
                  val pkg = sbn.packageName
                  
                  if ((sbn.notification.flags and Notification.FLAG_GROUP_SUMMARY) != 0) return
                  val isMedia = extras.containsKey(Notification.EXTRA_MEDIA_SESSION) || extras.getString(Notification.EXTRA_TEMPLATE) == "android.app.Notification\$MediaStyle"
                  val intent = Intent("com.dynamicisland.aipro.NEW_EVENT")
                  
                  if (isMedia) {
                      intent.putExtra("type", "MUSIC")
                      intent.putExtra("title", title)
                      intent.putExtra("text", text)
                      intent.putExtra("icon", "🎵")
                      intent.putExtra("color", "#1DB954")
                  } else {
                      if (sbn.isOngoing) return
                      intent.putExtra("type", "MSG")
                      intent.putExtra("title", title)
                      intent.putExtra("text", text)
                      intent.putExtra("icon", "💬")
                      intent.putExtra("color", "#1B5E20")
                  }
                  sendBroadcast(intent)
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/DynamicIslandService.kt
          package com.dynamicisland.aipro

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.res.Configuration
          import android.graphics.PixelFormat
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.view.WindowManager
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.ComposeView
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.app.NotificationCompat
          import androidx.lifecycle.LifecycleService
          import androidx.lifecycle.ViewModelStore
          import androidx.lifecycle.ViewModelStoreOwner
          import androidx.lifecycle.setViewTreeLifecycleOwner
          import androidx.lifecycle.setViewTreeViewModelStoreOwner
          import androidx.savedstate.SavedStateRegistry
          import androidx.savedstate.SavedStateRegistryController
          import androidx.savedstate.SavedStateRegistryOwner
          import androidx.savedstate.setViewTreeSavedStateRegistryOwner
          import kotlin.math.abs

          enum class IslandMode { IDLE, EVENT_COMPACT, EVENT_EXPANDED }
          data class IslandEvent(val type: String = "MSG", val title: String = "", val text: String = "", val icon: String = "💬", val colorStr: String = "#FFFFFF") {
              val color: Color get() = try { Color(android.graphics.Color.parseColor(colorStr)) } catch(e:Exception){ Color.White }
          }

          class DynamicIslandService : LifecycleService(), ViewModelStoreOwner, SavedStateRegistryOwner {
              private lateinit var windowManager: WindowManager
              private lateinit var composeView: ComposeView
              private lateinit var params: WindowManager.LayoutParams
              private lateinit var prefs: SharedPreferences

              private val store = ViewModelStore()
              private val savedStateRegistryController = SavedStateRegistryController.create(this)
              override val viewModelStore: ViewModelStore get() = store
              override val savedStateRegistry: SavedStateRegistry get() = savedStateRegistryController.savedStateRegistry

              private val islandModeState = mutableStateOf(IslandMode.IDLE)
              private val currentEventState = mutableStateOf(IslandEvent())
              private val islandWidthState = mutableStateOf(77.dp)
              private val islandHeightState = mutableStateOf(28.dp)
              private val glowWidthState = mutableStateOf(0.dp)

              private val handler = Handler(Looper.getMainLooper())
              private val collapseRunnable = Runnable { if (islandModeState.value == IslandMode.EVENT_COMPACT) islandModeState.value = IslandMode.IDLE }

              private val eventReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == "com.dynamicisland.aipro.NEW_EVENT") {
                          val type = intent.getStringExtra("type") ?: "MSG"
                          val title = intent.getStringExtra("title") ?: ""
                          val text = intent.getStringExtra("text") ?: ""
                          val icon = intent.getStringExtra("icon") ?: "💬"
                          val color = intent.getStringExtra("color") ?: "#FFFFFF"
                          currentEventState.value = IslandEvent(type, title, text, icon, color)
                          islandModeState.value = IslandMode.EVENT_COMPACT 
                          handler.removeCallbacks(collapseRunnable)
                          handler.postDelayed(collapseRunnable, 4500L)
                      }
                  }
              }

              private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { sharedPreferences, key ->
                  when (key) {
                      "width" -> islandWidthState.value = sharedPreferences.getInt("width", 77).dp
                      "height" -> islandHeightState.value = sharedPreferences.getInt("height", 28).dp
                      "pos_x" -> { params.x = sharedPreferences.getInt("pos_x", 0); windowManager.updateViewLayout(composeView, params) }
                      "pos_y" -> { params.y = sharedPreferences.getInt("pos_y", 28); windowManager.updateViewLayout(composeView, params) }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  savedStateRegistryController.performRestore(null)
                  prefs = getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                  prefs.registerOnSharedPreferenceChangeListener(prefListener)
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel("island_service", "System", NotificationManager.IMPORTANCE_MIN)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                      val notification = NotificationCompat.Builder(this, "island_service").setSmallIcon(android.R.drawable.stat_sys_warning).build()
                      startForeground(1, notification)
                  }

                  islandWidthState.value = prefs.getInt("width", 77).dp
                  islandHeightState.value = prefs.getInt("height", 28).dp

                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  composeView = ComposeView(this).apply {
                      setViewTreeLifecycleOwner(this@DynamicIslandService)
                      setViewTreeViewModelStoreOwner(this@DynamicIslandService)
                      setViewTreeSavedStateRegistryOwner(this@DynamicIslandService)
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(eventReceiver, IntentFilter("com.dynamicisland.aipro.NEW_EVENT"), Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(eventReceiver, IntentFilter("com.dynamicisland.aipro.NEW_EVENT"))
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_INSET_DECOR,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      x = prefs.getInt("pos_x", 0)
                      y = prefs.getInt("pos_y", 28)
                  }

                  composeView.setContent {
                      DynamicIslandContent(
                          mode = islandModeState.value,
                          event = currentEventState.value,
                          baseWidth = islandWidthState.value,
                          baseHeight = islandHeightState.value,
                          glow = glowWidthState.value
                      )
                  }
                  windowManager.addView(composeView, params)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  unregisterReceiver(eventReceiver)
                  prefs.unregisterOnSharedPreferenceChangeListener(prefListener)
                  if (::composeView.isInitialized) windowManager.removeView(composeView)
              }
          }

          @Composable
          fun DynamicIslandContent(mode: IslandMode, event: IslandEvent, baseWidth: Dp, baseHeight: Dp, glow: Dp) {
              val targetWidth = when (mode) { IslandMode.IDLE -> baseWidth; IslandMode.EVENT_COMPACT -> 280.dp; IslandMode.EVENT_EXPANDED -> 330.dp }
              val targetHeight = when (mode) { IslandMode.IDLE -> baseHeight; IslandMode.EVENT_COMPACT -> baseHeight; IslandMode.EVENT_EXPANDED -> 125.dp }
              val animatedWidth by animateDpAsState(targetValue = targetWidth, animationSpec = spring(dampingRatio = 0.6f, stiffness = 400f), label = "")
              val animatedHeight by animateDpAsState(targetValue = targetHeight, animationSpec = spring(dampingRatio = 0.6f, stiffness = 400f), label = "")
              val cornerRadius by animateDpAsState(targetValue = if (mode == IslandMode.EVENT_EXPANDED) 28.dp else (baseHeight / 2f), label = "")

              Box(modifier = Modifier.width(animatedWidth).height(animatedHeight).background(Color.Black, RoundedCornerShape(cornerRadius))) {
                  androidx.compose.animation.AnimatedVisibility(visible = mode == IslandMode.EVENT_COMPACT, modifier = Modifier.align(Alignment.Center)) {
                      Row(modifier = Modifier.fillMaxSize().padding(horizontal = 14.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text(event.icon, fontSize = 12.sp)
                              Spacer(modifier = Modifier.width(8.dp))
                              Text(text = event.title, color = event.color, fontSize = 13.sp, fontWeight = FontWeight.Bold, maxLines = 1)
                          }
                          Text(text = event.text, color = Color.LightGray, fontSize = 12.sp, maxLines = 1)
                      }
                  }
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/MainActivity.kt
          package com.dynamicisland.aipro

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.app.ActivityCompat

          val MTCapsuleGreen = Color(0xFFE8F5E9)
          val MTCapsuleDarkGreen = Color(0xFF1B5E20)
          val MTCapsuleAccent = Color(0xFF4CAF50)
          val MTCapsuleCard = Color(0xFFFFFFFF)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("island_prefs", Context.MODE_PRIVATE)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }

                  setContent {
                      MaterialTheme {
                          MainScreen(prefs)
                      }
                  }
              }
          }

          @Composable
          fun MainScreen(prefs: SharedPreferences) {
              var selectedTab by remember { mutableStateOf(0) }
              val context = LocalContext.current

              Scaffold(
                  bottomBar = {
                      NavigationBar(containerColor = MTCapsuleGreen) {
                          NavigationBarItem(
                              selected = selectedTab == 0,
                              onClick = { selectedTab = 0 },
                              icon = { Text("📐", fontSize = 20.sp) },
                              label = { Text("Taille", color = MTCapsuleDarkGreen) },
                              colors = NavigationBarItemDefaults.colors(indicatorColor = MTCapsuleAccent.copy(alpha = 0.2f))
                          )
                          NavigationBarItem(
                              selected = selectedTab == 1,
                              onClick = { selectedTab = 1 },
                              icon = { Text("⚡", fontSize = 20.sp) },
                              label = { Text("Cartes", color = MTCapsuleDarkGreen) },
                              colors = NavigationBarItemDefaults.colors(indicatorColor = MTCapsuleAccent.copy(alpha = 0.2f))
                          )
                          NavigationBarItem(
                              selected = selectedTab == 2,
                              onClick = { selectedTab = 2 },
                              icon = { Text("⚙️", fontSize = 20.sp) },
                              label = { Text("Paramètres", color = MTCapsuleDarkGreen) },
                              colors = NavigationBarItemDefaults.colors(indicatorColor = MTCapsuleAccent.copy(alpha = 0.2f))
                          )
                      }
                  }
              ) { padding ->
                  Box(modifier = Modifier.padding(padding).fillMaxSize().background(MTCapsuleGreen)) {
                      when (selectedTab) {
                          0 -> TailleEtPositionScreen(prefs)
                          1 -> CartesScreen()
                          2 -> ParametresScreen()
                      }
                  }
              }
          }

          @Composable
          fun TailleEtPositionScreen(prefs: SharedPreferences) {
              var width by remember { mutableStateOf(prefs.getInt("width", 77).toFloat()) }
              var height by remember { mutableStateOf(prefs.getInt("height", 28).toFloat()) }
              var posX by remember { mutableStateOf(prefs.getInt("pos_x", 0).toFloat()) }
              var posY by remember { mutableStateOf(prefs.getInt("pos_y", 28).toFloat()) }
              val context = LocalContext.current

              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Text("Taille et position", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = MTCapsuleDarkGreen)
                  Spacer(modifier = Modifier.height(16.dp))

                  // Visualizer (Exemple) exactly like MT Capsule
                  Card(
                      modifier = Modifier.fillMaxWidth().height(180.dp),
                      colors = CardDefaults.cardColors(containerColor = MTCapsuleCard),
                      shape = RoundedCornerShape(24.dp)
                  ) {
                      Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.TopCenter) {
                          // Fake Phone Camera
                          Box(modifier = Modifier.padding(top = 16.dp).size(20.dp).background(Color.Black, CircleShape))
                          // Fake Island
                          Box(
                              modifier = Modifier
                                  .offset(x = posX.dp, y = posY.dp)
                                  .width(width.dp)
                                  .height(height.dp)
                                  .background(Color.Black.copy(alpha = 0.8f), RoundedCornerShape(height.dp / 2))
                          )
                          Text("Exemple", modifier = Modifier.align(Alignment.TopStart).padding(16.dp), color = MTCapsuleDarkGreen, fontWeight = FontWeight.Bold)
                      }
                  }

                  Spacer(modifier = Modifier.height(24.dp))

                  SliderControl("Position X", posX, -200f, 200f) { posX = it; prefs.edit().putInt("pos_x", it.toInt()).apply() }
                  SliderControl("Position Y", posY, 0f, 200f) { posY = it; prefs.edit().putInt("pos_y", it.toInt()).apply() }
                  SliderControl("Largeur", width, 30f, 300f) { width = it; prefs.edit().putInt("width", it.toInt()).apply() }
                  SliderControl("Hauteur", height, 10f, 100f) { height = it; prefs.edit().putInt("height", it.toInt()).apply() }

                  Spacer(modifier = Modifier.weight(1f))
                  
                  Button(
                      onClick = {
                          if (!Settings.canDrawOverlays(context)) {
                              context.startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:\${context.packageName}")))
                          } else {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  context.startForegroundService(Intent(context, DynamicIslandService::class.java))
                              } else {
                                  context.startService(Intent(context, DynamicIslandService::class.java))
                              }
                          }
                      },
                      modifier = Modifier.fillMaxWidth().height(56.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = MTCapsuleDarkGreen)
                  ) {
                      Text("Activer / Appliquer", fontSize = 16.sp, color = Color.White)
                  }
              }
          }

          @Composable
          fun SliderControl(label: String, value: Float, min: Float, max: Float, onValueChange: (Float) -> Unit) {
              Column(modifier = Modifier.padding(vertical = 8.dp)) {
                  Row(horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth()) {
                      Text(label, color = MTCapsuleDarkGreen, fontWeight = FontWeight.Bold)
                      Text(value.toInt().toString(), color = Color.Gray)
                  }
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Box(modifier = Modifier.size(36.dp).clip(CircleShape).background(Color.White).clickable { onValueChange((value - 1f).coerceAtLeast(min)) }, contentAlignment = Alignment.Center) { Text("-", fontSize = 20.sp, color = MTCapsuleDarkGreen) }
                      Slider(
                          value = value,
                          onValueChange = onValueChange,
                          valueRange = min..max,
                          modifier = Modifier.weight(1f).padding(horizontal = 8.dp),
                          colors = SliderDefaults.colors(thumbColor = MTCapsuleDarkGreen, activeTrackColor = MTCapsuleDarkGreen, inactiveTrackColor = MTCapsuleAccent.copy(alpha = 0.3f))
                      )
                      Box(modifier = Modifier.size(36.dp).clip(CircleShape).background(Color.White).clickable { onValueChange((value + 1f).coerceAtMost(max)) }, contentAlignment = Alignment.Center) { Text("+", fontSize = 20.sp, color = MTCapsuleDarkGreen) }
                  }
              }
          }

          @Composable
          fun CartesScreen() {
              val context = LocalContext.current
              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Text("Material Capsule", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = MTCapsuleDarkGreen)
                  Spacer(modifier = Modifier.height(16.dp))
                  Text("Événements de la mini-capsule", color = MTCapsuleDarkGreen, fontWeight = FontWeight.Bold, modifier = Modifier.padding(bottom = 8.dp))
                  
                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = MTCapsuleCard), shape = RoundedCornerShape(24.dp)) {
                      Row(modifier = Modifier.padding(20.dp).fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                          Box(modifier = Modifier.size(48.dp).background(MTCapsuleAccent.copy(alpha = 0.2f), CircleShape), contentAlignment = Alignment.Center) { Text("⚡") }
                          Box(modifier = Modifier.size(48.dp).background(MTCapsuleAccent.copy(alpha = 0.2f), CircleShape), contentAlignment = Alignment.Center) { Text("🎵") }
                          Box(modifier = Modifier.size(48.dp).background(MTCapsuleAccent.copy(alpha = 0.2f), CircleShape), contentAlignment = Alignment.Center) { Text("💬") }
                      }
                  }
                  
                  Spacer(modifier = Modifier.height(24.dp))
                  
                  Button(
                      onClick = {
                          val i = Intent("com.dynamicisland.aipro.NEW_EVENT")
                          i.putExtra("type", "MSG"); i.putExtra("title", "Test Capsule"); i.putExtra("text", "Ceci est un test MT"); i.putExtra("icon", "🚀"); i.putExtra("color", "#1B5E20")
                          context.sendBroadcast(i)
                      },
                      modifier = Modifier.fillMaxWidth().height(56.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = MTCapsuleDarkGreen)
                  ) {
                      Text("Tester Animation", fontSize = 16.sp, color = Color.White)
                  }
              }
          }

          @Composable
          fun ParametresScreen() {
              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Text("Paramètres", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = MTCapsuleDarkGreen)
                  Spacer(modifier = Modifier.height(16.dp))
                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = MTCapsuleCard), shape = RoundedCornerShape(24.dp)) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          SettingItem(icon = "🎨", title = "Thème de l'application", subtitle = "Suivre le système")
                          Divider(color = MTCapsuleGreen)
                          SettingItem(icon = "🌐", title = "Langue de l'application", subtitle = "Par défaut du système")
                      }
                  }
              }
          }
          
          @Composable
          fun SettingItem(icon: String, title: String, subtitle: String) {
              Row(modifier = Modifier.fillMaxWidth().padding(vertical = 12.dp), verticalAlignment = Alignment.CenterVertically) {
                  Text(icon, fontSize = 24.sp)
                  Spacer(modifier = Modifier.width(16.dp))
                  Column {
                      Text(title, fontWeight = FontWeight.Bold, color = MTCapsuleDarkGreen)
                      Text(subtitle, fontSize = 12.sp, color = Color.Gray)
                  }
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".DynamicIslandService" android:exported="false" android:foregroundServiceType="specialUse" />
                  
                  <service android:name=".IslandNotificationListener" android:label="Dynamic Island Notifications" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          INNER_EOF
          
          gradle wrapper --gradle-version 8.4 --no-daemon

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Project Cache
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/MTCapsule-Pro.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MTCapsule-Pro
          path: release-output/MTCapsule-Pro.apk
          retention-days: 5

              }
          }

          @Composable
          fun SystemScreen() {
              val context = LocalContext.current
              Column(modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp)) {
                  Text("Système", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = NovaText)
                  Spacer(modifier = Modifier.height(24.dp))
                  
                  Text("Gestion", color = NovaAccent, fontWeight = FontWeight.Bold, modifier = Modifier.padding(bottom = 8.dp))
                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = NovaCard), shape = RoundedCornerShape(24.dp)) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          SettingItem(icon = Icons.Rounded.AccessibilityNew, title = "Droits d'accessibilité", subtitle = "Gérer les permissions système", onClick = { context.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) })
                          HorizontalDivider(color = NovaBg)
                          SettingItem(icon = Icons.Rounded.NotificationsActive, title = "Droits de notification", subtitle = "Permettre la lecture des messages", onClick = { context.startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)) })
                          HorizontalDivider(color = NovaBg)
                          SettingItem(icon = Icons.Rounded.BatteryAlert, title = "Économiseur de batterie", subtitle = "Ignorer pour empêcher l'arrêt", onClick = { context.startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)) })
                      }
                  }
              }
          }

          @Composable
          fun SettingItem(icon: ImageVector, title: String, subtitle: String, onClick: () -> Unit = {}) {
              Row(modifier = Modifier.fillMaxWidth().clickable { onClick() }.padding(vertical = 14.dp), verticalAlignment = Alignment.CenterVertically) {
                  Box(modifier = Modifier.size(40.dp).background(NovaBg, CircleShape), contentAlignment = Alignment.Center) {
                      Icon(icon, contentDescription = null, tint = NovaAccent, modifier = Modifier.size(24.dp))
                  }
                  Spacer(modifier = Modifier.width(16.dp))
                  Column(modifier = Modifier.weight(1f)) {
                      Text(title, fontWeight = FontWeight.Bold, color = NovaText, fontSize = 15.sp)
                      Text(subtitle, fontSize = 13.sp, color = NovaText.copy(alpha = 0.6f), lineHeight = 16.sp)
                  }
                  Icon(Icons.Rounded.ChevronRight, contentDescription = null, tint = NovaText.copy(alpha = 0.3f))
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".NovaIslandService" android:exported="true" android:label="NOVA ISLAND Pro" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>
                  
                  <service android:name=".NovaNotificationListener" android:label="Nova Island Notifications" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          INNER_EOF
          
          gradle wrapper --gradle-version 8.4 --no-daemon

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Project Cache
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/NovaIsland-Pro.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaIsland-Pro
          path: release-output/NovaIsland-Pro.apk
          retention-days: 5

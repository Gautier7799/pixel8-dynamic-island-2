name: Build Dynamic Island Pixel 8 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # تهيئة البنية الكاملة للمشروع وضمان عدم نقص أي ملف في أندرويد
      - name: Prepare Android Project Structure
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java/com/dynamicisland/pixel8/services

          # 1. إنشاء ملف strings.xml إذا لم يكن موجوداً
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Pixel 8 Dynamic Island</string>
          </resources>
          EOF

          # 2. إنشاء ملف colors.xml
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF

          # 3. إنشاء ملف local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 4. توليد Gradle Wrapper
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      # تنفيذ البناء مع تخطي الفحوصات غير الضرورية
      - name: Compile APK
        run: |
          ./gradlew assembleDebug -x lint -x test --stacktrace

      # رفع ملف الـ APK الناتج فوراً للتنزيل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-Pixel8-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

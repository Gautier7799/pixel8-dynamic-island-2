                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = NovaCard), shape = RoundedCornerShape(24.dp)) {
                      Row(modifier = Modifier.padding(20.dp).fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                          Box(modifier = Modifier.size(56.dp).background(NovaBg, CircleShape).clickable {

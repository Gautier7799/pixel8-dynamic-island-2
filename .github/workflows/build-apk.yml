name: Build NOVA ISLAND Pro V1.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for NOVA ISLAND Pro
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate NOVA ISLAND Pro Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/novaisland/pro app/src/main/res/mipmap-anydpi-v26

          cat << 'INNER_EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          INNER_EOF

          cat << 'INNER_EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "NovaIslandPro"
          include(":app")
          INNER_EOF

          cat << 'INNER_EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          INNER_EOF

          cat << 'INNER_EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.novaisland.pro"
              compileSdk = 34
              defaultConfig { applicationId = "com.novaisland.pro"; minSdk = 28; targetSdk = 34; versionCode = 1; versionName = "1.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">NOVA ISLAND Pro</string>
              <string name="accessibility_desc">NOVA ISLAND Pro nécessite le service d\'accessibilité pour fonctionner de manière fluide, afficher l\'île dynamique par-dessus l\'écran, et offrir la meilleure expérience sans être arrêté par le système.</string>
          </resources>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_desc"
              android:isAccessibilityTool="true" />
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#0F172A"/></shape>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#38BDF8" android:pathData="M34,44h40v20h-40zM44,44a10,10 0 0,1 20,0a10,10 0 0,1 -20,0z"/>
          </vector>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/novaisland/pro/NovaNotificationListener.kt
          package com.novaisland.pro
          import android.app.Notification
          import android.content.Intent
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          class NovaNotificationListener : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val extras = sbn.notification.extras
                  val title = extras.getString("android.title") ?: return
                  val text = extras.getCharSequence("android.text")?.toString() ?: return
                  val intent = Intent("com.novaisland.pro.EVENT")
                  
                  val isMedia = extras.containsKey(Notification.EXTRA_MEDIA_SESSION) || extras.getString(Notification.EXTRA_TEMPLATE) == "android.app.Notification\$MediaStyle"
                  if (isMedia) {
                      intent.putExtra("type", "MUSIC"); intent.putExtra("title", title); intent.putExtra("text", text); intent.putExtra("icon", "🎵"); intent.putExtra("color", "#38BDF8")
                  } else {
                      if ((sbn.notification.flags and Notification.FLAG_GROUP_SUMMARY) != 0 || sbn.isOngoing) return
                      intent.putExtra("type", "MSG"); intent.putExtra("title", title); intent.putExtra("text", text); intent.putExtra("icon", "💬"); intent.putExtra("color", "#FFFFFF")
                  }
                  sendBroadcast(intent)
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/novaisland/pro/NovaIslandService.kt
          package com.novaisland.pro
          import android.accessibilityservice.AccessibilityService
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.ComposeView
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleOwner
          import androidx.lifecycle.LifecycleRegistry
          import androidx.lifecycle.ViewModelStore
          import androidx.lifecycle.ViewModelStoreOwner
          import androidx.savedstate.SavedStateRegistry
          import androidx.savedstate.SavedStateRegistryController
          import androidx.savedstate.SavedStateRegistryOwner

          class MyLifecycleOwner : LifecycleOwner, ViewModelStoreOwner, SavedStateRegistryOwner {
              private val lifecycleRegistry = LifecycleRegistry(this)
              private val savedStateRegistryController = SavedStateRegistryController.create(this)
              private val store = ViewModelStore()
              override val lifecycle: Lifecycle get() = lifecycleRegistry
              override val savedStateRegistry: SavedStateRegistry get() = savedStateRegistryController.savedStateRegistry
              override val viewModelStore: ViewModelStore get() = store
              fun onCreate() { savedStateRegistryController.performRestore(null); lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_CREATE) }
              fun onStart() { lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START) }
              fun onResume() { lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_RESUME) }
              fun onDestroy() { lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_DESTROY) }
          }

          enum class IslandMode { IDLE, EVENT_COMPACT, EVENT_EXPANDED }
          data class IslandEvent(val type: String = "MSG", val title: String = "", val text: String = "", val icon: String = "💬", val colorStr: String = "#FFFFFF") {
              val color: Color get() = try { Color(android.graphics.Color.parseColor(colorStr)) } catch(e:Exception){ Color.White }
          }
          
          @Composable
          fun AudioVisualizer(color: Color) {
              val transition = rememberInfiniteTransition(label = "audio")
              val anim1 by transition.animateFloat(initialValue = 0.3f, targetValue = 1f, animationSpec = infiniteRepeatable(animation = tween(300, easing = LinearEasing), repeatMode = RepeatMode.Reverse), label = "a1")
              val anim2 by transition.animateFloat(initialValue = 0.9f, targetValue = 0.2f, animationSpec = infiniteRepeatable(animation = tween(250, easing = LinearEasing), repeatMode = RepeatMode.Reverse), label = "a2")
              val anim3 by transition.animateFloat(initialValue = 0.4f, targetValue = 0.9f, animationSpec = infiniteRepeatable(animation = tween(400, easing = LinearEasing), repeatMode = RepeatMode.Reverse), label = "a3")

              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(2.dp), modifier = Modifier.height(14.dp)) {
                  Box(modifier = Modifier.width(3.dp).fillMaxHeight(anim1).background(color, CircleShape))
                  Box(modifier = Modifier.width(3.dp).fillMaxHeight(anim2).background(color, CircleShape))
                  Box(modifier = Modifier.width(3.dp).fillMaxHeight(anim3).background(color, CircleShape))
              }
          }

          class NovaIslandService : AccessibilityService() {
              private lateinit var windowManager: WindowManager
              private lateinit var composeView: ComposeView
              private lateinit var params: WindowManager.LayoutParams
              private lateinit var prefs: SharedPreferences
              private val lifecycleOwner = MyLifecycleOwner()

              private val islandModeState = mutableStateOf(IslandMode.IDLE)
              private val currentEventState = mutableStateOf(IslandEvent())
              private val islandWidthState = mutableStateOf(77.dp)
              private val islandHeightState = mutableStateOf(28.dp)

              private val handler = Handler(Looper.getMainLooper())
              private val collapseRunnable = Runnable { if (islandModeState.value == IslandMode.EVENT_COMPACT) islandModeState.value = IslandMode.IDLE }

              private val eventReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == "com.novaisland.pro.EVENT") {
                          val type = intent.getStringExtra("type") ?: "MSG"
                          val title = intent.getStringExtra("title") ?: ""
                          val text = intent.getStringExtra("text") ?: ""
                          val icon = intent.getStringExtra("icon") ?: "💬"
                          val color = intent.getStringExtra("color") ?: "#FFFFFF"
                          currentEventState.value = IslandEvent(type, title, text, icon, color)
                          islandModeState.value = IslandMode.EVENT_COMPACT 
                          handler.removeCallbacks(collapseRunnable)
                          handler.postDelayed(collapseRunnable, 4500L)
                      }
                  }
              }

              private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { sharedPreferences, key ->
                  when (key) {
                      "width" -> islandWidthState.value = sharedPreferences.getInt("width", 77).dp
                      "height" -> islandHeightState.value = sharedPreferences.getInt("height", 28).dp
                      "pos_x" -> { params.x = sharedPreferences.getInt("pos_x", 0); windowManager.updateViewLayout(composeView, params) }
                      "pos_y" -> { params.y = sharedPreferences.getInt("pos_y", 28); windowManager.updateViewLayout(composeView, params) }
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  prefs = getSharedPreferences("nova_prefs", Context.MODE_PRIVATE)
                  prefs.registerOnSharedPreferenceChangeListener(prefListener)
                  
                  lifecycleOwner.onCreate()
                  lifecycleOwner.onStart()
                  lifecycleOwner.onResume()

                  islandWidthState.value = prefs.getInt("width", 77).dp
                  islandHeightState.value = prefs.getInt("height", 28).dp

                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  composeView = ComposeView(this).apply {
                      setViewTreeLifecycleOwner(lifecycleOwner)
                      setViewTreeViewModelStoreOwner(lifecycleOwner)
                      setViewTreeSavedStateRegistryOwner(lifecycleOwner)
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(eventReceiver, IntentFilter("com.novaisland.pro.EVENT"), Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(eventReceiver, IntentFilter("com.novaisland.pro.EVENT"))
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_INSET_DECOR,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      x = prefs.getInt("pos_x", 0)
                      y = prefs.getInt("pos_y", 28)
                  }

                  composeView.setContent {
                      NovaIslandContent(mode = islandModeState.value, event = currentEventState.value, baseWidth = islandWidthState.value, baseHeight = islandHeightState.value)
                  }
                  windowManager.addView(composeView, params)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  unregisterReceiver(eventReceiver)
                  prefs.unregisterOnSharedPreferenceChangeListener(prefListener)
                  lifecycleOwner.onDestroy()
                  if (::composeView.isInitialized) windowManager.removeView(composeView)
              }
          }

          @Composable
          fun NovaIslandContent(mode: IslandMode, event: IslandEvent, baseWidth: Dp, baseHeight: Dp) {
              val targetWidth = when (mode) { IslandMode.IDLE -> baseWidth; IslandMode.EVENT_COMPACT -> 280.dp; IslandMode.EVENT_EXPANDED -> 330.dp }
              val targetHeight = when (mode) { IslandMode.IDLE -> baseHeight; IslandMode.EVENT_COMPACT -> baseHeight; IslandMode.EVENT_EXPANDED -> 125.dp }
              
              // Physics Animation for that Apple-like smooth bounce
              val animatedWidth by animateDpAsState(targetValue = targetWidth, animationSpec = spring(dampingRatio = 0.65f, stiffness = 500f), label = "")
              val animatedHeight by animateDpAsState(targetValue = targetHeight, animationSpec = spring(dampingRatio = 0.65f, stiffness = 500f), label = "")
              val cornerRadius by animateDpAsState(targetValue = if (mode == IslandMode.EVENT_EXPANDED) 28.dp else (baseHeight / 2f), label = "")

              Box(modifier = Modifier.width(animatedWidth).height(animatedHeight).background(Color.Black, RoundedCornerShape(cornerRadius))) {
                  androidx.compose.animation.AnimatedVisibility(
                      visible = mode == IslandMode.EVENT_COMPACT, 
                      modifier = Modifier.align(Alignment.Center),
                      enter = fadeIn(tween(200)), exit = fadeOut(tween(200))
                  ) {
                      Row(modifier = Modifier.fillMaxSize().padding(horizontal = 14.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                          Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.weight(1f)) {
                              Text(event.icon, fontSize = 14.sp)
                              Spacer(modifier = Modifier.width(8.dp))
                              Text(text = event.title, color = event.color, fontSize = 13.sp, fontWeight = FontWeight.Bold, maxLines = 1)
                          }
                          if(event.type == "MUSIC") {
                              AudioVisualizer(color = event.color)
                          } else {
                              Text(text = event.text, color = Color.LightGray, fontSize = 12.sp, maxLines = 1, modifier = Modifier.padding(start = 8.dp))
                          }
                      }
                  }
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/novaisland/pro/MainActivity.kt
          package com.novaisland.pro

          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.os.Bundle
          import android.provider.Settings
          import android.text.TextUtils
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.rounded.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          // NOVA Theme Palette
          val NovaBg = Color(0xFF0F172A)         // Dark Slate
          val NovaCard = Color(0xFF1E293B)       // Lighter Slate
          val NovaAccent = Color(0xFF38BDF8)     // Electric Blue
          val NovaText = Color(0xFFF8FAFC)       // White/Gray

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("nova_prefs", Context.MODE_PRIVATE)
                  setContent { MaterialTheme { MainScreen(prefs) } }
              }
          }

          fun isAccessibilityServiceEnabled(context: Context, service: Class<*>): Boolean {
              val enabledServices = Settings.Secure.getString(context.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
              val colonSplitter = TextUtils.SimpleStringSplitter(':')
              colonSplitter.setString(enabledServices)
              while (colonSplitter.hasNext()) {
                  val componentName = colonSplitter.next()
                  if (componentName.equals(ComponentName(context, service).flattenToString(), ignoreCase = true)) return true
              }
              return false
          }

          @Composable
          fun MainScreen(prefs: SharedPreferences) {
              var selectedTab by remember { mutableStateOf(0) }
              val context = LocalContext.current
              val isEnabled = remember { mutableStateOf(isAccessibilityServiceEnabled(context, NovaIslandService::class.java)) }

              LaunchedEffect(Unit) { isEnabled.value = isAccessibilityServiceEnabled(context, NovaIslandService::class.java) }

              Scaffold(
                  bottomBar = {
                      NavigationBar(containerColor = NovaBg) {
                          NavigationBarItem(
                              selected = selectedTab == 0,
                              onClick = { selectedTab = 0 },
                              icon = { Icon(Icons.Rounded.SquareFoot, contentDescription = null) },
                              label = { Text("Apparence") },
                              colors = NavigationBarItemDefaults.colors(selectedIconColor = NovaBg, unselectedIconColor = NovaText.copy(alpha = 0.5f), selectedTextColor = NovaAccent, unselectedTextColor = NovaText.copy(alpha = 0.5f), indicatorColor = NovaAccent)
                          )
                          NavigationBarItem(
                              selected = selectedTab == 1,
                              onClick = { selectedTab = 1 },
                              icon = { Icon(Icons.Rounded.NotificationsActive, contentDescription = null) },
                              label = { Text("Événements") },
                              colors = NavigationBarItemDefaults.colors(selectedIconColor = NovaBg, unselectedIconColor = NovaText.copy(alpha = 0.5f), selectedTextColor = NovaAccent, unselectedTextColor = NovaText.copy(alpha = 0.5f), indicatorColor = NovaAccent)
                          )
                          NavigationBarItem(
                              selected = selectedTab == 2,
                              onClick = { selectedTab = 2 },
                              icon = { Icon(Icons.Rounded.Settings, contentDescription = null) },
                              label = { Text("Système") },
                              colors = NavigationBarItemDefaults.colors(selectedIconColor = NovaBg, unselectedIconColor = NovaText.copy(alpha = 0.5f), selectedTextColor = NovaAccent, unselectedTextColor = NovaText.copy(alpha = 0.5f), indicatorColor = NovaAccent)
                          )
                      }
                  }
              ) { padding ->
                  Box(modifier = Modifier.padding(padding).fillMaxSize().background(NovaBg)) {
                      when (selectedTab) {
                          0 -> AppearanceScreen(prefs, isEnabled.value)
                          1 -> EventsScreen()
                          2 -> SystemScreen()
                      }
                  }
              }
          }

          @Composable
          fun AppearanceScreen(prefs: SharedPreferences, isEnabled: Boolean) {
              var width by remember { mutableStateOf(prefs.getInt("width", 77).toFloat()) }
              var height by remember { mutableStateOf(prefs.getInt("height", 28).toFloat()) }
              var posX by remember { mutableStateOf(prefs.getInt("pos_x", 0).toFloat()) }
              var posY by remember { mutableStateOf(prefs.getInt("pos_y", 28).toFloat()) }
              val context = LocalContext.current

              Column(modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp)) {
                  Text("NOVA ISLAND", fontSize = 28.sp, fontWeight = FontWeight.ExtraBold, color = NovaAccent)
                  Text("Édition Pro V1.0", fontSize = 14.sp, color = NovaText.copy(alpha = 0.7f))
                  Spacer(modifier = Modifier.height(24.dp))

                  Card(modifier = Modifier.fillMaxWidth().height(180.dp), colors = CardDefaults.cardColors(containerColor = NovaCard), shape = RoundedCornerShape(24.dp)) {
                      Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.TopCenter) {
                          Box(modifier = Modifier.padding(top = 16.dp).size(20.dp).background(Color.Black, CircleShape))
                          Box(modifier = Modifier.offset(x = posX.dp, y = posY.dp).width(width.dp).height(height.dp).background(Color.Black.copy(alpha = 0.95f), RoundedCornerShape(height.dp / 2)))
                          Text("Laboratoire de taille", modifier = Modifier.align(Alignment.TopStart).padding(16.dp), color = NovaText, fontWeight = FontWeight.Bold)
                      }
                  }

                  Spacer(modifier = Modifier.height(24.dp))
                  SliderControl("Position X (Gauche / Droite)", posX, -200f, 200f) { posX = it; prefs.edit().putInt("pos_x", it.toInt()).apply() }
                  SliderControl("Position Y (Haut / Bas)", posY, 0f, 200f) { posY = it; prefs.edit().putInt("pos_y", it.toInt()).apply() }
                  SliderControl("Largeur de l'île", width, 30f, 300f) { width = it; prefs.edit().putInt("width", it.toInt()).apply() }
                  SliderControl("Hauteur de l'île", height, 10f, 100f) { height = it; prefs.edit().putInt("height", it.toInt()).apply() }
                  Spacer(modifier = Modifier.height(24.dp))
                  
                  if (!isEnabled) {
                      Button(
                          onClick = { context.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) },
                          modifier = Modifier.fillMaxWidth().height(56.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFEF4444)),
                          shape = RoundedCornerShape(16.dp)
                      ) {
                          Icon(Icons.Rounded.Warning, contentDescription = null, tint = Color.White)
                          Spacer(modifier = Modifier.width(8.dp))
                          Text("Activer le moteur NOVA (Requis)", fontSize = 16.sp, color = Color.White, fontWeight = FontWeight.Bold)
                      }
                  } else {
                      Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = NovaAccent.copy(alpha = 0.1f)), shape = RoundedCornerShape(16.dp)) {
                          Row(modifier = Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Rounded.CheckCircle, contentDescription = null, tint = NovaAccent)
                              Spacer(modifier = Modifier.width(8.dp))
                              Text("Moteur NOVA Actif et Stable", color = NovaAccent, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }
          }

          @Composable
          fun SliderControl(label: String, value: Float, min: Float, max: Float, onValueChange: (Float) -> Unit) {
              Column(modifier = Modifier.padding(vertical = 6.dp)) {
                  Row(horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth().padding(horizontal = 4.dp)) {
                      Text(label, color = NovaText, fontWeight = FontWeight.Medium, fontSize = 14.sp)
                      Text(value.toInt().toString(), color = NovaAccent, fontWeight = FontWeight.Bold)
                  }
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = { onValueChange((value - 1f).coerceAtLeast(min)) }, modifier = Modifier.size(36.dp).clip(CircleShape).background(NovaCard)) { Icon(Icons.Rounded.Remove, contentDescription = "-", tint = NovaText) }
                      Slider(value = value, onValueChange = onValueChange, valueRange = min..max, modifier = Modifier.weight(1f).padding(horizontal = 8.dp), colors = SliderDefaults.colors(thumbColor = NovaAccent, activeTrackColor = NovaAccent, inactiveTrackColor = NovaCard))
                      IconButton(onClick = { onValueChange((value + 1f).coerceAtMost(max)) }, modifier = Modifier.size(36.dp).clip(CircleShape).background(NovaCard)) { Icon(Icons.Rounded.Add, contentDescription = "+", tint = NovaText) }
                  }
              }
          }


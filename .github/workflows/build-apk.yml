          # ---- Dynamic Island Service (الجزيرة التفاعلية) ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/DynamicIslandService.kt
          package com.aikeyboard.pro

          import android.animation.ValueAnimator
          import android.app.Service
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.IBinder
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.animation.OvershootInterpolator
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.Typeface

          class DynamicIslandService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var islandView: FrameLayout
              private var isExpanded = false
              private var params: WindowManager.LayoutParams? = null
              private var density: Float = 1f

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  density = resources.displayMetrics.density

                  islandView = FrameLayout(this).apply {
                      setBackgroundResource(R.drawable.bg_dynamic_island)
                  }

                  // المحتوى الداخلي للجزيرة
                  val contentLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      layoutParams = FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                  }

                  val aiSparkle = TextView(this).apply {
                      text = "✨"
                      textSize = 16f
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      setPadding((8*density).toInt(), 0, (8*density).toInt(), 0)
                  }
                  
                  val titleText = TextView(this).apply {
                      text = "Dynamic Island Pro"
                      textSize = 14f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      visibility = View.GONE // مخفي في الحالة المصغرة
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  }

                  contentLayout.addView(aiSparkle)
                  contentLayout.addView(titleText)
                  islandView.addView(contentLayout)

                  params = WindowManager.LayoutParams(
                      (120 * density).toInt(), // عرض الجزيرة المصغر
                      (35 * density).toInt(),  // ارتفاع الجزيرة المصغر
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = (10 * density).toInt() // المسافة من الأعلى
                  }

                  islandView.setOnClickListener {
                      toggleIsland(titleText)
                  }

                  try {
                      windowManager.addView(islandView, params)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun toggleIsland(titleView: View) {
                  val startWidth = if (isExpanded) 320 * density else 120 * density
                  val endWidth = if (isExpanded) 120 * density else 320 * density
                  val startHeight = if (isExpanded) 120 * density else 35 * density
                  val endHeight = if (isExpanded) 35 * density else 120 * density

                  val anim = ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 400
                      interpolator = OvershootInterpolator(1.2f)
                      addUpdateListener { animator ->
                          val fraction = animator.animatedFraction
                          params?.width = (startWidth + (endWidth - startWidth) * fraction).toInt()
                          params?.height = (startHeight + (endHeight - startHeight) * fraction).toInt()
                          windowManager.updateViewLayout(islandView, params)
                      }
                  }
                  
                  if (!isExpanded) {
                      titleView.visibility = View.VISIBLE
                  } else {
                      titleView.visibility = View.GONE
                  }

                  anim.start()
                  isExpanded = !isExpanded
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::islandView.isInitialized) windowManager.removeView(islandView)
              }
          }
          EOF

          # ---- MainActivity ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/MainActivity.kt
          package com.aikeyboard.pro

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.SeekBar
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)

                  // زر تفعيل الجزيرة
                  findViewById<Button>(R.id.btn_island).setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                          startActivity(intent)
                          Toast.makeText(this, "يرجى منح صلاحية 'الظهور فوق التطبيقات' لتفعيل الجزيرة", Toast.LENGTH_LONG).show()
                      } else {
                          val intent = Intent(this, DynamicIslandService::class.java)
                          startService(intent)
                          Toast.makeText(this, "تم تفعيل الجزيرة التفاعلية ✨", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.btn_enable).setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  findViewById<Button>(R.id.btn_select).setOnClickListener { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker() }
                  
                  val seekBar = findViewById<SeekBar>(R.id.seek_height)
                  seekBar.progress = prefs.getInt("kb_height_prog", 10)

                  val inputApiKey = findViewById<EditText>(R.id.input_api_key)
                  inputApiKey.setText(prefs.getString("api_key", ""))

                  findViewById<Button>(R.id.btn_save_api).setOnClickListener {
                      prefs.edit().putString("api_key", inputApiKey.text.toString().trim()).putInt("kb_height_prog", seekBar.progress).apply()
                      Toast.makeText(this, "تم الحفظ!", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

          # ---- كيبورد الكود السابق (لم يتغير) ----
          cat << 'EOF' > app/src/main/java/com/aikeyboard/pro/KeyboardService.kt
          package com.aikeyboard.pro
          
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.inputmethodservice.InputMethodService
          import android.view.inputmethod.InputMethodManager
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.HorizontalScrollView
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.widget.ImageView
          import android.widget.PopupWindow
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.KeyEvent
          import android.widget.Toast
          import android.os.Handler
          import android.os.Looper
          import android.speech.RecognizerIntent
          import android.view.HapticFeedbackConstants
          import android.text.TextUtils
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.lang.StringBuilder
          import java.io.OutputStreamWriter

          class KeyboardService : InputMethodService() {
              private var isCaps = false
              private var isSymbols = false
              private var currentLang = "AR" 
              private lateinit var rootFrame: FrameLayout
              private lateinit var mainLayout: LinearLayout
              private lateinit var keysContainer: LinearLayout
              private lateinit var bottomSafeArea: FrameLayout
              private lateinit var keyPreviewBubble: TextView
              private lateinit var sug1: TextView
              private lateinit var sug2: TextView
              private lateinit var sug3: TextView
              private lateinit var prefs: SharedPreferences
              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private var density: Float = 1f
              private var heightProg: Int = 20
              private val currentTypedWord = StringBuilder()
              private val arDict = "السلام,عليكم,مرحبا,كيف,حالك,شكرا,صباح,الخير,مساء,اليوم,غدا,الآن,مشروع,تطبيق,جميل,جدا,ممتاز,نعم,لا,ماذا,هذا,أنا,أنت,نحن,الله,في,من,على,إلى,عن,مع,كل,هل,أو".split(",")
              private val frDict = "bonjour,comment,merci,oui,non,salut,bien,avec,pour,projet,application,dynamic,island,keyboard,clavier,très,beau,bon,jour,nuit,demain".split(",")
              private val altChars = mapOf("ا" to listOf("أ", "إ", "آ", "ء"), "ي" to listOf("ئ", "ى"), "ى" to listOf("ي", "ئ"), "و" to listOf("ؤ"), "ه" to listOf("ة"), "ة" to listOf("ه"), "ل" to listOf("لا", "لأ", "لإ", "لآ"))
              data class KeyDef(val label: String, val weight: Float)

              override fun onCreateInputView(): View {
                  prefs = getSharedPreferences("ai_kb_prefs", Context.MODE_PRIVATE)
                  density = resources.displayMetrics.density
                  heightProg = prefs.getInt("kb_height_prog", 10)
                  val bgColor = ContextCompat.getColor(this, R.color.IosDarkCanvas)
                  val textColorInt = ContextCompat.getColor(this, R.color.IosTextColor)
                  val iconColorInt = ContextCompat.getColor(this, R.color.IosTextColor)
                  window?.window?.navigationBarColor = bgColor
                  rootFrame = FrameLayout(this).apply { layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT); setBackgroundColor(bgColor) }
                  mainLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundResource(R.drawable.bg_keyboard_root); layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT) }
                  val toolbarContainer = FrameLayout(this).apply { layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (50 * density).toInt()); setPadding((16*density).toInt(), (8*density).toInt(), (16*density).toInt(), (4*density).toInt()) }
                  val pillToolbar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT); setBackgroundResource(R.drawable.bg_toolbar_pill); setPadding((12*density).toInt(), 0, (12*density).toInt(), 0) }
                  val aiSparkleBtn = TextView(this).apply { text = "✨"; textSize = 16f; background = ContextCompat.getDrawable(this@KeyboardService, R.drawable.bg_key_special); layoutParams = LinearLayout.LayoutParams((32*density).toInt(), (26*density).toInt()).apply { setMargins(0,0,(16*density).toInt(),0) }; gravity = Gravity.CENTER; setOnClickListener { performAiAction("FIX") } }
                  val settingsBtn = ImageView(this).apply { setImageResource(android.R.drawable.ic_menu_preferences); setColorFilter(iconColorInt); layoutParams = LinearLayout.LayoutParams(0, (24*density).toInt(), 1f); setOnClickListener { startActivity(Intent(this@KeyboardService, MainActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } }
                  val fontBtn = ImageView(this).apply { setImageResource(R.drawable.ic_text_aa); setColorFilter(iconColorInt); layoutParams = LinearLayout.LayoutParams(0, (24*density).toInt(), 1f) }
                  val transBtn = TextView(this).apply { text = "🌍"; textSize = 18f; gravity = Gravity.CENTER; layoutParams = LinearLayout.LayoutParams(0, (24*density).toInt(), 1f); setOnClickListener { performAiAction("TRANSLATE") } }
                  pillToolbar.addView(aiSparkleBtn); pillToolbar.addView(settingsBtn); pillToolbar.addView(fontBtn); pillToolbar.addView(transBtn)
                  toolbarContainer.addView(pillToolbar)
                  mainLayout.addView(toolbarContainer)
                  val suggestionContainer = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (30 * density).toInt()); gravity = Gravity.CENTER; setPadding((16*density).toInt(), 0, (16*density).toInt(), 0) }
                  fun createSugView(isCenter: Boolean = false): TextView { return TextView(this).apply { layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f); gravity = Gravity.CENTER; textSize = 15f; setTextColor(textColorInt); alpha = 0.9f; isClickable = true; typeface = Typeface.create("sans-serif", if(isCenter) Typeface.BOLD else Typeface.NORMAL); setOnClickListener { applySuggestion(this.text.toString()) } } }
                  sug1 = createSugView(); sug2 = createSugView(isCenter = true); sug3 = createSugView()
                  suggestionContainer.addView(sug1); suggestionContainer.addView(sug2); suggestionContainer.addView(sug3)
                  mainLayout.addView(suggestionContainer)
                  keysContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT); setPadding((6*density).toInt(), 0, (6*density).toInt(), 0) }
                  mainLayout.addView(keysContainer)
                  bottomSafeArea = FrameLayout(this).apply { layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, (50 * density).toInt()); setPadding((24*density).toInt(), (4*density).toInt(), (24*density).toInt(), (8*density).toInt())
                      val globeBtn = TextView(this@KeyboardService).apply { text = "🌐"; textSize = 24f; gravity = Gravity.CENTER; layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.MATCH_PARENT, Gravity.START or Gravity.CENTER_VERTICAL); setOnClickListener { currentLang = if(currentLang == "FR") "AR" else "FR"; currentTypedWord.clear(); updateSuggestions(); rebuildKeysLayout() }; setOnLongClickListener { (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker(); true } }
                      val micBtn = TextView(this@KeyboardService).apply { text = "🎙️"; textSize = 24f; gravity = Gravity.CENTER; layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.MATCH_PARENT, Gravity.END or Gravity.CENTER_VERTICAL); setOnClickListener { try { startActivity(Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM) }) } catch (e: Exception) { Toast.makeText(this@KeyboardService, "غير مدعوم", Toast.LENGTH_SHORT).show() } } }
                      addView(globeBtn); addView(micBtn)
                  }
                  mainLayout.addView(bottomSafeArea)
                  keyPreviewBubble = TextView(this).apply { textSize = 36f; setTextColor(textColorInt); gravity = Gravity.CENTER; typeface = Typeface.create("sans-serif", Typeface.NORMAL); setBackgroundResource(R.drawable.bg_popup_bubble); elevation = 8f * density; visibility = View.GONE; layoutParams = FrameLayout.LayoutParams((56 * density).toInt(), (64 * density).toInt()) }
                  rootFrame.addView(mainLayout); rootFrame.addView(keyPreviewBubble)
                  rebuildKeysLayout()
                  return rootFrame
              }
              private fun getLayoutRows(): List<List<KeyDef>> {
                  if (isSymbols) { return listOf(listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "0").map { KeyDef(it, 1f) }, listOf("-", "/", ":", ";", "(", ")", "€", "&", "@", "\"").map { KeyDef(it, 1f) }, listOf(KeyDef("ABC", 1.3f)) + listOf(".", ",", "?", "!", "'").map { KeyDef(it, 1f) } + listOf(KeyDef("DEL", 1.3f)), listOf(KeyDef("123", 1.5f), KeyDef("SPACE", 6.0f), KeyDef("return", 1.5f))) }
                  return when (currentLang) {
                      "AR" -> listOf("ض ص ث ق ف غ ع ه خ ح ج د".split(" ").map { KeyDef(it, 1f) }, listOf(KeyDef("SPACER", 0.5f)) + "ش س ي ب ل ا ت ن م ك ط".split(" ").map { KeyDef(it, 1f) } + listOf(KeyDef("SPACER", 0.5f)), listOf(KeyDef("SHIFT", 1.3f)) + "ذ ر ى ة و ز ظ".split(" ").map { KeyDef(it, 1f) } + listOf(KeyDef("DEL", 1.3f)), listOf(KeyDef("?123", 1.5f), KeyDef("SPACE", 6.0f), KeyDef("return", 1.5f)))
                      else -> listOf("q w e r t y u i o p".split(" ").map { KeyDef(if (isCaps) it.uppercase() else it.replace("q","a").replace("w","z"), 1f) }, "a s d f g h j k l m".split(" ").map { KeyDef(if (isCaps) it.uppercase() else it.replace("a","q"), 1f) }, listOf(KeyDef("SHIFT", 1.3f)) + "z x c v b n".split(" ").map { KeyDef(if (isCaps) it.uppercase() else it.replace("z","w"), 1f) } + listOf(KeyDef("DEL", 1.3f)), listOf(KeyDef("?123", 1.5f), KeyDef("SPACE", 6.0f), KeyDef("return", 1.5f)))
                  }
              }
              override fun onStartInputView(info: android.view.inputmethod.EditorInfo?, restarting: Boolean) { super.onStartInputView(info, restarting); heightProg = prefs.getInt("kb_height_prog", 10); currentTypedWord.clear(); updateSuggestions(); rebuildKeysLayout() }
              private fun showAltMenu(anchor: View, chars: List<String>) { val container = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setBackgroundResource(R.drawable.bg_popup_bubble); elevation = 8f * density; setPadding((8*density).toInt(), (4*density).toInt(), (8*density).toInt(), (4*density).toInt()) }; val popup = PopupWindow(container, ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, true); for (c in chars) { val btn = TextView(this).apply { text = c; textSize = 24f; setTextColor(Color.WHITE); gravity = Gravity.CENTER; setPadding((14*density).toInt(), (10*density).toInt(), (14*density).toInt(), (10*density).toInt()); typeface = Typeface.create("sans-serif", Typeface.NORMAL); setOnClickListener { currentInputConnection?.commitText(c, 1); currentTypedWord.append(c); updateSuggestions(); popup.dismiss() } }; container.addView(btn) }; val loc = IntArray(2); anchor.getLocationOnScreen(loc); popup.showAtLocation(anchor, Gravity.NO_GRAVITY, loc[0] - (40*density).toInt(), loc[1] - (60 * density).toInt()) }
              private fun rebuildKeysLayout() {
                  keysContainer.removeAllViews()
                  val rows = getLayoutRows(); val baseKeyHeight = (44 * density).toInt(); val extraPadding = (heightProg * 0.5f * density).toInt(); val keyMarginH = (3f * density).toInt(); val keyMarginV = (6f * density).toInt(); val textColorInt = ContextCompat.getColor(this, R.color.IosTextColor); val handler = Handler(Looper.getMainLooper())
                  for (row in rows) {
                      val rowLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER; layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, baseKeyHeight + extraPadding).apply { setMargins(0, keyMarginV, 0, keyMarginV) } }
                      for (keyDef in row) {
                          val label = keyDef.label
                          if (label == "SPACER") { rowLayout.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, keyDef.weight) }) } else {
                              val keyView = FrameLayout(this).apply {
                                  layoutParams = LinearLayout.LayoutParams(0, baseKeyHeight, keyDef.weight).apply { setMargins(keyMarginH, 0, keyMarginH, 0); gravity = Gravity.CENTER_VERTICAL }
                                  val isSpecial = label == "DEL" || label == "SHIFT" || label == "123" || label == "ABC" || label == "?123"
                                  val isEnter = label == "return"
                                  setBackgroundResource(if (isEnter) R.drawable.key_return_selector else if (isSpecial) R.drawable.key_special_selector else R.drawable.key_selector); isClickable = true
                                  if (label == "SHIFT" || label == "DEL") {
                                      val iconView = ImageView(this@KeyboardService).apply { layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER); setImageResource(if(label=="SHIFT") R.drawable.ic_shift else R.drawable.ic_delete); setColorFilter(textColorInt); if(label == "SHIFT" && isCaps) alpha = 1.0f else if(label == "SHIFT") alpha = 0.6f }; addView(iconView)
                                  } else {
                                      val textView = TextView(this@KeyboardService).apply { text = when (label) { "SPACE" -> "المسافة"; else -> label }; textSize = if (isSpecial || isEnter) 16f else 19f; if (label == "SPACE") alpha = 0.5f; if (isEnter) setTypeface(null, Typeface.BOLD); gravity = Gravity.CENTER; setTextColor(textColorInt); layoutParams = FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT) }; addView(textView)
                                  }
                                  var longPressRunnable: Runnable? = null; var isLongPressTriggered = false
                                  setOnTouchListener { v, event ->
                                      when (event.action) {
                                          MotionEvent.ACTION_DOWN -> { v.isPressed = true; isLongPressTriggered = false; v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); if (label.length == 1 && label != " ") { val keyX = v.x + rowLayout.x; val keyY = v.y + rowLayout.y + keysContainer.y + (44*density); keyPreviewBubble.text = label; keyPreviewBubble.x = keyX - (keyPreviewBubble.layoutParams.width - v.width) / 2f; keyPreviewBubble.y = keyY - keyPreviewBubble.layoutParams.height; keyPreviewBubble.visibility = View.VISIBLE; val alternates = altChars[label]; if (alternates != null) { longPressRunnable = Runnable { isLongPressTriggered = true; keyPreviewBubble.visibility = View.GONE; v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS); showAltMenu(v, alternates) }; handler.postDelayed(longPressRunnable!!, 300) } }; true }
                                          MotionEvent.ACTION_UP -> { v.isPressed = false; keyPreviewBubble.visibility = View.GONE; if (longPressRunnable != null) handler.removeCallbacks(longPressRunnable!!); if (!isLongPressTriggered) handleKeyClick(label); true }
                                          MotionEvent.ACTION_CANCEL -> { v.isPressed = false; keyPreviewBubble.visibility = View.GONE; if (longPressRunnable != null) handler.removeCallbacks(longPressRunnable!!); true }
                                          else -> false
                                      }
                                  }
                              }
                              rowLayout.addView(keyView)
                          }
                      }
                      keysContainer.addView(rowLayout)
                  }
              }
              private fun updateSuggestions() { if(!this::sug1.isInitialized) return; val word = currentTypedWord.toString().trim(); val dict = when(currentLang) { "AR" -> arDict; else -> frDict }; if (word.isEmpty() || isSymbols) { sug1.text = dict[0]; sug2.text = dict[1]; sug3.text = dict[2]; return }; val matches = mutableListOf<String>(); for (item in dict) { if (item.length >= word.length && item.startsWith(word, ignoreCase = true)) matches.add(item) }; sug1.text = if (matches.size > 0) matches[0] else ""; sug2.text = word; sug3.text = if (matches.size > 1) matches[1] else "" }
              private fun applySuggestion(sug: String) { if (sug.isEmpty()) return; val ic = currentInputConnection ?: return; ic.deleteSurroundingText(currentTypedWord.length, 0); ic.commitText(sug + " ", 1); currentTypedWord.clear(); updateSuggestions() }
              private fun handleKeyClick(key: String) {
                  val ic = currentInputConnection ?: return
                  when (key) {
                      "DEL" -> { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_DEL)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DEL)); if (currentTypedWord.isNotEmpty()) currentTypedWord.deleteCharAt(currentTypedWord.length - 1) }
                      "SPACE", "return" -> { if (key == "SPACE") { val autoCorrect = sug1.text.toString(); if (autoCorrect.isNotEmpty() && autoCorrect != arDict[0] && autoCorrect != frDict[0] && currentTypedWord.isNotEmpty()) { ic.deleteSurroundingText(currentTypedWord.length, 0); ic.commitText(autoCorrect + " ", 1) } else { ic.commitText(" ", 1) } } else { ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER)); ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER)) }; currentTypedWord.clear() }
                      "SHIFT" -> { isCaps = !isCaps; rebuildKeysLayout() }
                      "123", "?123" -> { isSymbols = true; rebuildKeysLayout(); updateSuggestions() }
                      "ABC" -> { isSymbols = false; rebuildKeysLayout(); updateSuggestions() }
                      else -> { val letter = if (isCaps && !isSymbols && currentLang != "AR") key.uppercase() else key; ic.commitText(letter, 1); if (isCaps) { isCaps = false; rebuildKeysLayout() }; if (key.length == 1 && !isSymbols) { currentTypedWord.append(letter) } }
                  }
                  updateSuggestions()
              }
              private fun performAiAction(actionType: String) {
                  val apiKey = prefs.getString("api_key", ""); if (apiKey.isNullOrEmpty()) { Toast.makeText(this, "ضع المفتاح من الإعدادات", Toast.LENGTH_SHORT).show(); return }
                  val ic = currentInputConnection ?: return; val extractedText = ic.getExtractedText(android.view.inputmethod.ExtractedTextRequest(), 0)?.text?.toString() ?: ""
                  if (extractedText.isBlank()) { Toast.makeText(this, "حدد نصاً أولاً", Toast.LENGTH_SHORT).show(); return }; Toast.makeText(this, "الذكاء الاصطناعي يعمل...", Toast.LENGTH_SHORT).show()
                  scope.launch {
                      try {
                          val responseStr = withContext(Dispatchers.IO) { val conn = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey").openConnection() as HttpURLConnection; conn.requestMethod = "POST"; conn.setRequestProperty("Content-Type", "application/json"); conn.doOutput = true; val prompt = if(actionType == "FIX") "صحح النص: $extractedText" else "ترجم النص: $extractedText"; val payload = JSONObject().apply { put("contents", org.json.JSONArray().apply { put(JSONObject().apply { put("parts", org.json.JSONArray().apply { put(JSONObject().apply { put("text", prompt) }) }) }) }) }; OutputStreamWriter(conn.outputStream).use { it.write(payload.toString()) }; conn.inputStream.bufferedReader().use { it.readText() } }
                          val reply = JSONObject(responseStr).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text").trim(); withContext(Dispatchers.Main) { ic.deleteSurroundingText(extractedText.length, 0); ic.commitText(reply, 1) }
                      } catch (e: Exception) { withContext(Dispatchers.Main) { Toast.makeText(this@KeyboardService, "خطأ بالاتصال", Toast.LENGTH_SHORT).show() } }
                  }
              }
              override fun onDestroy() { super.onDestroy(); scope.cancel() }
          }
          EOF

          # ---- إضافة صلاحية الرسم فوق التطبيقات (System Alert Window) ----
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <!-- الصلاحية المطلوبة للجزيرة التفاعلية -->
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.AIKeyboard">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <!-- كيبورد iOS -->
                  <service android:name=".KeyboardService" android:label="@string/ime_name" android:permission="android.permission.BIND_INPUT_METHOD" android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>

                  <!-- خدمة الجزيرة التفاعلية -->
                  <service android:name=".DynamicIslandService" android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/Dynamic-Island-Pro.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Island-Pro
          path: release-output/Dynamic-Island-Pro.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ios-island-v1.0
          name: "Dynamic Island Pro - (The First Island 🏝️)"
          body: "1. 🏝️ **الجزيرة التفاعلية (Dynamic Island):** تمت إضافة خدمة تطفو فوق الشاشة بشريط أسود أنيق.\n2. 🪄 **أنيميشن سلس (Overshoot):** اضغط على الجزيرة لتتوسع وتظهر التفاصيل، واضغط مرة أخرى لتصغر بحركة مرنة وجميلة جداً.\n3. 🔐 **إدارة الصلاحيات:** زر في الإعدادات لطلب سماحية الظهور فوق التطبيقات.\n4. ⌨️ **كيبورد الـ iOS ثابت:** الكيبورد الذي صممناه بكود Compose يعمل بشكل مثالي كالمعتاد."
          files: release-output/Dynamic-Island-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Dynamic Island Nano Pro V2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Android APK for Dynamic Island
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Dynamic Island Compose Project
        run: |
          rm -rf app/src/main/res app/src/main/java
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/java/com/dynamicisland/aipro app/src/main/res/mipmap-anydpi-v26

          cat << 'INNER_EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          INNER_EOF

          cat << 'INNER_EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DynamicIslandAIPro"
          include(":app")
          INNER_EOF

          cat << 'INNER_EOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          INNER_EOF

          cat << 'INNER_EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.dynamicisland.aipro"
              compileSdk = 34
              defaultConfig { applicationId = "com.dynamicisland.aipro"; minSdk = 28; targetSdk = 34; versionCode = 11; versionName = "2.0.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-service:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Dynamic Island Pro</string>
          </resources>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#000000"/></shape>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00FF88" android:pathData="M24,44h60v20h-60zM44,44a10,10 0 0,1 20,0a10,10 0 0,1 -20,0z"/>
          </vector>
          INNER_EOF
          
          cat << 'INNER_EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_bg"/><foreground android:drawable="@drawable/ic_launcher_fg"/></adaptive-icon>
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/IslandNotificationListener.kt
          package com.dynamicisland.aipro

          import android.app.Notification
          import android.content.Intent
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class IslandNotificationListener : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val extras = sbn.notification.extras
                  val title = extras.getString("android.title") ?: return
                  val text = extras.getCharSequence("android.text")?.toString() ?: return
                  val pkg = sbn.packageName
                  
                  if ((sbn.notification.flags and Notification.FLAG_GROUP_SUMMARY) != 0) return
                  val isMedia = extras.containsKey(Notification.EXTRA_MEDIA_SESSION) || extras.getString(Notification.EXTRA_TEMPLATE) == "android.app.Notification\$MediaStyle"
                  val intent = Intent("com.dynamicisland.aipro.NEW_EVENT")
                  
                  if (isMedia) {
                      intent.putExtra("type", "MUSIC")
                      intent.putExtra("title", title)
                      intent.putExtra("text", text)
                      intent.putExtra("icon", "🎵")
                      intent.putExtra("color", "#1DB954")
                  } else {
                      if (sbn.isOngoing) return
                      val colorHex = when {
                          pkg.contains("facebook") || pkg.contains("messenger") -> "#1877F2"
                          pkg.contains("whatsapp") -> "#25D366"
                          pkg.contains("instagram") -> "#E1306C"
                          pkg.contains("twitter") || pkg.contains("x") -> "#1DA1F2"
                          pkg.contains("snapchat") -> "#FFFC00"
                          pkg.contains("tiktok") -> "#00F2FE"
                          pkg.contains("youtube") -> "#FF0000"
                          pkg.contains("gmail") -> "#EA4335"
                          pkg.contains("telegram") -> "#0088CC"
                          else -> "#FFFFFF"
                      }
                      intent.putExtra("type", "MSG")
                      intent.putExtra("title", title)
                      intent.putExtra("text", text)
                      intent.putExtra("icon", "💬")
                      intent.putExtra("color", colorHex)
                  }
                  sendBroadcast(intent)
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/DynamicIslandService.kt
          package com.dynamicisland.aipro

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.res.Configuration
          import android.graphics.PixelFormat
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ViewConfiguration
          import android.view.WindowManager
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.ComposeView
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.app.NotificationCompat
          import androidx.lifecycle.LifecycleService
          import androidx.lifecycle.ViewModelStore
          import androidx.lifecycle.ViewModelStoreOwner
          import androidx.lifecycle.setViewTreeLifecycleOwner
          import androidx.lifecycle.setViewTreeViewModelStoreOwner
          import androidx.savedstate.SavedStateRegistry
          import androidx.savedstate.SavedStateRegistryController
          import androidx.savedstate.SavedStateRegistryOwner
          import androidx.savedstate.setViewTreeSavedStateRegistryOwner

          enum class IslandMode { IDLE, EVENT_COMPACT, EVENT_EXPANDED, HIDDEN }

          data class IslandEvent(
              val type: String = "MSG",
              val title: String = "",
              val text: String = "",
              val icon: String = "💬",
              val colorStr: String = "#FFFFFF"
          ) {
              val color: Color get() = try { Color(android.graphics.Color.parseColor(colorStr)) } catch(e:Exception){ Color.White }
          }

          @Composable
          fun AudioVisualizer(color: Color) {
              val transition = rememberInfiniteTransition(label = "audio")
              val anim1 by transition.animateFloat(initialValue = 0.3f, targetValue = 1f, animationSpec = infiniteRepeatable(animation = tween(300, easing = LinearEasing), repeatMode = RepeatMode.Reverse), label = "a1")
              val anim2 by transition.animateFloat(initialValue = 0.9f, targetValue = 0.2f, animationSpec = infiniteRepeatable(animation = tween(250, easing = LinearEasing), repeatMode = RepeatMode.Reverse), label = "a2")
              val anim3 by transition.animateFloat(initialValue = 0.4f, targetValue = 0.9f, animationSpec = infiniteRepeatable(animation = tween(400, easing = LinearEasing), repeatMode = RepeatMode.Reverse), label = "a3")

              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(2.dp), modifier = Modifier.height(12.dp)) {
                  Box(modifier = Modifier.width(3.dp).fillMaxHeight(anim1).background(color, CircleShape))
                  Box(modifier = Modifier.width(3.dp).fillMaxHeight(anim2).background(color, CircleShape))
                  Box(modifier = Modifier.width(3.dp).fillMaxHeight(anim3).background(color, CircleShape))
              }
          }

          class DynamicIslandService : LifecycleService(), ViewModelStoreOwner, SavedStateRegistryOwner {

              private lateinit var windowManager: WindowManager
              private lateinit var composeView: ComposeView
              private lateinit var params: WindowManager.LayoutParams
              private lateinit var prefs: SharedPreferences

              private val store = ViewModelStore()
              private val savedStateRegistryController = SavedStateRegistryController.create(this)
              override val viewModelStore: ViewModelStore get() = store
              override val savedStateRegistry: SavedStateRegistry get() = savedStateRegistryController.savedStateRegistry

              private val islandModeState = mutableStateOf(IslandMode.IDLE)
              private val currentEventState = mutableStateOf(IslandEvent())

              private val islandWidthState = mutableStateOf(60.dp)
              private val islandHeightState = mutableStateOf(26.dp)
              private val glowWidthState = mutableStateOf(2.dp)

              private val handler = Handler(Looper.getMainLooper())
              private val collapseRunnable = Runnable { 
                  if (islandModeState.value == IslandMode.EVENT_COMPACT) islandModeState.value = IslandMode.IDLE 
              }

              private val eventReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == "com.dynamicisland.aipro.NEW_EVENT") {
                          if (resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE) return // تجاهل الإشعارات في الوضع الأفقي
                          
                          val type = intent.getStringExtra("type") ?: "MSG"
                          val title = intent.getStringExtra("title") ?: ""
                          val text = intent.getStringExtra("text") ?: ""
                          val icon = intent.getStringExtra("icon") ?: "💬"
                          val color = intent.getStringExtra("color") ?: "#FFFFFF"
                          
                          currentEventState.value = IslandEvent(type, title, text, icon, color)
                          islandModeState.value = IslandMode.EVENT_COMPACT 
                          
                          handler.removeCallbacks(collapseRunnable)
                          handler.postDelayed(collapseRunnable, 4000)
                      }
                  }
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  if (newConfig.orientation == Configuration.ORIENTATION_LANDSCAPE) {
                      islandModeState.value = IslandMode.HIDDEN
                  } else {
                      islandModeState.value = IslandMode.IDLE
                  }
              }

              private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { sharedPreferences, key ->
                  when (key) {
                      "width" -> islandWidthState.value = sharedPreferences.getInt("width", 60).dp
                      "height" -> islandHeightState.value = sharedPreferences.getInt("height", 26).dp
                      "glow" -> glowWidthState.value = sharedPreferences.getInt("glow", 2).dp
                      "pos_x" -> { params.x = sharedPreferences.getInt("pos_x", 0); windowManager.updateViewLayout(composeView, params) }
                      "pos_y" -> { params.y = sharedPreferences.getInt("pos_y", 32); windowManager.updateViewLayout(composeView, params) }
                  }
              }

              private fun startForegroundServiceRobust() {
                  val channelId = "island_service_hidden"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "System", NotificationManager.IMPORTANCE_MIN).apply {
                          description = "Core Process"
                          setShowBadge(false)
                      }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  
                  // جعل الإشعار مزعجاً أقل قدر الإمكان
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("")
                      .setContentText("")
                      .setSmallIcon(android.R.drawable.stat_sys_warning) // أيقونة صغيرة جداً
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .setCategory(Notification.CATEGORY_SERVICE)
                      .build()
                      
                  startForeground(1, notification)
              }

              override fun onCreate() {
                  super.onCreate()
                  savedStateRegistryController.performRestore(null)
                  prefs = getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                  prefs.registerOnSharedPreferenceChangeListener(prefListener)
                  
                  startForegroundServiceRobust()
                  
                  islandWidthState.value = prefs.getInt("width", 60).dp
                  islandHeightState.value = prefs.getInt("height", 26).dp
                  glowWidthState.value = prefs.getInt("glow", 2).dp

                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  composeView = ComposeView(this)
                  composeView.setViewTreeLifecycleOwner(this)
                  composeView.setViewTreeViewModelStoreOwner(this)
                  composeView.setViewTreeSavedStateRegistryOwner(this)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(eventReceiver, IntentFilter("com.dynamicisland.aipro.NEW_EVENT"), Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(eventReceiver, IntentFilter("com.dynamicisland.aipro.NEW_EVENT"))
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_INSET_DECOR,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      x = prefs.getInt("pos_x", 0)
                      y = prefs.getInt("pos_y", 32)
                  }

                  var initialX = 0; var initialY = 0; var initialTouchX = 0f; var initialTouchY = 0f; var isMoving = false
                  val touchSlop = ViewConfiguration.get(this).scaledTouchSlop

                  composeView.setOnTouchListener { _, event ->
                      if (islandModeState.value == IslandMode.HIDDEN) return@setOnTouchListener false

                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> { 
                              initialX = params.x; initialY = params.y; initialTouchX = event.rawX; initialTouchY = event.rawY; isMoving = false 
                              true 
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - initialTouchX).toInt(); val dy = (event.rawY - initialTouchY).toInt()
                              if (Math.abs(dx) > touchSlop || Math.abs(dy) > touchSlop) { 
                                  isMoving = true; params.x = initialX + dx; params.y = initialY + dy; windowManager.updateViewLayout(composeView, params)
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!isMoving) {
                                  when (islandModeState.value) {
                                      IslandMode.IDLE -> {}
                                      IslandMode.EVENT_COMPACT -> { islandModeState.value = IslandMode.EVENT_EXPANDED; handler.removeCallbacks(collapseRunnable) }
                                      IslandMode.EVENT_EXPANDED -> islandModeState.value = IslandMode.IDLE
                                      IslandMode.HIDDEN -> {}
                                  }
                              } else { prefs.edit().putInt("pos_x", params.x).putInt("pos_y", params.y).apply() }
                              true
                          }
                          else -> false
                      }
                  }

                  composeView.setContent {
                      if (islandModeState.value != IslandMode.HIDDEN) {
                          DynamicIslandContent(
                              mode = islandModeState.value,
                              event = currentEventState.value,
                              baseWidth = islandWidthState.value,
                              baseHeight = islandHeightState.value,
                              glow = glowWidthState.value,
                              onOpenSettings = {
                                  islandModeState.value = IslandMode.IDLE
                                  startActivity(Intent(Settings.ACTION_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                              }
                          )
                      }
                  }
                  windowManager.addView(composeView, params)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  unregisterReceiver(eventReceiver); prefs.unregisterOnSharedPreferenceChangeListener(prefListener)
                  if (::composeView.isInitialized) windowManager.removeView(composeView)
              }
          }

          @Composable
          fun DynamicIslandContent(
              mode: IslandMode, event: IslandEvent, baseWidth: androidx.compose.ui.unit.Dp, baseHeight: androidx.compose.ui.unit.Dp, glow: androidx.compose.ui.unit.Dp, onOpenSettings: () -> Unit
          ) {
              // 1. حساب العرض والارتفاع المطلوبين (الانبثاق يحدث من الجزيرة نفسها!)
              val targetWidth = when (mode) {
                  IslandMode.IDLE -> baseWidth
                  IslandMode.EVENT_COMPACT -> 260.dp // الكبسولة العرضية
                  IslandMode.EVENT_EXPANDED -> 320.dp
                  else -> 0.dp
              }
              
              val targetHeight = when (mode) {
                  IslandMode.IDLE -> baseHeight
                  IslandMode.EVENT_COMPACT -> baseHeight // تحافظ على نحافتها
                  IslandMode.EVENT_EXPANDED -> if (event.type == "MUSIC") 140.dp else 100.dp
                  else -> 0.dp
              }

              // 2. أنيميشن أسرع (Snappy) لتغيير الأبعاد
              val animatedWidth by animateDpAsState(targetValue = targetWidth, animationSpec = spring(dampingRatio = 0.65f, stiffness = 600f), label = "width")
              val animatedHeight by animateDpAsState(targetValue = targetHeight, animationSpec = spring(dampingRatio = 0.65f, stiffness = 600f), label = "height")

              // التوهج: يعرض لون الإشعار حتى وهو مصغر!
              val borderColor = if (mode != IslandMode.IDLE && glow > 0.dp) event.color else Color.Transparent

              Box(
                  modifier = Modifier
                      .width(animatedWidth)
                      .height(animatedHeight)
                      .border(glow, borderColor, CircleShape) // الكبسولة الدائرية دائماً
                      .background(Color.Black, CircleShape),
                  contentAlignment = Alignment.Center
              ) {
                  // محتوى الإشعار المصغر النحيف
                  androidx.compose.animation.AnimatedVisibility(
                      visible = mode == IslandMode.EVENT_COMPACT,
                      enter = fadeIn(animationSpec = tween(150)),
                      exit = fadeOut(animationSpec = tween(150))
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          if (event.type == "MUSIC") {
                              AudioVisualizer(color = event.color)
                          } else {
                              Box(modifier = Modifier.size(baseHeight * 0.7f).clip(CircleShape).background(event.color.copy(alpha = 0.2f)), contentAlignment = Alignment.Center) {
                                  Text(event.icon, fontSize = 10.sp)
                              }
                          }
                          Spacer(modifier = Modifier.width(8.dp))
                          val combinedText = if(event.title.isNotEmpty() && event.text.isNotEmpty()) "${event.title} • ${event.text}" else event.title + event.text
                          Text(text = combinedText, color = Color.White, fontSize = 12.sp, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
                      }
                  }

                  // محتوى الإشعار الموسع (Expanded)
                  androidx.compose.animation.AnimatedVisibility(
                      visible = mode == IslandMode.EVENT_EXPANDED,
                      enter = fadeIn(animationSpec = tween(200, delayMillis = 100)),
                      exit = fadeOut(animationSpec = tween(100))
                  ) {
                      if (event.type == "MUSIC") {
                          Column(modifier = Modifier.fillMaxWidth().padding(16.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Box(modifier = Modifier.size(44.dp).background(Color(0x331DB954), CircleShape), contentAlignment = Alignment.Center) {
                                      AudioVisualizer(color = Color.White)
                                  }
                                  Spacer(modifier = Modifier.width(12.dp))
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(text = event.title, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                      Text(text = event.text, color = Color.LightGray, fontSize = 13.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  }
                                  // زر الإعدادات بتصميم Material You أنيق
                                  Box(modifier = Modifier.size(36.dp).clip(CircleShape).background(Color(0x22FFFFFF)).clickable { onOpenSettings() }, contentAlignment = Alignment.Center) {
                                      Text("⚙️", fontSize = 16.sp)
                                  }
                              }
                              Spacer(modifier = Modifier.height(16.dp))
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly, verticalAlignment = Alignment.CenterVertically) {
                                  Box(modifier = Modifier.size(36.dp).background(Color(0x22FFFFFF), CircleShape).clickable{}, contentAlignment = Alignment.Center) { Text("⏮", fontSize = 16.sp) }
                                  Box(modifier = Modifier.size(48.dp).background(Color(0xFFA8E5BA), CircleShape).clickable{}, contentAlignment = Alignment.Center) { Text("⏸", fontSize = 24.sp) }
                                  Box(modifier = Modifier.size(36.dp).background(Color(0x22FFFFFF), CircleShape).clickable{}, contentAlignment = Alignment.Center) { Text("⏭", fontSize = 16.sp) }
                              }
                          }
                      } else {
                          Column(modifier = Modifier.fillMaxWidth().padding(16.dp), horizontalAlignment = Alignment.Start) {
                              Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.fillMaxWidth()) {
                                  Box(modifier = Modifier.size(32.dp).background(Color(0x33FFFFFF), CircleShape), contentAlignment = Alignment.Center) {
                                      Text(event.icon, fontSize = 14.sp)
                                  }
                                  Spacer(modifier = Modifier.width(12.dp))
                                  Text(text = event.title, color = event.color, fontSize = 14.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                                  Box(modifier = Modifier.size(32.dp).clip(CircleShape).background(Color(0x22FFFFFF)).clickable { onOpenSettings() }, contentAlignment = Alignment.Center) {
                                      Text("⚙️", fontSize = 14.sp)
                                  }
                              }
                              Spacer(modifier = Modifier.height(10.dp))
                              Text(text = event.text, color = Color.White, fontSize = 13.sp, lineHeight = 18.sp, maxLines = 2, overflow = TextOverflow.Ellipsis)
                          }
                      }
                  }
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/java/com/dynamicisland/aipro/MainActivity.kt
          package com.dynamicisland.aipro

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              
              private fun restartActivity() {
                  finish()
                  startActivity(intent)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("island_prefs", Context.MODE_PRIVATE)
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }

                  var currentLang = prefs.getString("lang", "fr") ?: "fr"
                  val isFr = currentLang == "fr"

                  val tTitle = if(isFr) "Paramètres de l'île 🏝️" else "إعدادات الجزيرة 🏝️"
                  val tGlow = if(isFr) "Épaisseur de la lueur (Glow)" else "سمك الضوء المتفاعل (Glow)"
                  val tWidth = if(isFr) "Largeur de l'île (Width)" else "العرض (Width)"
                  val tHeight = if(isFr) "Hauteur (Height)" else "الارتفاع (Height)"
                  val tX = if(isFr) "Gauche / Droite (X Axis)" else "يمين / يسار (X Axis)"
                  val tY = if(isFr) "Haut / Bas (Y Axis)" else "أعلى / أسفل (Y Axis)"
                  val tTestMsg = if(isFr) "Tester Notification 💬" else "تجربة إشعار منفصل 💬"
                  val tTestMus = if(isFr) "Tester Musique 🎵" else "تجربة مشغل الموسيقى 🎵"
                  val tStart = if(isFr) "Mettre à jour / Démarrer 🚀" else "تحديث / تشغيل الجزيرة 🚀"
                  
                  // تم تعديل منطق زر اللغة (إذا كانت فرنسية، الزر يعرض التبديل للعربية)
                  val tLangBtn = if(isFr) "🌍 التبديل إلى العربية" else "🌍 Passer au Français"

                  val dp = resources.displayMetrics.density
                  val bgDark = Color.parseColor("#101411")
                  val pillActive = Color.parseColor("#A8E5BA")
                  val pillInactive = Color.parseColor("#2D322E")
                  val textOnActive = Color.parseColor("#0F2015")
                  val textOnDark = Color.parseColor("#E1E3DF")

                  val scrollView = ScrollView(this).apply { setBackgroundColor(bgDark); isFillViewport = true }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding((16*dp).toInt(), (24*dp).toInt(), (16*dp).toInt(), (24*dp).toInt())
                  }
                  scrollView.addView(root)
                  
                  // زر اللغة بتصميم Material You (كبسولة صغيرة أعلى الشاشة)
                  val langBtnContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.END or Gravity.CENTER_VERTICAL
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      
                      val btn = TextView(this@MainActivity).apply {
                          text = tLangBtn
                          textSize = 13f
                          setTextColor(Color.WHITE)
                          background = GradientDrawable().apply { setColor(pillInactive); cornerRadius = 16f * dp }
                          setPadding((16*dp).toInt(), (8*dp).toInt(), (16*dp).toInt(), (8*dp).toInt())
                          setOnClickListener {
                              val newLang = if (isFr) "ar" else "fr"
                              prefs.edit().putString("lang", newLang).apply()
                              restartActivity()
                          }
                      }
                      addView(btn)
                  }
                  root.addView(langBtnContainer)

                  root.addView(TextView(this).apply {
                      text = tTitle
                      textSize = 26f; setTextColor(textOnDark); gravity = Gravity.CENTER; typeface = android.graphics.Typeface.DEFAULT_BOLD
                      setPadding(0, (16*dp).toInt(), 0, (24*dp).toInt())
                  })

                  fun createMaterialSlider(currentVal: Float, min: Float, max: Float, onUpdate: (Float) -> Unit): View {
                      val containerHeight = (14 * dp).toInt() 
                      val container = FrameLayout(this@MainActivity).apply {
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, containerHeight)
                          background = GradientDrawable().apply { setColor(pillInactive); cornerRadius = containerHeight / 2f }
                      }
                      val fillView = View(this@MainActivity).apply {
                          layoutParams = FrameLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT)
                          background = GradientDrawable().apply { setColor(pillActive); cornerRadius = containerHeight / 2f }
                      }
                      container.addView(fillView)
                      var currentWidth = currentVal
                      fun updateFillWidth(totalWidth: Int) {
                          if (totalWidth <= 0) return
                          val progress = ((currentWidth - min) / (max - min)).coerceIn(0f, 1f)
                          val fillWidth = (containerHeight + progress * (totalWidth - containerHeight)).toInt()
                          fillView.layoutParams = FrameLayout.LayoutParams(fillWidth, ViewGroup.LayoutParams.MATCH_PARENT)
                          fillView.requestLayout()
                      }
                      container.addOnLayoutChangeListener { _, left, _, right, _, oldLeft, _, oldRight, _ ->
                          val width = right - left; val oldWidth = oldRight - oldLeft
                          if (width > 0 && width != oldWidth) updateFillWidth(width)
                      }
                      container.post { updateFillWidth(container.width) }
                      container.setOnTouchListener { v, event ->
                          val totalWidth = v.width
                          if (totalWidth <= 0) return@setOnTouchListener false
                          var newWidth = event.x.toInt()
                          if (newWidth < containerHeight) newWidth = containerHeight
                          if (newWidth > totalWidth) newWidth = totalWidth
                          fillView.layoutParams = FrameLayout.LayoutParams(newWidth, ViewGroup.LayoutParams.MATCH_PARENT)
                          fillView.requestLayout()
                          val progress = (newWidth - containerHeight).toFloat() / (totalWidth - containerHeight).toFloat()
                          currentWidth = min + (progress * (max - min))
                          onUpdate(currentWidth)
                          true
                      }
                      return container
                  }

                  fun createSliderSection(title: String, initial: Float, min: Float, max: Float, onUpdate: (Float) -> Unit) {
                      val label = TextView(this@MainActivity).apply {
                          text = title + ": " + initial.toInt()
                          textSize = 14f; setTextColor(Color.WHITE); setPadding(0, 0, 0, (6*dp).toInt()) 
                      }
                      val slider = createMaterialSlider(initial, min, max) { newVal ->
                          label.text = title + ": " + newVal.toInt()
                          onUpdate(newVal)
                      }
                      val section = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = (22*dp).toInt() } 
                      }
                      section.addView(label); section.addView(slider); root.addView(section)
                  }

                  createSliderSection(tGlow, prefs.getInt("glow", 2).toFloat(), 0f, 10f) { prefs.edit().putInt("glow", it.toInt()).apply() }
                  createSliderSection(tWidth, prefs.getInt("width", 60).toFloat(), 30f, 400f) { prefs.edit().putInt("width", it.toInt()).apply() }
                  createSliderSection(tHeight, prefs.getInt("height", 26).toFloat(), 10f, 150f) { prefs.edit().putInt("height", it.toInt()).apply() }
                  // تم إزالة الاستدارة (Corner Radius) وجعلها Pill شكل الكبسولة الموحد
                  createSliderSection(tX, prefs.getInt("pos_x", 0).toFloat(), -600f, 600f) { prefs.edit().putInt("pos_x", it.toInt()).apply() }
                  createSliderSection(tY, prefs.getInt("pos_y", 32).toFloat(), -800f, 500f) { prefs.edit().putInt("pos_y", it.toInt()).apply() }

                  root.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(1, 0, 1f) }) 

                  fun createTestButton(title: String, isMusic: Boolean): View {
                      return LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          background = GradientDrawable().apply { setColor(Color.parseColor("#1E2320")); cornerRadius = 16f * dp } 
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, (52*dp).toInt()).apply { topMargin = (10*dp).toInt() } 
                          gravity = Gravity.CENTER
                          addView(TextView(context).apply { text = title; textSize = 15f; setTextColor(Color.WHITE); typeface = android.graphics.Typeface.DEFAULT_BOLD })
                          setOnClickListener {
                              val i = Intent("com.dynamicisland.aipro.NEW_EVENT")
                              if (isMusic) {
                                  i.putExtra("type", "MUSIC"); i.putExtra("title", "Blinding Lights"); i.putExtra("text", "The Weeknd"); i.putExtra("icon", "🎵"); i.putExtra("color", "#1DB954")
                              } else {
                                  i.putExtra("type", "MSG"); i.putExtra("title", "✨ Info"); i.putExtra("text", "Test de Notification"); i.putExtra("icon", "💬"); i.putExtra("color", "#0088CC")
                              }
                              sendBroadcast(i)
                          }
                      }
                  }
                  
                  root.addView(createTestButton(tTestMsg, false))
                  root.addView(createTestButton(tTestMus, true))

                  val btn = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      background = GradientDrawable().apply { setColor(pillActive); cornerRadius = 16f * dp }
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, (54*dp).toInt()).apply { topMargin = (12*dp).toInt() }
                      gravity = Gravity.CENTER
                      addView(TextView(context).apply { text = tStart; textSize = 16f; setTextColor(textOnActive); typeface = android.graphics.Typeface.DEFAULT_BOLD })
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          } else {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(Intent(this@MainActivity, DynamicIslandService::class.java))
                              } else {
                                  startService(Intent(this@MainActivity, DynamicIslandService::class.java))
                              }
                          }
                      }
                  }
                  root.addView(btn)
                  setContentView(scrollView)
              }
          }
          INNER_EOF

          cat << 'INNER_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  
                  <service android:name=".DynamicIslandService" android:exported="false" android:foregroundServiceType="specialUse" />
                  
                  <service android:name=".IslandNotificationListener" android:label="Dynamic Island Notifications" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          INNER_EOF
          
          gradle wrapper --gradle-version 8.4 --no-daemon

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean Project Cache
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/Dynamic-Island-Pro.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Island-Pro
          path: release-output/Dynamic-Island-Pro.apk
          retention-days: 5

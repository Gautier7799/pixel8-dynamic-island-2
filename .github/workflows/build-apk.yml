name: Build Dynamic Island Pixel 8 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # تنظيف الملفات الخاطئة وإنشاء الموارد النظيفة 100%
      - name: Clean & Fix Resources
        run: |
          # 1. مسح أي ملف تالف في مجلد drawable لحذف الملف المشكلة
          rm -rf app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 2. إنشاء الملف النظيف بالاسم الصحيح bg_island_capsule.xml
          cat << 'EOF' > app/src/main/res/drawable/bg_island_capsule.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#000000" />
              <corners android:radius="24dp" />
              <stroke
                  android:width="1dp"
                  android:color="#33FFFFFF" />
          </shape>
          EOF

          # 3. إنشاء أيقونة التطبيق الرسمية
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#000000"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M30,45h48a9,9 0 0,1 9,9v0a9,9 0 0,1 -9,9h-48a9,9 0 0,1 -9,-9v0a9,9 0 0,1 9,-9z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/black"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/black"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 4. ملفات القيم والألوان
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Pixel 8 Island</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF

          # 5. ضبط AndroidX
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 6. البناء الرسمي للـ APK
      - name: Build Debug APK
        run: gradle assembleDebug -x test -x lint --stacktrace

      # 7. رفع ملف الـ APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-Pixel8-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
